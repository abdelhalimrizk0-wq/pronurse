        let flatQuizData = [];
        rawQuizData.forEach(section => {
            section.questions.forEach(q => {
                // Shuffle options only
                const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                flatQuizData.push({
                    sectionTitle: section.sectionTitle,
                    question: q.question,
                    options: opts.map(o => o.text),
                    correct: opts.findIndex(o => o.isCorrect),
                    rationale: "Correct Answer is: " + q.options[q.correct]
                });
            });
        });

        // --- RENDER LOGIC ---
        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${flatQuizData.length}`;
            let htmlContent = "";
            let currentSection = "";

            flatQuizData.forEach((q, index) => {
                // Add Section Header if it changed
                if (q.sectionTitle !== currentSection) {
                    currentSection = q.sectionTitle;
                    htmlContent += `
                    <div class="mt-12 mb-6 bg-blue-600 text-white py-4 px-6 rounded-xl shadow-md border-l-8 border-blue-800">
                        <h2 class="text-2xl font-bold font-cairo text-left" dir="auto">${currentSection}</h2>
                    </div>`;
                }

                htmlContent += `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100 shadow-sm relative">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;" dir="auto">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `
                        <button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white">

                        </button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong><i class="fas fa-info-circle mr-1"></i> Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            });
            container.innerHTML = htmlContent;
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = flatQuizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return; // Prevent double clicking
            
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { 
                    btn.classList.add('correct-answer'); 
                    btn.innerHTML += '<i class="fas fa-check float-right text-xl"></i>'; 
                } else if (i === optIndex) { 
                    btn.classList.add('wrong-answer'); 
                    btn.innerHTML += '<i class="fas fa-times float-right text-xl"></i>'; 
                } else { 
                    btn.classList.add('opacity-50'); 
                }
            });
            
            if (optIndex === q.correct) score++;
            answeredCount++;
            
            if (answeredCount === flatQuizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');

            }
        };
