    <script>
        // --- 1. QUESTIONS ARRAY ---
        const rawQuizData = [
            // Multiple Choice Questions
            { id: 1, question: "Surgery that is performed to repair a congenitally defective organ is known as:", options: ["Cosmetic surgery", "Palliative surgery", "Reconstructive surgery", "Constructive surgery"], correct: 3, rationale: "Constructive surgery is performed to build or repair tissues and organs that are affected by congenital anomalies (e.g., cleft palate repair)." },
            { id: 2, question: "The postoperative hiccup that results from irritation of the phrenic nerve by sub-diaphragmatic abscess or abdominal distension is described as:", options: ["Direct", "Indirect", "Reflexive", "Transient"], correct: 2, rationale: "Reflexive hiccups occur due to indirect irritation of the phrenic nerve via the peritoneum or pleura, commonly caused by conditions like gastric distension or a sub-diaphragmatic abscess." },
            { id: 3, question: "The surgery that must be performed immediately to save or maintain life is defined as:", options: ["Imperative urgent surgery", "Elective surgery", "Planned or required surgery", "Emergent surgery"], correct: 3, rationale: "Emergent (emergency) surgery is critical and must be performed immediately without delay to save the patient's life or limb." },
            { id: 4, question: "The preoperative checklist is usually completed and signed by ______ before the patient is transported from the unit to the operating theater.", options: ["Anesthesia nurse", "Preoperative nurse", "Circulating nurse", "Scrub nurse"], correct: 1, rationale: "The preoperative nurse (or ward nurse) is responsible for ensuring all preparations are complete and signing the checklist before transferring the patient to the OR." },
            { id: 5, question: "Preparing the operating room with necessary equipment and supplies and ensuring that the needed equipment is functional. This is considered from the role of:", options: ["Circulating nurse", "Scrub nurse", "Anesthesia nurse", "Assistant nurse"], correct: 0, rationale: "The circulating nurse manages the overall OR environment, ensuring all necessary equipment is present, safe, and fully functional prior to the procedure." },
            { id: 6, question: "All the following are considered from postoperative discomfort Except:", options: ["Nausea and vomiting", "Hiccups", "Abdominal distension", "Shock"], correct: 3, rationale: "Shock is a severe, potentially life-threatening postoperative complication that requires immediate medical intervention, not merely a 'discomfort'." },
            { id: 7, question: "All the following are considered from early postoperative complication Except:", options: ["Hemorrhage", "Shock", "Atelectasis", "Aspiration"], correct: 2, rationale: "While hemorrhage, shock, and aspiration are immediate/early postoperative risks, atelectasis typically develops slightly later (usually 24 to 48 hours postoperatively)." },
            { id: 8, question: "Preparing anesthesia equipment and attaching the patient to monitoring devices. This is the role of:", options: ["Circulating nurse", "Scrub nurse", "Anesthesia nurse", "Assistant nurse"], correct: 2, rationale: "The anesthesia nurse (or anesthesia provider) is specifically responsible for preparing anesthetic agents, equipment, and managing patient monitoring devices." },
            { id: 9, question: "A nurse teaches deep breathing exercises to a patient scheduled for surgery. In which phase does this occur?", options: ["Pre-operative phase", "Intraoperative phase", "Postoperative phase", "Induction phase"], correct: 0, rationale: "Patient education regarding postoperative exercises (like deep breathing and coughing) must occur during the pre-operative phase when the patient is fully alert and can practice." },
            { id: 10, question: "Positioning the patient on operating room table according to the procedure or surgeon's preferences. This is considered from the role of the following intraoperative nurses?", options: ["Circulating nurse", "Scrub nurse", "Anesthesia nurse", "Assistant nurse"], correct: 0, rationale: "The circulating nurse works with the surgical team to properly and safely position the patient on the OR table." },
            { id: 11, question: "Which of the following is the key characteristic used in the definition of Chronic Bronchitis?", options: ["Abnormal distention of the alveoli.", "Productive cough for at least 3 months each year for 2 consecutive years.", "Airflow limitation that is completely reversible.", "A distinct restrictive rather than obstructive disorder."], correct: 1, rationale: "Chronic bronchitis is clinically defined by the presence of a chronic productive cough that lasts for at least 3 months of the year for 2 consecutive years." },
            { id: 12, question: "In Chronic Obstructive Pulmonary Disease (COPD), which statement accurately describes the airflow dynamics?", options: ["Resistance to inspiration is increased, and resistance to expiration is increased.", "Resistance to inspiration is decreased, and resistance to expiration is decreased.", "Resistance to inspiration is increased, and resistance to expiration is decreased.", "Resistance to inspiration is decreased, and resistance to expiration is increased."], correct: 3, rationale: "In COPD, airways tend to dilate during inspiration (decreasing resistance), but they prematurely collapse during expiration, significantly increasing expiratory resistance and trapping air." },
            { id: 13, question: "One of the pathophysiological changes in chronic bronchitis is the hypertrophy of mucus-producing glands. What does this change primarily lead to?", options: ["Destruction of alveolar walls and loss of elastic recoil.", "Reduced ability of ciliary function to remove irritants.", "Air way obstruction due to production of excessive, thick, tenacious mucus.", "Reduced gas exchange due to capillary destruction."], correct: 2, rationale: "Hypertrophy and hyperplasia of mucus-secreting glands result in an overproduction of thick mucus, which physically plugs and obstructs the airways." },
            { id: 14, question: "Which of the following statements is TRUE regarding the tripod position in a patient with COPD?", options: ["It is commonly associated with chronic bronchitis and helps to reduce right-sided heart failure.", "It is a sign of improved respiratory function, indicating the patient no longer needs supplemental oxygen.", "It is a characteristic posture in emphysema where the patient uses the accessory muscles of respiration to improve lung expansion.", "It involves the patient lying flat on their back to fully relax the diaphragm and abdominal muscles."], correct: 2, rationale: "The tripod position (leaning forward with arms supported) forces the shoulder girdle upward, optimizing the mechanical advantage of accessory respiratory muscles to ease breathing." },
            { id: 15, question: "Which two values measured during spirometry are considered the most important for determining the severity of airflow limitation in COPD?", options: ["Total Lung Capacity (TLC) and Residual Volume (RV)", "Forced Expiratory Volume in one second (FEV1) and Forced Vital Capacity (FVC)", "Inspiratory Reserve Volume (IRV) and Expiratory Reserve Volume (ERV)", "Arterial Oxygen Tension (PaO2) and Arterial Carbon Dioxide Tension (PaCO2)"], correct: 1, rationale: "The ratio of FEV1 to FVC is the primary spirometric measurement used to diagnose COPD and assess the severity of airflow obstruction." },
            { id: 16, question: "Which breathing technique helps slow expiration, prevent the collapse of small airways, and control the rate and depth of respiration for patient with COPD?", options: ["Diaphragmatic breathing", "Chest percussion", "Intermittent positive pressure breathing", "Pursed-lip breathing"], correct: 3, rationale: "Pursed-lip breathing creates positive end-expiratory pressure (PEEP) within the airways, which splints them open and prevents premature collapse during exhalation." },
            { id: 17, question: "When instructing a patient in safe toileting while on bed rest due to herniated disc, the nurse should emphasize which of the following techniques to prevent exacerbation of spinal injury?", options: ["Instruct the patient to lift the hips actively onto the bedpan.", "Encourage lateral logrolling onto a small bedpan.", "Place the bedpan by manually lifting the patient's pelvis.", "Allow the patient to sit upright unsupported for bowel movements."], correct: 1, rationale: "Logrolling maintains the alignment of the spine, preventing any twisting or abnormal arching that could aggravate the herniated disc." },
            { id: 18, question: "Immediate successful achievement outcomes for patients undergone lumbar laminectomy would be best by which of the following?", options: ["The absence of CSF leakage", "The ability to carry 4kg.", "The ability to return home within 4days.", "The ability to perform all self-care."], correct: 0, rationale: "In the immediate postoperative period following spinal surgery, preventing and monitoring for cerebrospinal fluid (CSF) leakage is a critical priority for patient safety." },
            { id: 19, question: "A patient admitted to the neurosurgery unit complaining from severe low back pain, neurological examination showed that 'neurological deficit in motor and sensory nerves supplying the leg and foot', this refer to which of the following?", options: ["Saddle anesthesia", "Sciatica pain", "Radiculopathy", "Radicular pain"], correct: 2, rationale: "Radiculopathy refers to disease or injury of a spinal nerve root, presenting with specific neurological deficits such as motor weakness and sensory loss in the corresponding dermatome." },
            { id: 20, question: "All the following stages/conditions of lumbar disc herniation required immediate surgical intervention Except:", options: ["Quad equina syndrome.", "Disc Extrusion", "Disc Prolapse", "Disc Sequestration"], correct: 2, rationale: "A disc prolapse (bulge) is an earlier stage often managed conservatively with rest and physical therapy. Extrusion, sequestration, and especially Cauda Equina syndrome often require prompt surgical intervention." },
            { id: 21, question: "The nurse should instruct the patient with lumbar disc herniation to perform all the following exercises to improve muscles strength and decrease pain Except:", options: ["Back extension exercises", "Abdominal muscle strengthening", "Low back muscle strengthening", "Passive exercises"], correct: 3, rationale: "Active exercises (core and back strengthening) provide long-term spinal support. Passive exercises do not build the active muscle strength required to stabilize the spine." },
            { id: 22, question: "A pneumococcal conjugate vaccine used for prevention of pneumonia is recommended for all the following patients Except those with:", options: ["Alcoholism", "CSF leakage", "Leukemia", "Cochlear implants"], correct: 0, rationale: "While pneumococcal vaccination is crucial, adults with pure alcoholism typically receive the polysaccharide vaccine (PPSV23). The conjugate vaccine (PCV) is strictly indicated for severe immunocompromise (leukemia), CSF leaks, and cochlear implants." },
            { id: 23, question: "The patients who are diagnosed with pneumonia and have chronic reactive airway disease complain from:", options: ["Bronchospasm", "Fever", "Abnormal heart sound", "Regurgitation"], correct: 0, rationale: "Patients with underlying reactive airway diseases (like asthma) are highly prone to experiencing severe bronchospasms when respiratory infections like pneumonia occur." },
            { id: 24, question: "A patient was admitted to the surgical unit 55 hours ago for treatment of a gunshot wound, he has recently developed a productive cough and a fever. which type of pneumonia be diagnosed:", options: ["Community acquired pneumonia.", "Ventilator acquired pneumonia.", "Hospital-acquired pneumonia.", "Health care-associated pneumonia."], correct: 2, rationale: "Pneumonia that develops 48 hours or more after admission to a hospital, which was not incubating at the time of admission, is classified as Hospital-Acquired Pneumonia (HAP)." },
            { id: 25, question: "All the following are risk factors that result in developing pneumonia in the immunocompromised host Except:", options: ["Corticosteroids", "Nutritional depletion", "Daily sedation vacations", "The use of broad-spectrum antimicrobial agents"], correct: 2, rationale: "Daily sedation vacations are an evidence-based intervention used to *prevent* Ventilator-Associated Pneumonia (VAP) by reducing the duration of mechanical ventilation, not a risk factor." },
            { id: 26, question: "Which of the following is the most common form of aspiration pneumonia?", options: ["Gastric contents.", "Exogenous chemical contents.", "Irritating gases.", "Bacterial infection."], correct: 0, rationale: "The aspiration of gastric contents (which are highly acidic) is the most frequent and common cause of aspiration pneumonia, often leading to severe chemical pneumonitis." },
            { id: 27, question: "During medical diagnosis of pneumonia, the physician gave order to the nurse to perform arterial blood gases (ABG) to", options: ["Check for bacterial infection in the bloodstream", "Assess lung function and oxygen exchange efficiency", "Evaluate the severity of pleuritic chest pain", "Assess amount and characteristics of sputum"], correct: 1, rationale: "Arterial Blood Gas (ABG) analysis provides precise measurements of oxygenation, ventilation (CO2 clearance), and acid-base balance to evaluate the severity of respiratory compromise." },
            { id: 28, question: "Fracture with intact skin is named:", options: ["Simple fracture", "Open Fracture", "Compound fracture", "Complex fracture"], correct: 0, rationale: "A simple (or closed) fracture is one where the broken bone does not penetrate or break the integrity of the overlying skin." },
            { id: 29, question: "Early treatment of edema associated with fracture is controlled by:", options: ["Elevating the injured extremity and applying bandages", "Elevating the injured extremity and applying warm compress", "Elevating the injured extremity and applying cold compress", "Elevating the injured extremity and applying massage"], correct: 2, rationale: "Immediate elevation and the application of cold compresses (ice) induce vasoconstriction and promote venous return, effectively minimizing early post-traumatic edema." },
            { id: 30, question: "In closed fracture, crepitus means:", options: ["Crack sensation", "Deformity", "Shortening of the fractured part", "Immobility"], correct: 0, rationale: "Crepitus is the palpable or audible grating, crackling sensation produced when rough ends of a fractured bone rub against each other." },
            { id: 31, question: "Patients with closed fracture are encouraged to practice isometric exercises to:", options: ["Affected and unaffected muscles", "Affected and unaffected joints", "Affected joints", "Unaffected joints"], correct: 0, rationale: "Isometric exercises involve muscle contraction without joint movement, which helps prevent muscle atrophy and maintains strength in both the affected and unaffected limbs safely." },
            { id: 32, question: "First aid in moving of fractured knee, the nurse should support:", options: ["Knee and ankle", "Hip and knee", "Femur and tibia and fibula", "Tibia and fibula and tarsus bones"], correct: 2, rationale: "Proper splinting requires immobilizing the joints and bones above and below the injury. For a knee fracture, the femur (above) and the tibia/fibula (below) must be fully supported." },
            { id: 33, question: "Factors can affect outcome, type of total hip replacement healing:", options: ["Previous surgical interventions", "Gender of patients", "Nursing level", "Level of patient activity"], correct: 3, rationale: "The patient's postoperative activity level and adherence to rehabilitation protocols significantly influence the speed and success of healing and integration of the prosthesis." },
            { id: 34, question: "Connecting artificial hip is commonly used by patient who:", options: ["Recently most active", "Aged and disable", "Need only nutrition load", "Need to do more load"], correct: 1, rationale: "Total hip arthroplasty is most frequently indicated for older adults suffering from severe osteoarthritis or joint degeneration that causes significant pain and disability." },
            { id: 35, question: "Over-head trapeze is used for movement in bed for patient post hip replacement to:", options: ["Avoid crossing midline with affected leg", "Avoid adduction of the affected leg", "Avoid weight bearing on the affected leg", "Avoid abduction of the affected leg"], correct: 2, rationale: "An overhead trapeze allows the patient to independently lift their upper body and pelvis for repositioning or bedpan use, strictly avoiding unwanted weight-bearing on the newly operated hip." },
            { id: 36, question: "Compartment syndrome characterized by:", options: ["Pain, pallor, and pulseness", "Pain, paralysis and anesthesia", "Pain, paralysis and paresthesia", "Pain, paralysis, and pulseness"], correct: 0, rationale: "Compartment syndrome is identified by the classic 'Ps': Pain (out of proportion), Pallor, Pulselessness, Paresthesia, and Paralysis. (Note: pulseness refers to pulselessness here)." },
            { id: 37, question: "When using crutches first step is:", options: ["Place the crutches one step ahead", "Place the affected leg one step ahead", "Place the unaffected leg one step ahead", "Place the crutches and affected leg one step ahead"], correct: 0, rationale: "When ambulating, the standard safe sequence begins by advancing the assistive device (the crutches) first to establish a stable base of support." },
            { id: 38, question: "When climbing stair up post Lt hip replacement, patient starts with:", options: ["Cane and Lt leg", "Cane and Rt leg", "Lt leg", "Rt leg"], correct: 3, rationale: "The fundamental rule for stairs is 'up with the good, down with the bad.' Since the left hip is affected, the patient must step up using the strong, unaffected right (Rt) leg first." },
            { id: 39, question: "A peak of post-operative intracranial surgery (ICS) cerebral edema in which of the following?", options: ["6 to 12 hours after surgery", "12 to 24 hours after surgery", "24 to 36 hours after surgery", "None of the answers is correct"], correct: 2, rationale: "Cerebral edema progressively increases after neurosurgery and typically reaches its peak severity between 24 and 48 (or 36) hours postoperatively." },
            { id: 40, question: "All the following can be used to manage cerebral edema before ICS Except:", options: ["Diuretic", "Hyperosmolar agent", "Diazepam", "Dexamethasone"], correct: 2, rationale: "Diazepam is a benzodiazepine used to treat anxiety or seizures. Unlike osmotic diuretics (Mannitol) or corticosteroids (Dexamethasone), it does not reduce brain swelling." },
            { id: 41, question: "The incision location for infratentorial ICS is usually which of the following?", options: ["At the nape of the neck.", "Beyond hair line.", "Beneath the upper lip.", "Beyond the third ventricle."], correct: 0, rationale: "Infratentorial approaches access the cerebellum and brainstem located in the posterior fossa, requiring an incision at the back of the head or the nape of the neck." },
            { id: 42, question: "Protective helmet may be prescribed for patients who has undergone which of the following?", options: ["Craniectomy.", "Burr holes.", "Craniotomy.", "Transsphenoidal surgery."], correct: 0, rationale: "A craniectomy involves the removal of a bone flap without immediately replacing it. A protective helmet is essential to shield the vulnerable, unprotected brain tissue." },
            { id: 43, question: "A patient has a nursing diagnosis of risk for ineffective cerebral tissue perfusion related to cerebral edema. What is the appropriate nursing intervention for this patient?", options: ["Avoid positioning the patient with neck flexion.", "Check the urine output hourly.", "Schedule nursing activities to provide periods of uninterrupted rest.", "Routinely suction to prevent accumulation of respiratory secretions."], correct: 0, rationale: "Neck flexion drastically obstructs venous outflow from the brain via the jugular veins, subsequently increasing intracranial pressure and reducing cerebral tissue perfusion." },
            { id: 44, question: "On physical examination of a patient post ICS with headache and fever, the nurse should suspect a meningitis when the patient has which of the following?", options: ["Seizures.", "Upper extremity weakness.", "Neck rigidity.", "Cushing's Triade."], correct: 2, rationale: "Nuchal rigidity (a stiff neck) is a hallmark clinical sign indicating meningeal irritation, highly suggestive of meningitis when paired with fever and headache." },
            { id: 45, question: "A motorcycle accident victim presents with superficial and deep skin burn caused by high-speed friction on the road. This type of burn is classified as:", options: ["Thermal burn.", "Chemical burn.", "Mechanical burn.", "Electrical burn."], correct: 2, rationale: "Road rash from high-speed friction is classified as a mechanical burn, combining severe abrasive tissue destruction with heat generated by friction." },
            { id: 46, question: "A nurse notices that a burn wound is painless, with stiff, white tissue and no blanching. What is the degree of the burn?", options: ["Superficial partial thickness.", "Deep partial thickness.", "Full thickness.", "Superficial burn."], correct: 2, rationale: "A full thickness (third-degree) burn completely destroys the epidermis, dermis, and underlying nerve endings, resulting in a painless, leathery, and non-blanching wound." },
            { id: 47, question: "During the first 24 hours post-burn injury, fluid shifts from the intravascular space to the interstitial space mainly due to:", options: ["Decreased renal filtration.", "Increased capillary permeability.", "Increased sodium retention", "Sympathetic stimulation."], correct: 1, rationale: "The massive inflammatory response triggered by a severe burn dramatically increases capillary permeability, allowing intravascular plasma to leak rapidly into the interstitial spaces, causing profound edema." },
            { id: 48, question: "Which of the following electrolyte imbalance is commonly seen early after a severe burn injury?", options: ["Hypokalemia", "Hyperkalemia", "Hypernatremia", "Hypocalcemia"], correct: 1, rationale: "Extensive thermal injury destroys millions of cells, causing them to lyse and release their intracellular potassium into the systemic circulation, leading to early hyperkalemia." },
            { id: 49, question: "When the nurse assesses the total body surface area(TBSA) of an adult whose entire right arm is burned, using the Rule of Nines, the TBSA is approximately:", options: ["4.5%", "9%", "18%", "36%"], correct: 1, rationale: "According to the standardized Rule of Nines for adults, the entire arm (both anterior and posterior surfaces combined) accounts for 9% of the Total Body Surface Area (TBSA)." },
            { id: 50, question: "When monitoring fluid resuscitation in an adult burn patient, which of the following amounts of urinary output consider the minimum acceptable level for this patient?", options: ["10 mL/hour.", "20 mL/hour.", "50 mL/hour.", "30 mL/hour."], correct: 3, rationale: "The standard clinical benchmark for adequate end-organ perfusion and successful fluid resuscitation in an adult burn patient is maintaining a urine output of at least 30 to 50 mL/hour." },
            { id: 51, question: "A major problem of chronic renal failure due to loss of erythropoietin is:", options: ["Hypertension", "Infection", "Anemia", "Osteoporosis"], correct: 2, rationale: "The kidneys are responsible for secreting erythropoietin, which stimulates the bone marrow to produce red blood cells. Chronic kidney failure ceases this production, resulting in severe anemia." },
            { id: 52, question: "Which of the following symptoms suggest disequilibrium syndrome during hemodialysis?", options: ["Leg cramps", "Blurred vision and restlessness", "Edema", "Jaundice"], correct: 1, rationale: "Dialysis disequilibrium syndrome is caused by rapid fluid and solute shifts within the brain during dialysis, presenting with neurologic symptoms like restlessness, headache, and blurred vision." },
            { id: 53, question: "The term 'thrill' in vascular access in hemodialysis patients refers to:", options: ["Blood clot", "Pain", "Vibration", "Bruising"], correct: 2, rationale: "A 'thrill' is the palpable, buzzing vibration felt over a functional Arteriovenous (AV) fistula or graft, confirming robust and turbulent arterial blood flow." },
            { id: 54, question: "The patient on peritoneal dialysis complains of severe abdominal pain and the nurse notices that fluid in the collecting bag of dialysate is cloudy. This was indication of:", options: ["The patient needs a kidney transplant", "The patient is experiencing peritonitis", "The patient need analgesics added to the dialysate", "The client needs to change their dialysate"], correct: 1, rationale: "Cloudy dialysate effluent accompanied by intense abdominal pain are the cardinal, definitive signs of peritonitis, a serious complication of peritoneal dialysis." },
            { id: 55, question: "The purpose of adding dextrose in the solution of peritoneal dialysis is:", options: ["Increases osmotic pressure for fluid removal.", "Decreases risk of peritonitis", "Prevents disequilibrium syndrome", "Prevents excess glucose from being removed"], correct: 0, rationale: "Dextrose serves as a highly effective osmotic agent in the dialysate, creating an osmotic gradient that pulls excess fluid and waste products from the blood into the peritoneal cavity." },
            { id: 56, question: "A patient with acute kidney failure has the following labs: GFR 98 mL/min., potassium 3.9 mEq/L, and Creatinine 1 mg/dL. The patient's 24 hour urinary output is 1,800 cc. Based on these findings, what phase of acute kidney injury is this patient in?", options: ["Initiation phase", "Diuresis phase", "Oliguric phase", "Recovery phase"], correct: 3, rationale: "The normalization of lab values (GFR 98, normal K+, normal Creatinine) combined with a healthy, stable urine output strictly indicates the patient has entered the Recovery phase of AKI." },
            { id: 57, question: "A patient on hemodialysis gains 1.5 kg between dialysis sessions. What does this indicate?", options: ["Infection", "Fluid retention", "Muscle mass increased", "High protein intake"], correct: 1, rationale: "In patients with end-stage renal disease, rapid weight gain between dialysis treatments is almost exclusively attributed to dangerous fluid retention due to anuria or oliguria." },
            { id: 58, question: "Which of the following abnormalities contribute to bone disease in Chronic Renal Failure?", options: ["High creatinine", "Low phosphate", "Hypocalcemia and hyperphosphatemia", "low sodium and high potassium"], correct: 2, rationale: "Failing kidneys cannot excrete phosphate, leading to hyperphosphatemia. This reciprocally lowers serum calcium (hypocalcemia), triggering the parathyroid to strip calcium from bones, causing renal osteodystrophy." },
            { id: 59, question: "Which of the following electrolytes becomes dangerous on cardiac muscles when elevated in patient with renal failure?", options: ["Sodium", "Potassium", "Calcium", "Bicarbonate"], correct: 1, rationale: "Hyperkalemia (elevated potassium) is the most life-threatening electrolyte imbalance in renal failure because it directly alters cardiac muscle electrical conduction, risking fatal arrhythmias." },
            { id: 60, question: "During peritoneal dialysis, dialysate solution is warmed to:", options: ["Improve patient comfort", "Increase metabolic rate", "Avoid chemical reactions", "Activate glucose in the solution"], correct: 0, rationale: "Warming the dialysate to body temperature heavily prevents severe abdominal cramping, promotes patient comfort, and aids in local vasodilation to improve urea clearance." },
            
            // True or False Questions
            { id: 61, question: "Ambulatory surgery refers to surgery that requires fewer than 72 hrs of hospitalization.", options: ["True", "False"], correct: 1, rationale: "False. Ambulatory (outpatient or same-day) surgery typically requires a hospital stay of fewer than 24 hours, not 72." },
            { id: 62, question: "Medullary depression is the stage that refers to proper induction of general anesthesia.", options: ["True", "False"], correct: 1, rationale: "False. Medullary depression represents Stage IV of anesthesia, indicating dangerous over-sedation and potential respiratory/cardiac arrest, not a proper induction stage." },
            { id: 63, question: "The major purpose of withholding food and fluid before surgery is to prevent the elevation of blood glucose levels.", options: ["True", "False"], correct: 1, rationale: "False. The primary purpose of NPO status prior to surgery is to ensure the stomach is empty, drastically reducing the risk of pulmonary aspiration during anesthesia." },
            { id: 64, question: "Asthma is currently classified as a type of COPD.", options: ["True", "False"], correct: 1, rationale: "False. Asthma is distinctly characterized by completely reversible airway inflammation, whereas COPD involves progressive, irreversible airflow limitation." },
            { id: 65, question: "Testing for alpha-1 antitrypsin (AAT) deficiency is especially recommended for a nonsmoker or someone with a strong family history of COPD.", options: ["True", "False"], correct: 0, rationale: "True. AAT deficiency is a well-known genetic anomaly that predisposes individuals to severe early-onset emphysema, even in the absolute absence of smoking." },
            { id: 66, question: "Extra clothes and blankets play an important role in managing paresthesia in the patient with lumbar disc herniation.", options: ["True", "False"], correct: 1, rationale: "False. Paresthesia originates from mechanical nerve root compression (neuropathic). Blankets merely alter surface temperature and do not resolve structural nerve compression." },
            { id: 67, question: "Cold applications play an important role in decreasing muscles spasm at the first 48 hours in patients with lumbar disc herniation.", options: ["True", "False"], correct: 0, rationale: "True. During the acute phase (the first 48 hours), cold application produces localized vasoconstriction, successfully reducing deep tissue inflammation and painful muscle spasms." },
            { id: 68, question: "Hospital acquired pneumonia is the most common cause of death among all patients with hospital-acquired infection.", options: ["True", "False"], correct: 0, rationale: "True. HAP (including ventilator-associated pneumonia) carries the highest mortality rate of any nosocomial infection due to aggressive, multidrug-resistant pathogens." },
            { id: 69, question: "Hypoventilation in patients with pneumonia can cause a ventilation-perfusion mismatch in the affected lung areas.", options: ["True", "False"], correct: 0, rationale: "True. Exudate consolidation combined with hypoventilation leads to areas of the lung being perfused with blood but poorly ventilated with oxygen, causing a severe V/Q mismatch." },
            { id: 70, question: "Administration of tetanus prophylaxis results from bleeding into the tissues.", options: ["True", "False"], correct: 1, rationale: "False. Tetanus prophylaxis is strictly administered to neutralize bacterial toxins introduced through open wounds and broken skin, entirely unrelated to closed internal tissue bleeding." },
            { id: 71, question: "In contusion, skin discoloration results from bleeding into the tissues.", options: ["True", "False"], correct: 0, rationale: "True. A contusion (bruise) occurs from blunt force trauma that ruptures superficial blood vessels, leaking blood into the subcutaneous tissue causing discoloration." },
            { id: 72, question: "Crossing legs is allowed 2 weeks post total hip replacement surgery.", options: ["True", "False"], correct: 1, rationale: "False. Patients must strictly avoid crossing their legs past the body's midline for several months to prevent catastrophic dislocation of the new hip prosthesis." },
            { id: 73, question: "Avascular necrosis of the hip bone is a major contraindication of total hip replacement.", options: ["True", "False"], correct: 1, rationale: "False. Avascular necrosis (bone death due to lack of blood supply) is a primary indication and compelling reason to perform a total hip replacement, not a contraindication." },
            { id: 74, question: "Before ICS, the patient should shower the hair using the preferred cleansing solution.", options: ["True", "False"], correct: 0, rationale: "True. Preoperative hair washing with a prescribed or medically preferred antimicrobial cleansing solution (like Chlorhexidine) significantly reduces surgical site microbial flora." },
            { id: 75, question: "Hyperthermia is expected after lengthy intracranial surgeries.", options: ["True", "False"], correct: 0, rationale: "True. Central fever or hyperthermia is frequently expected due to surgical manipulation near the hypothalamus or the presence of irritating blood breakdown products in the CSF." },
            { id: 76, question: "Silver sulfadiazine is a topical antibacterial agent used for burns.", options: ["True", "False"], correct: 0, rationale: "True. Silver sulfadiazine is a widely accepted, broad-spectrum topical antimicrobial cream used extensively to prevent infections in second- and third-degree burn wounds." },
            { id: 77, question: "Frostbite is considered a thermal burn injury.", options: ["True", "False"], correct: 0, rationale: "True. Thermal injuries encompass damage caused by both extreme heat and extreme cold (frostbite), as both cause severe cellular destruction and similar vascular compromised states." },
            { id: 78, question: "In Chronic Renal Failure, a low-protein diet is recommended to reduce nitrogenous waste products.", options: ["True", "False"], correct: 0, rationale: "True. Protein metabolism creates nitrogenous waste (urea, creatinine). A controlled, low-protein diet minimizes waste accumulation, thereby decreasing the workload on failing kidneys." },
            { id: 79, question: "Peritoneal dialysis requires access to a central vein to achieve its aim.", options: ["True", "False"], correct: 1, rationale: "False. Peritoneal dialysis operates via a catheter placed in the abdominal peritoneal cavity. Hemodialysis is the modality that strictly requires access to a central vein or AV fistula." },
            { id: 80, question: "Arteriovenous graft has a longer lifespan and fewer complications than AV fistula.", options: ["True", "False"], correct: 1, rationale: "False. An AV fistula (constructed from the patient's native vessels) is universally the gold standard because it lasts much longer and has significantly fewer complications than a synthetic graft." }
        ];

        // --- 2. SHUFFLE & RENDER LOGIC (DO NOT EDIT) ---
        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Excellent Work!" : "Keep Studying, You can do it!";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
