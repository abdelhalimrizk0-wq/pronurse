                    { id: 50, question: "Dysarthria is medically defined as a severe abnormality in the thought content during normal patient conversation.", options: ["False", "True"], correct: 0, rationale: "Dysarthria is a physical speech disturbance regarding articulation, not an abnormality of thought content." }
                ]
            },
            {
                id: 'terminology',
                title: 'Neurological Terminology Quiz',
                icon: 'fa-book-medical',
                data: [
                    { id: 1, question: "Which condition involves a disruption of cerebral blood flow due to occlusion of cerebral arteries by a thrombus or emboli?", options:["Ischemic stroke", "Hemorrhagic stroke", "Subarachnoid hemorrhage", "Intracerebral hemorrhage"], correct: 0, rationale: "Ischemic stroke occurs when there is a disruption of blood flow due to an occlusion such as a thrombus or embolus." },
                    { id: 2, question: "Receptive aphasia is defined as the inability to understand the spoken or written language of others.", options:["True", "False"], correct: 0, rationale: "Receptive aphasia is specifically the inability to comprehend or understand spoken and written language." },
                    { id: 3, question: "What term describes the inability to recognize familiar objects by touch?", options:["Tactile agnosia", "Visual agnosia", "Color agnosia", "Auditory agnosia"], correct: 0, rationale: "Tactile agnosia, or astereognosis, is the inability to recognize familiar objects simply by touching them." },
                    { id: 4, question: "Using wrong words and substituting words with grammatical errors is known as what?", options:["Paraphasia", "Dysarthria", "Global aphasia", "Receptive aphasia"], correct: 0, rationale: "Paraphasia involves using the wrong words, word substitution, and making grammatical errors during speech." },
                    { id: 5, question: "A glioma is a primary example of an extra-axial brain tumor.", options: ["False", "True"], correct: 0, rationale: "A glioma is an intra-axial brain tumor found within the brain parenchyma, whereas a meningioma is extra-axial." },
                    { id: 6, question: "Which sensory term refers to a numbness or tingling sensation?", options: ["Paresthesia", "Anesthesia", "Hyperesthesia", "Analgesia"], correct: 0, rationale: "Paresthesia is the medical term for experiencing a numbness or tingling sensation." },
                    { id: 7, question: "What does the neurological abbreviation 'S.L.R.T' stand for?", options:["Straight leg raising test", "Spinal lumbar reflex test", "Severe lower radicular trauma", "Sensory level response time"], correct: 0, rationale: "S.L.R.T stands for Straight leg raising test." },
                    { id: 8, question: "Which medical term is used to describe the complete loss of the sense of taste?", options: ["Ageusia", "Anosmia", "Tinnitus", "Anesthesia"], correct: 0, rationale: "Ageusia is the specific term for the loss of the sense of taste." },
                    { id: 9, question: "What type of gait is described as staggering and unsteady?", options:["Ataxic gait", "Hemiplegic gait", "Spastic gait", "Flaccid gait"], correct: 0, rationale: "An ataxic gait is characterized by staggering and unsteady walking." },
                    { id: 10, question: "A temporary loss of consciousness due to a temporary decrease in blood flow to the brain is called what?", options: ["Syncope", "Vertigo", "Dizziness", "Aphasia"], correct: 0, rationale: "Syncope, or fainting, is a temporary loss of consciousness resulting from decreased cerebral blood flow." },
                    { id: 11, question: "Nystagmus consists of involuntary rapid and rhythmic movements of the eyeball.", options:["True", "False"], correct: 0, rationale: "Nystagmus refers to involuntary, rapid, rhythmic movements of the eyeball affecting one or both eyes." },
                    { id: 12, question: "Which abnormality is characterized by an initial resistance to passive stretching followed quickly by sudden relaxation?", options:["Muscle spasticity", "Muscle rigidity", "Muscle flaccidity", "Muscle fasciculation"], correct: 0, rationale: "Spasticity presents with an initial resistance followed by sudden relaxation, known as the clasp-knife phenomenon." },
                    { id: 13, question: "What does the abbreviation 'P.C' mean in a neurological context?", options:["Post concussion", "Pupil constriction", "Pain control", "Peripheral circulation"], correct: 0, rationale: "P.C stands for Post concussion in common neurological abbreviations." },
                    { id: 14, question: "Defective articulation of speech that may be slurred or have an abnormal pitch is called what?", options:["Dysarthria", "Paraphasia", "Aphasia", "Agnosia"], correct: 0, rationale: "Dysarthria refers to defective articulation of speech, including speech that is slurred, too fast, too slow, or has an abnormal pitch." },
                    { id: 15, question: "What term describes the weakness of both lower limbs?", options:["Paraparesis", "Paraplegia", "Hemiparesis", "Quadriparesis"], correct: 0, rationale: "Paraparesis denotes weakness (paresis) affecting both lower limbs, whereas paraplegia denotes total paralysis." },
                    { id: 16, question: "Flaccidity is characterized by an increase in muscle tone and increased resistance to passive stretch.", options: ["False", "True"], correct: 0, rationale: "Flaccidity means decreased or loss of muscle tone, making the muscle soft and floppy. Increased tone refers to spasticity or rigidity." },
                    { id: 17, question: "Which medical term represents pain along the course of one or more nerves?", options: ["Neuralgia", "Cephalgia", "Analgesia", "Hyperalgesia"], correct: 0, rationale: "Neuralgia is defined as pain in a nerve or along the course of one or more nerves." },
                    { id: 18, question: "Which term is used for the deviation of the eye from its normal direction?", options: ["Squint", "Nystagmus", "Ptosis", "Diplopia"], correct: 0, rationale: "Squint, or heterotropia, is the deviation of the eye from its normal direction." },
                    { id: 19, question: "What is an example of an extra-axial brain tumor?", options: ["Meningioma", "Glioma", "Hematoma", "Abscess"], correct: 0, rationale: "A meningioma is an extra-axial brain tumor, meaning it is found outside the brain parenchyma." },
                    { id: 20, question: "Meningitis is defined simply as an inflammation of the meninges.", options:["True", "False"], correct: 0, rationale: "Meningitis is indeed an inflammation affecting the meninges." },
                    { id: 21, question: "Which term defines bleeding strictly into the subarachnoid space?", options:["Subarachnoid hemorrhage", "Intracerebral hemorrhage", "Intraventricular hemorrhage", "Ischemic stroke"], correct: 0, rationale: "Subarachnoid hemorrhage specifies bleeding into the subarachnoid space." },
                    { id: 22, question: "Fine and fast contractions of small muscle fibers that occur spontaneously like an eyelid twitch are called what?", options:["Fasciculation", "Tremor", "Spasticity", "Rigidity"], correct: 0, rationale: "Fasciculation refers to involuntary, visible, fine, and fast contractions of fine muscle fibers." },
                    { id: 23, question: "The neurological abbreviation 'C.S.F' stands for Central Sensory Function.", options: ["False", "True"], correct: 0, rationale: "C.S.F stands for Cerebrospinal fluid, not Central Sensory Function." },
                    { id: 24, question: "An aneurysm is described as the dilation of cerebral artery walls developing as a result of what?", options:["Weakness in the arterial wall", "Occlusion by a moving thrombus", "Rupture of a small blood vessel", "Infection of the local meninges"], correct: 0, rationale: "A cerebral aneurysm is the dilation of artery walls developing due to a structural weakness in the arterial wall." },
                    { id: 25, question: "What does the abbreviation 'A & O' mean in clinical neurological assessments?", options:["Alert and oriented", "Awake and observant", "Active and organized", "Asleep and obtunded"], correct: 0, rationale: "A & O is the standard abbreviation for Alert & oriented." },
                    { id: 26, question: "Which term refers to the sensation that the surroundings or the person themselves are spinning around?", options:["Vertigo", "Dizziness", "Syncope", "Fasciculation"], correct: 0, rationale: "Vertigo is the specific sensation that the environment or the person is spinning." },
                    { id: 27, question: "Hemiplegic gait involves a paralyzed limb swinging outward while the foot drags.", options: ["True", "False"], correct: 0, rationale: "In a hemiplegic gait, the patient is paralyzed on one side, causing the limb to swing outward and the foot to drag." },
                    { id: 28, question: "What term describes the inability to express oneself through speaking or writing?", options:["Expressive aphasia", "Receptive aphasia", "Global aphasia", "Speech dysarthria"], correct: 0, rationale: "Expressive aphasia is the inability to express oneself effectively through speaking or writing." },
                    { id: 29, question: "Which term means an increased sensation to pain?", options:["Hyperalgesia", "Absence of pain sensation", "Numbness or tingling sensation", "Pathological over perception of touch"], correct: 0, rationale: "Hyperalgesia is the clinical term for an increased sensitivity or sensation to pain." },
                    { id: 30, question: "Paralysis of a single limb is medically termed as what?", options:["Monoplegia", "Hemiplegia", "Paraplegia", "Quadriplegia"], correct: 0, rationale: "Monoplegia denotes the paralysis of exactly one limb." },
                    { id: 31, question: "Anosmia refers to the pathological over perception of touch.", options: ["False", "True"], correct: 0, rationale: "Anosmia is the inability to smell. Hyperesthesia is the pathological over perception of touch." },
                    { id: 32, question: "What lesion type occupies a physical space and places pressure on adjacent tissues causing damage?", options:["Space occupying lesion", "Intra axial tumor", "Ischemic brain stroke", "Arteriovenous malformation"], correct: 0, rationale: "A Space Occupying Lesion (SOL) refers to any mass like a tumor, abscess, or hematoma that occupies physical space and compresses tissues." },
                    { id: 33, question: "Carpal tunnel syndrome is caused by physical compression on which specific nerve?", options: ["Median nerve", "Radial nerve", "Ulnar nerve", "Sciatic nerve"], correct: 0, rationale: "Carpal tunnel syndrome is a condition resulting from compression on the median nerve as it passes through the wrist." },
                    { id: 34, question: "What does the medical term 'Ptosis' refer to?", options:["Drooping of the upper eyelid", "Double vision defect", "Deviation of the eye", "Rapid eyeball movements"], correct: 0, rationale: "Ptosis specifically describes the drooping of the upper eyelid." },
                    { id: 35, question: "What is the general neurological term for a headache?", options:["Cephalgia", "Neuralgia", "Analgesia", "Hyperesthesia"], correct: 0, rationale: "Cephalgia is the formal medical term for a headache." },
                    { id: 36, question: "What does the abbreviation 'T.I.A' stand for?", options:["Transient ischemic attack", "Total intracranial aneurysm", "Traumatic internal accident", "Temporary ischemic aphasia"], correct: 0, rationale: "T.I.A represents Transient Ischemic Attack." },
                    { id: 37, question: "What is the general term for the loss of the ability to recognize familiar objects through a particular sensory system?", options:["Agnosia", "Aphasia", "Ageusia", "Anosmia"], correct: 0, rationale: "Agnosia is the loss of ability to recognize familiar objects through a specific sensory pathway." },
                    { id: 38, question: "What are involuntary rhythmic shaking movements resulting from rapid contraction and relaxation of opposing muscle groups?", options:["Muscle tremors", "Muscle fasciculations", "Muscle spasticity", "Muscle rigidity"], correct: 0, rationale: "Tremors are involuntary, rhythmic shaking movements driven by opposing muscle groups contracting and relaxing rapidly." },
                    { id: 39, question: "What is the medical term used to describe double vision?", options:["Diplopia", "Squint", "Ptosis", "Nystagmus"], correct: 0, rationale: "Diplopia is the medical term for seeing two images instead of one, known as double vision." },
                    { id: 40, question: "Which term defines a ringing sound heard inside the ears?", options: ["Tinnitus", "Ageusia", "Anosmia", "Cephalgia"], correct: 0, rationale: "Tinnitus describes the perception of ringing or similar noises in the ears." }
                ]
            }
        ];

        // --- 2. GLOBAL VARIABLES ---
        let currentQuizData = [];
        let currentQuizId = null;
        let score = 0; 
        let answeredCount = 0;

        // --- 3. INIT MENU ---
        function renderMenu() {
            const list = document.getElementById('quiz-list');
            list.innerHTML = quizCollections.map(quiz => `
                <button onclick="startQuiz('${quiz.id}')" class="bg-white rounded-xl p-6 border border-gray-100 shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-300 text-left flex items-center justify-between group">
                    <div>
                        <h3 class="font-bold text-lg text-gray-800 group-hover:text-blue-600 font-cairo transition-colors">${quiz.title}</h3>
                        <p class="text-sm text-gray-500 mt-1 font-cairo">عدد الأسئلة: ${quiz.data.length}</p>
                    </div>
                    <div class="h-12 w-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-colors flex-shrink-0 ml-4">
                        <i class="fas ${quiz.icon} text-xl"></i>
                    </div>
                </button>
            `).join('');
        }

        function showMenu() {
            document.getElementById('menu-view').classList.remove('hidden-content');
            document.getElementById('quiz-view').classList.add('hidden-content');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- 4. SHUFFLE & START QUIZ ---
        function startQuiz(quizId) {
            currentQuizId = quizId;
            const quizCollection = quizCollections.find(q => q.id === quizId);
            
            // Set Titles
            document.getElementById('quiz-main-title').innerText = quizCollection.title;
            document.getElementById('quiz-header-icon').className = `fas ${quizCollection.icon} text-8xl text-blue-600`;

            // Deep clone and shuffle options
            currentQuizData = JSON.parse(JSON.stringify(quizCollection.data)).map(q => {
                const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
            });

            // Reset scores
            score = 0; 
            answeredCount = 0;

            // View Management
            document.getElementById('menu-view').classList.add('hidden-content');
            document.getElementById('quiz-view').classList.remove('hidden-content');
            document.getElementById('result-summary').classList.add('hidden-content');
            
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- 5. RENDER QUIZ CONTAINER ---
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            document.getElementById('total-display').innerText = `/ ${currentQuizData.length}`;
            
            container.innerHTML = currentQuizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        // --- 6. CHECK ANSWER ---
        window.checkAnswer = function(qIndex, optIndex) {
            const q = currentQuizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            
            if (!feedback.classList.contains('hidden-content')) return;
            
            feedback.classList.remove('hidden-content');
            
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { 
                    btn.classList.add('correct-answer'); 
                    btn.innerHTML += '<i class="fas fa-check float-right"></i>'; 
                }
                else if (i === optIndex) { 
                    btn.classList.add('wrong-answer'); 
                    btn.innerHTML += '<i class="fas fa-times float-right"></i>'; 
                }
                else { 
                    btn.classList.add('opacity-50'); 
                }
            });
            
            if (optIndex === q.correct) score++;
            answeredCount++;
            
            if (answeredCount === currentQuizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/currentQuizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                
                // Hook restart button to restart current quiz
                document.getElementById('restart-btn').onclick = () => startQuiz(currentQuizId);
                
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };

        // Initialize the app
        renderMenu();
    </script>
</body>
</html>
