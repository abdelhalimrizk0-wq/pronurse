                    { id: 31, question: "Which cranial nerve injury during surgery directly leads to postoperative swallowing disturbances?", options:["Superior laryngeal nerve", "Recurrent laryngeal nerve", "Vagus cranial nerve", "Trigeminal cranial nerve"], correct: 0, rationale: "Damage to the superior laryngeal nerve results in swallowing disturbances." },
                    { id: 32, question: "How should the nurse assist the patient when turning their head to look side to side?", options:["Instruct them to turn the entire body", "Tell them to turn the neck slowly", "Support their head with soft pillows", "Loosen the collar before turning"], correct: 0, rationale: "Patients are instructed to turn the body instead of the neck when looking from side to side to keep the neck in a midline position." },
                    { id: 33, question: "During the extrusion stage of disc herniation what happens to the nucleus pulposus?", options:["It breaks the annulus but remains inside", "It moves entirely outside the spinal canal", "It begins to form a slight regular bulge", "It completely dries out and shrinks down"], correct: 0, rationale: "During extrusion, the gel-like nucleus pulposus breaks through the annulus fibrosus but still remains within the disc." },
                    { id: 34, question: "Which surgical procedure maintains normal neck mobility without requiring a bone graft?", options:["Disc replacement", "Posterior cervical discectomy", "Anterior discectomy without fusion", "Anterior cervical discectomy and fusion"], correct: 0, rationale: "Disc replacement involves placing a prosthetic disc without a bone graft, maintaining normal mobility of the neck." },
                    { id: 35, question: "What clothing choice is best suited for a patient attempting independent dressing after cervical surgery?", options:["Large size clothing", "Tight fitting garments", "Clothes with many buttons", "Heavy woolen sweaters"], correct: 0, rationale: "For dressing, the patient should be allowed sufficient time and choose clothing with a large size for easy use." },
                    { id: 36, question: "How does the size of the cervical vertebrae compare to those in the thoracic and lumbar spine?", options:["They are much smaller", "They are significantly larger", "They are exactly the same size", "They are wider but much shorter"], correct: 0, rationale: "All of the cervical vertebrae are smaller than the vertebrae in the thoracic spine and the lumbar spine." },
                    { id: 37, question: "How many times per day should the patient repeat the shoulder blade squeeze exercise regimen?", options: ["Five times", "Ten times", "Two times", "Fifteen times"], correct: 0, rationale: "Shoulder blade squeezes should be repeated 5 times daily." },
                    { id: 38, question: "Which diagnostic test is specifically used to look for signs or evidence of electrical nerve damage?", options:["Nerve conduction studies", "Magnetic resonance imaging", "Standard radiography", "Computed tomography"], correct: 0, rationale: "Electrical nerve conduction studies are used to look for signs or evidence of nerve damage." },
                    { id: 39, question: "Which activity is strongly discouraged because it increases vibration and compression to the cervical spine?", options: ["Running and boating", "Walking and stretching", "Swimming and floating", "Sitting and resting"], correct: 0, rationale: "Activities that cause increased vibration and compression to the cervical spine include boating and running." },
                    { id: 40, question: "Where does the surgeon obtain the bone graft for an anterior cervical discectomy and fusion?", options:["Bone bank or patient hip", "Synthetic calcium polymers", "Patient ribs or sternum", "Cadaveric spine segments"], correct: 0, rationale: "A bone graft is obtained either from a bone bank or from the patient's own hip." },
                    { id: 41, question: "The cervical vertebrae closest to the base of the skull are the largest in the spinal column.", options: ["False", "True"], correct: 0, rationale: "The cervical vertebrae closest to the skull are actually the smallest, not the largest." },
                    { id: 42, question: "The initial medical management for a herniated cervical disc is usually a conservative non surgical approach.", options: ["True", "False"], correct: 0, rationale: "The initial treatment for a cervical disc herniation is usually conservative, involving rest, therapy, and medications." },
                    { id: 43, question: "Anterior discectomy without spine fusion often leads to faster healing compared to procedures with a bone graft.", options: ["False", "True"], correct: 0, rationale: "Without a bone graft, the healing seems to be longer and it tends to heal in a deformed position." },
                    { id: 44, question: "A patient wearing a cervical collar should keep their chin positioned completely parallel to the floor.", options:["True", "False"], correct: 0, rationale: "When wearing the collar, the patient should look straight ahead and keep their chin parallel to the floor." },
                    { id: 45, question: "High velocity chiropractic manipulations are strongly recommended to quickly relieve severe neurological pain.", options: ["False", "True"], correct: 0, rationale: "High velocity manipulations should be avoided as they can make the pain worse or worsen neurological damage." },
                    { id: 46, question: "A complaint of a severe postoperative headache requires careful and immediate neurological evaluation.", options:["True", "False"], correct: 0, rationale: "A complaint of headache requires careful evaluation postoperatively, as it may suggest complications like a dural leak." },
                    { id: 47, question: "Constant overhead activities requiring prolonged neck extension can exacerbate the symptoms of a herniated disc.", options: ["True", "False"], correct: 0, rationale: "Activity modification advises avoiding overhead activities that require prolonged neck extension." },
                    { id: 48, question: "The loss of bowel or bladder function is a normal and expected finding immediately following cervical spine surgery.", options: ["False", "True"], correct: 0, rationale: "Loss of bowel or bladder function is a severe complication indicating damage to the spinal cord or nerve roots, not a normal finding." },
                    { id: 49, question: "The patient should be encouraged to use a soft mattress to improve comfort after cervical surgery.", options:["False", "True"], correct: 0, rationale: "Health teaching explicitly recommends the use of a firm mattress, not a soft one." },
                    { id: 50, question: "Prolapse is the final stage of disc herniation where the nucleus moves entirely outside the spinal canal.", options: ["False", "True"], correct: 0, rationale: "Prolapse is an early stage forming a slight bulge. Sequestration is the final stage where it moves outside the disc." }
                ]
            },
            {
                id: 'diagnostic',
                title: 'Diagnostic Procedures of the Nervous System',
                icon: 'fa-microscope',
                data: [
                    { id: 1, question: "What is given before a brain computed tomography scan to reduce the risk of brain herniation in patients with increased intracranial pressure?", options:["Hyperosmolar agent", "Intravenous antibiotic", "Anticonvulsant drug", "Corticosteroid dose"], correct: 0, rationale: "A hyperosmolar agent like mannitol might be given before scanning to reduce the risk of herniation of the brain in patients with increased intracranial pressure." },
                    { id: 2, question: "Patients are encouraged to fast for twenty four hours before a cerebral angiography procedure.", options: ["True", "False"], correct: 1, rationale: "The patient should avoid eating or drinking for only 4 to 8 hours before the test, not twenty four hours." },
                    { id: 3, question: "Which condition is a strict contraindication for performing a lumbar puncture?", options:["Increased intracranial pressure", "Unexplained severe headache", "Suspected bacterial meningitis", "Peripheral nerve inflammation"], correct: 0, rationale: "Increased intracranial pressure is a contraindication because withdrawing fluid can lead to herniation of the intracranial contents." },
                    { id: 4, question: "How long should antiseizure agents be withheld before an electroencephalogram procedure?", options:["Twenty four to forty eight hours", "Twelve to twenty four hours", "Two to four hours", "Forty eight to seventy two hours"], correct: 0, rationale: "Antiseizure agents, tranquilizers, stimulants, and antidepressants should be withheld 24 to 48 hours before the procedure." },
                    { id: 5, question: "Which substance should be avoided when testing the olfactory nerve because it stimulates trigeminal nerve endings?", options: ["Ammonia", "Vanilla", "Cloves", "Coffee"], correct: 0, rationale: "Ammonia stimulates the trigeminal nerve endings in addition to the olfactory receptors, potentially giving a false result." },
                    { id: 6, question: "What is an indication for performing a plain spine radiograph?", options:["Evaluation of spondylolisthesis", "Detection of brain tumors", "Measurement of brain cavities", "Diagnosis of sleep disorders"], correct: 0, rationale: "A spine radiograph is indicated for abnormalities or deformities in the vertebral column such as fractures, spondylolisthesis, and scoliosis." },
                    { id: 7, question: "Following a lumbar puncture the patient must remain in a standing position to equalize fluid pressure.", options:["True", "False"], correct: 1, rationale: "The patient is instructed to lie prone for 2 to 3 hours to reduce leakage of cerebrospinal fluid, then kept flat overnight." },
                    { id: 8, question: "Which contrast material is often used in magnetic resonance imaging because it is less likely to cause allergic reactions?", options:["Gadolinium", "Iodine", "Barium", "Technetium"], correct: 0, rationale: "MRI may require an injection of gadolinium, which is less likely to cause an allergic reaction than iodinated contrast material." },
                    { id: 9, question: "Which activity is explicitly omitted from the patient meal prior to an electroencephalogram?", options:["Drinking cola beverages", "Eating solid proteins", "Consuming citrus fruits", "Drinking dairy products"], correct: 0, rationale: "Coffee, tea, chocolate, and cola drinks are omitted in the meal before the test." },
                    { id: 10, question: "What distance is considered comfortable and appropriate for reading the Snellen chart during a visual acuity test?", options:["Three to six meters", "One to two meters", "Seven to ten meters", "Ten to twelve meters"], correct: 0, rationale: "The Snellen chart should be held at a comfortable reading distance of about 3 to 6 meters." },
                    { id: 11, question: "What condition requires the use of nerve conduction studies for proper evaluation?", options:["Carpal tunnel syndrome", "Increased intracranial pressure", "Cerebral arterial aneurysm", "Spinal epidural abscess"], correct: 0, rationale: "Nerve conduction studies are indicated for evaluating carpal tunnel syndrome, tarsal tunnel syndrome, and peripheral neuropathy." },
                    { id: 12, question: "Sensitivity testing for the contrast agent is performed after the cerebral angiography is complete.", options:["True", "False"], correct: 1, rationale: "A sensitivity test should be done before administering the contrast agent to check for allergic reactions." },
                    { id: 13, question: "What is an indication for performing a spinal computed tomography scan?", options:["Detection of tumors in the vertebral canal", "Confirmation of brain death", "Evaluation of paresthesia", "Diagnosis of sleep disorders"], correct: 0, rationale: "Spinal CT is used for the detection of various types of tumors in the vertebral canal." },
                    { id: 14, question: "Between which lumbar vertebrae is the needle typically inserted during a lumbar puncture?", options:["Third and fourth", "First and second", "Second and third", "Fifth and sacral"], correct: 0, rationale: "The needle is usually inserted into the subarachnoid space between the third and fourth or fourth and fifth lumbar vertebrae." },
                    { id: 15, question: "Which sign observed at the catheter insertion site indicates a possible arterial blockage following a cerebral angiography?", options: ["Absent pulse", "Warm skin", "Profuse sweating", "Muscle twitching"], correct: 0, rationale: "Signs of arterial blockage due to embolism or thrombosis include diminished or absent pulse, pallor, cyanosis, and cool skin." },
                    { id: 16, question: "Which muscle function is tested by asking the patient to push their head back against resistance?", options:["Trapezius muscle", "Sternocleidomastoid muscle", "Temporalis muscle", "Masseter muscle"], correct: 0, rationale: "The strength of the trapezius muscle is evaluated by asking the patient to push their head back against resistance." },
                    { id: 17, question: "Acetone is required to remove the collodion glue used for electrode contact after an electroencephalogram.", options: ["True", "False"], correct: 0, rationale: "The collodion glue used for electrode contact requires acetone for removal after the EEG procedure." },
                    { id: 18, question: "What complication is most commonly caused by cerebrospinal fluid leakage at the puncture site?", options:["Post lumbar puncture headache", "Hemorrhagic meningitis", "Spinal epidural abscess", "Herniation of intracranial contents"], correct: 0, rationale: "Post lumbar puncture headache is caused by cerebrospinal fluid leakage at the puncture site." },
                    { id: 19, question: "How long should pressure be immediately applied to the insertion site after a cerebral angiography to stop bleeding?", options:["Ten to fifteen minutes", "One to two minutes", "Thirty to forty minutes", "Five to eight minutes"], correct: 0, rationale: "Pressure is immediately applied on the site of insertion for 10 to 15 minutes to stop the bleeding." },
                    { id: 20, question: "What equipment is essential for stabilizing the neck of a patient with suspected cervical spine injury before radiography?", options:["Hard cervical collar", "Soft foam pillow", "Flexible neck brace", "Cotton elastic bandage"], correct: 0, rationale: "Maintenance of head alignment and neck stabilization is done with a hard cervical collar." },
                    { id: 21, question: "Which cranial nerves are assessed by observing the elevation of the soft palate and swallowing?", options:["Glossopharyngeal and vagus", "Trigeminal and facial", "Oculomotor and trochlear", "Acoustic and hypoglossal"], correct: 0, rationale: "The glossopharyngeal and vagus nerves are commonly assessed together by checking soft palate elevation and swallowing." },
                    { id: 22, question: "Instructing the patient to remain motionless is a crucial preparation step for a magnetic resonance imaging procedure.", options: ["True", "False"], correct: 0, rationale: "The primary instruction for a patient undergoing an MRI is to remain completely motionless." },
                    { id: 23, question: "Which action evaluates the function of the hypoglossal nerve?", options:["Sticking out the tongue", "Smiling and puffing cheeks", "Shrugging the shoulders", "Clenching the teeth"], correct: 0, rationale: "The hypoglossal nerve is tested by asking the patient to stick out their tongue and move it from side to side." },
                    { id: 24, question: "What is the highest score assigned to a muscle displaying full strength on the assessment scale?", options: ["Five", "Three", "Ten", "Four"], correct: 0, rationale: "A full strength muscle is assigned a score of 5 on the Medical Research Council scale." },
                    { id: 25, question: "What position is most commonly assumed by the patient during a lumbar puncture?", options:["Lateral recumbent with flexed knees", "Prone position with extended legs", "Supine position with raised head", "Standing position bending forward"], correct: 0, rationale: "The lateral recumbent position with knees flexed is the most common position used for a lumbar puncture." },
                    { id: 26, question: "Which medication must be assessed for usage prior to electromyography due to bleeding risks?", options:["Anticoagulants", "Antidepressants", "Anticonvulsants", "Antibiotics"], correct: 0, rationale: "The nurse must ask about the use of anticoagulants or aspirin because of the risk of bleeding during electromyography." },
                    { id: 27, question: "Patients should engage in strenuous activities and heavy lifting immediately after a lumbar puncture.", options:["False", "True"], correct: 0, rationale: "Patients should avoid strenuous activities, including heavy lifting, bending, and straining, the day and evening of the procedure." },
                    { id: 28, question: "Which test involves placing a vibrating tuning fork in the middle of the patient head to check for lateralization?", options:["Weber test", "Rinne test", "Romberg test", "Snellen test"], correct: 0, rationale: "The Weber test evaluates hearing lateralization by placing a vibrating tuning fork on the middle of the patient's head." },
                    { id: 29, question: "Which muscles are palpated to evaluate the motor strength of the trigeminal nerve?", options:["Temporalis and masseter", "Trapezius and sternocleidomastoid", "Biceps and triceps", "Deltoid and hamstrings"], correct: 0, rationale: "The temporalis and masseter muscles are palpated while the patient clenches their teeth to test trigeminal nerve motor function." },
                    { id: 30, question: "Which condition is an electroencephalogram commonly used to confirm in comatose patients?", options:["Brain death", "Multiple sclerosis", "Hydrocephalus", "Spinal stenosis"], correct: 0, rationale: "An EEG is utilized for the confirmation of brain death in patients with coma." },
                    { id: 31, question: "Why is a patient instructed to open their mouth during a skull radiography procedure?", options:["To make the image clearer", "To check the gag reflex", "To prevent dental damage", "To assess facial symmetry"], correct: 0, rationale: "For skull radiography, the patient should open his mouth to make the image more clear." },
                    { id: 32, question: "Acutely ill patients undergoing a brain computed tomography scan do not require monitoring of their airway patency.", options:["False", "True"], correct: 0, rationale: "Acutely ill patients should be closely monitored for changes in vital signs, neurologic status, and airway patency." },
                    { id: 33, question: "What sensation should the nurse warn the patient about when the contrast medium is injected during cerebral angiography?", options:["A warm feeling in the face", "A sharp pain in the chest", "A sudden numbness in the legs", "A cold shiver across the back"], correct: 0, rationale: "The patient should be told that a warm feeling may be felt in the face, behind eyes, or in the jaw when the contrast is injected." },
                    { id: 34, question: "Which intervention helps reduce the incidence of post lumbar puncture headache?", options:["Using a small gauge needle", "Increasing the volume of fluid removed", "Administering prophylactic antibiotics", "Keeping the patient standing post procedure"], correct: 0, rationale: "Using a small gauge needle for insertion may reduce the incidence of post-lumbar puncture headache." },
                    { id: 35, question: "Which facial sign indicates a weakness related to the facial nerve?", options:["Flattened nasolabial fold", "Equal pupillary constriction", "Symmetrical cheek puffing", "Brisk corneal reflex"], correct: 0, rationale: "A widened palpebral fissure, a flattened nasolabial fold, and incomplete blinking are signs of facial weakness." },
                    { id: 36, question: "Which condition is magnetic resonance imaging typically used to rule out or confirm?", options:["Multiple sclerosis", "Carpal tunnel syndrome", "Sleep disorders", "Bone calcifications"], correct: 0, rationale: "Head/brain MRI is used to confirm or rule out conditions like multiple sclerosis, brain tumors, and strokes." },
                    { id: 37, question: "Looking into the distance during the pupillary function test helps avoid the effect of lens accommodation.", options: ["True", "False"], correct: 0, rationale: "Asking the patient to look into the distance is done specifically to avoid the effect of accommodation." },
                    { id: 38, question: "Which beverage type is encouraged after a lumbar puncture to help reduce headache symptoms?", options:["Caffeinated drinks", "Alcoholic beverages", "High sugar juices", "Warm milk"], correct: 0, rationale: "Encouraging plenty of fluids, especially those with caffeine like coffee and colas, may be helpful to reduce headache." },
                    { id: 39, question: "What attire is recommended for a patient undergoing a nerve conduction study?", options:["Loose clothes", "Restrictive garments", "Sterile surgical gowns", "Heavy protective lead aprons"], correct: 0, rationale: "The patient should wear loose clothes and remove any metal objects before a nerve conduction study." },
                    { id: 40, question: "How long should the affected limb be kept straight following a cerebral angiography procedure?", options:["Twelve hours", "Two hours", "Twenty four hours", "Six hours"], correct: 0, rationale: "The limb should be kept straight for 12 hours after the cerebral angiography procedure." }
                ]
            },
            {
                id: 'ics',
                title: 'Intracranial Surgery (ICS) Quiz',
                icon: 'fa-user-md',
                data: [
                    { id: 1, question: "Which surgical approach is used to gain access to the pituitary gland without making incisions to the face or skull?", options:["Transsphenoidal approach", "Infratentorial approach", "Supratentorial approach", "Occipital approach"], correct: 0, rationale: "The transsphenoidal approach is used to access the pituitary gland through the nose and sphenoid bone without facial incisions." },
                    { id: 2, question: "What is the primary purpose of administering dexamethasone preoperatively for an intracranial surgery patient?", options:["Reduce cerebral edema", "Prevent postoperative seizures", "Maintain systemic blood pressure", "Eliminate surgical site infection"], correct: 0, rationale: "Preoperative corticosteroids like dexamethasone are introduced to reduce cerebral edema." },
                    { id: 3, question: "Which procedure involves making circular openings in the skull using a hand drill or automatic craniotome?", options:["Burr holes", "Cranioplasty", "Craniectomy", "Endarterectomy"], correct: 0, rationale: "Burr holes are circular openings made in the skull to make a bone flap, evacuate hematomas, or access ventricles." },
                    { id: 4, question: "How is a craniectomy distinct from a craniotomy?", options:["It involves the excision of a portion of the skull", "It repairs a cranial defect using a plastic plate", "It creates a temporary bony flap that is immediately replaced", "It requires access strictly through the nasal cavity"], correct: 0, rationale: "A craniectomy is the excision of a portion of the skull, often done to enhance the potential volume of the intracranial compartment (decompression)." },
                    { id: 5, question: "Which diagnostic test uses sound waves to evaluate the blood flow within the intracranial blood vessels?", options:["Transcranial Doppler flow studies", "Brain computed tomography", "Magnetic resonance imaging", "Cerebral angiography"], correct: 0, rationale: "Transcranial Doppler flow studies are specifically used to evaluate the blood flow within the intracranial blood vessels." },
                    { id: 6, question: "Which medication is classified as a hyperosmotic agent given to patients to reduce brain herniation risk?", options:["Mannitol", "Phenytoin", "Diazepam", "Acetaminophen"], correct: 0, rationale: "A hyperosmotic agent like mannitol may be given intravenously to reduce the risk of herniation of the brain." },
                    { id: 7, question: "When is hair typically removed for a patient undergoing a craniotomy?", options:["Immediately before surgery in the operating room", "Forty eight hours before the scheduled admission", "One week prior during a preoperative clinic visit", "On the morning of the day before the procedure"], correct: 0, rationale: "Hair is removed with clippers and the surgical site is prepared immediately before surgery, usually in the operating room, to decrease infection risk." },
                    { id: 8, question: "Which patient position is recommended after a supratentorial craniotomy?", options:["Head of bed elevated thirty degrees", "Completely flat on the back without pillows", "Prone position with the neck flexed forward", "Trendelenburg position for optimal drainage"], correct: 0, rationale: "After supratentorial surgery, the head of the bed may be elevated 30-45 degrees to promote venous drainage." },
                    { id: 9, question: "How should a patient be positioned after infratentorial surgery?", options:["Flat on one side with a small firm pillow", "Supine with the head elevated sixty degrees", "High Fowler position to improve breathing", "Prone with the neck in hyperextension"], correct: 0, rationale: "After posterior fossa (infratentorial) surgery, the patient is kept flat on one side with the head on a small, firm pillow." },
                    { id: 10, question: "What is a classic sign of diabetes insipidus following intracranial surgery?", options:["Excessive urinary output", "Severe fluid retention", "High urine specific gravity", "Elevated serum potassium"], correct: 0, rationale: "Symptoms of diabetes insipidus include excessive urinary output, decreased urine osmolality, and low urine specific gravity." },
                    { id: 11, question: "Why must serum glucose levels be measured frequently in these postoperative patients?", options:["Large doses of corticosteroids", "Prolonged preoperative fasting", "Continuous intravenous antibiotics", "Excessive mannitol administration"], correct: 0, rationale: "Patients may be at risk for hyperglycemia because of the large doses of corticosteroids prescribed." },
                    { id: 12, question: "Which bedside test differentiates cerebrospinal fluid from normal nasal mucus?", options:["Using Dextrostix to test for glucose", "Checking the specific gravity of the fluid", "Measuring the exact fluid temperature", "Culturing the fluid for bacterial growth"], correct: 0, rationale: "Differentiate between CSF and mucus with Dextrostix, as cerebrospinal fluid contains glucose." },
                    { id: 13, question: "Which set of vital sign changes indicates Cushing triad?", options:["Increased blood pressure and decreased pulse", "Decreased blood pressure and increased pulse", "Elevated body temperature and rapid breathing", "Decreased respiratory rate and pinpoint pupils"], correct: 0, rationale: "Cushing triad involves an increase in blood pressure and a decrease in pulse with respiratory failure, indicating increased ICP." },
                    { id: 14, question: "What turning technique is recommended to prevent strain on the cranial incision and tearing of sutures?", options:["Turn the body as a single unit", "Turn the head followed by the torso", "Elevate the legs before moving the trunk", "Ask the patient to pull on the side rails"], correct: 0, rationale: "When the patient is being turned, the body should be turned as a unit (log-rolled) to prevent placing strain on the incision." },
                    { id: 15, question: "Why is extreme head rotation avoided after intracranial surgery?", options:["It raises intracranial pressure", "It triggers severe neck muscle spasms", "It restricts the carotid artery blood flow", "It dislodges the endotracheal tube"], correct: 0, rationale: "Extreme head rotation is avoided because it raises intracranial pressure (ICP)." },
                    { id: 16, question: "Why must rewarming be conducted slowly if a patient experiences hypothermia after a lengthy surgery?", options:["To prevent shivering", "To avoid rapid vasodilation", "To prevent immediate sweating", "To avoid superficial skin burns"], correct: 0, rationale: "Rewarming should occur slowly to prevent shivering, which increases cellular oxygen demands." },
                    { id: 17, question: "What does patient restlessness most likely indicate following intracranial surgery?", options:["Pain or an obstructed urinary drainage system", "Complete recovery from surgical anesthesia", "Expected side effect of diuretic medications", "Sudden return to baseline consciousness"], correct: 0, rationale: "Restlessness may reflect a return to consciousness but may also be due to pain, confusion, or an obstructed urinary drainage system." },
                    { id: 18, question: "What is the immediate nursing action if the cranial dressing becomes heavily stained with blood?", options:["Reinforce it with a sterile dressing and report immediately", "Remove the dressing entirely to inspect the incision", "Wash the stained area vigorously with sterile saline", "Apply a tight elastic bandage around the entire head"], correct: 0, rationale: "A heavily stained or displaced dressing should be reinforced with a sterile one and reported immediately." },
                    { id: 19, question: "When does postoperative cerebral edema typically reach its peak?", options:["Twenty four to thirty six hours", "Two to four hours", "Forty eight to seventy two hours", "Five to seven days"], correct: 0, rationale: "Some degree of cerebral edema occurs after brain surgery, with a peak 24 to 36 hours after surgery." },
                    { id: 20, question: "What should the nurse suspect if a patient complains of a salty taste or postnasal drip postoperatively?", options:["Cerebrospinal fluid trickling down the throat", "Normal side effect of general anesthesia", "Mild infection of the pharyngeal tonsils", "Residual effect of preoperative antibiotics"], correct: 0, rationale: "Attention should be paid to the patient who complains of a salty taste or postnasal drip because this can be caused by CSF trickling down the throat." },
                    { id: 21, question: "Which surgical approach requires maintaining nasal packing and instructing the patient to avoid nose blowing?", options:["Transsphenoidal approach", "Supratentorial approach", "Infratentorial approach", "Occipital approach"], correct: 0, rationale: "The transsphenoidal approach involves maintaining nasal packing in place and instructing the patient to avoid blowing their nose." },
                    { id: 22, question: "What is the primary surgical purpose of a cranioplasty?", options:["To repair a cranial defect", "To remove a massive brain tumor", "To drain a deep intracranial abscess", "To measure strict intracranial pressure"], correct: 0, rationale: "Cranioplasty is a repair of a cranial defect by means of a plastic, metal plate, or bone graft." },
                    { id: 23, question: "Which medication is commonly prescribed prophylactically to prevent postoperative seizures?", options: ["Phenytoin", "Furosemide", "Lorazepam", "Acetaminophen"], correct: 0, rationale: "Antiseizure medication like phenytoin or diazepam is often prescribed prophylactically in patients with supratentorial craniotomy." },
                    { id: 24, question: "Which respiratory complication is a direct risk of immobility and decreased level of consciousness?", options:["Pneumonia", "Bronchial asthma", "Pulmonary fibrosis", "Tension pneumothorax"], correct: 0, rationale: "Pneumonia can develop due to aspiration and restricted mobility from decreased LOC and immunosuppression." },
                    { id: 25, question: "Why are histamine receptor antagonists prescribed for postoperative intracranial surgery patients?", options:["To suppress the secretion of gastric acid", "To prevent allergic reactions to contrast dye", "To reduce the risk of surgical site infections", "To control severe postoperative head pain"], correct: 0, rationale: "Patients are prone to stress ulcers, so histamine-2 receptor antagonists are prescribed to suppress the secretion of gastric acid." },
                    { id: 26, question: "What is a recommended nursing intervention for managing periorbital edema?", options:["Applying cold compresses over the eyes", "Massaging the orbital area firmly", "Administering warm intravenous fluids", "Keeping the head of the bed flat"], correct: 0, rationale: "Nursing measures include elevating the head of the bed and applying cold compresses over the eyes." },
                    { id: 27, question: "What is the proper discharge teaching regarding the patient scalp and sutures?", options:["Keep the scalp dry until all sutures are removed", "Wash the scalp vigorously with soap every day", "Apply a thick layer of antibiotic ointment hourly", "Remove the surgical sutures independently at home"], correct: 0, rationale: "The scalp should be kept dry until all sutures have been removed." },
                    { id: 28, question: "Why is it mandatory to check gag and swallowing reflexes before initiating oral fluids?", options:["To prevent pulmonary aspiration", "To stimulate gastric acid production", "To measure baseline saliva volume", "To assess cranial nerve optic function"], correct: 0, rationale: "The presence of gag and swallowing reflex must be checked before initiation of oral fluids to prevent aspiration." },
                    { id: 29, question: "Which action should be avoided to prevent creating pressure on the operative site and risking a cerebrospinal fluid leak?", options:["Coughing and sneezing", "Taking slow deep breaths", "Performing range of motion", "Blinking the eyes rapidly"], correct: 0, rationale: "The patient is instructed to avoid coughing, sneezing, or nose blowing, which can cause CSF leakage by creating pressure." },
                    { id: 30, question: "What complication might a significant and sudden increase in periorbital edema indicate?", options:["A postoperative clot and increasing intracranial pressure", "A completely normal expected healing response", "An improved rate of cerebral venous drainage", "The complete resolution of general cerebral edema"], correct: 0, rationale: "The surgeon is notified if periorbital edema increases significantly, as it implies a postoperative clot, increasing ICP, and poor venous drainage." },
                    { id: 31, question: "What is the primary role of diazepam or lorazepam given preoperatively?", options:["To relieve patient anxiety", "To reduce active brain swelling", "To prevent surgical infections", "To maintain strict blood pressure"], correct: 0, rationale: "Diazepam or lorazepam may be prescribed preoperatively to relieve anxiety." },
                    { id: 32, question: "Which specific symptom is a direct consequence of surgical injury to the hypothalamic centers?", options:["Moderate temperature elevation", "Severe resting bradycardia", "General muscle spasticity", "Complete visual field loss"], correct: 0, rationale: "Moderate temperature elevation can be expected because of injury to the hypothalamic centers that regulate body temperature." },
                    { id: 33, question: "Which fluid imbalance syndrome is characterized by water retention and serum hypo osmolality?", options:["Syndrome of inappropriate antidiuretic hormone secretion", "Classic diabetes insipidus", "Diabetic hyperosmolar ketoacidosis", "Cushing adrenal syndrome"], correct: 0, rationale: "Syndrome of Inappropriate Antidiuretic Hormone Secretion (SIADH) presents with water retention, hyponatremia, and serum hypo-osmolality." },
                    { id: 34, question: "How should healthcare personnel enter the room of a patient recovering from intracranial surgery?", options:["Announcing their presence to avoid startling the patient", "Silently to ensure the patient is not awakened", "Quickly to minimize the total door open time", "With all overhead bright lights turned on"], correct: 0, rationale: "Health care personnel should announce their presence when entering the room to avoid startling the patient." },
                    { id: 35, question: "What is a common but temporary cause of impaired hearing postoperatively in these patients?", options:["A large bulky head dressing", "Permanent acoustic nerve damage", "A severe inner ear infection", "Side effects of intravenous antibiotics"], correct: 0, rationale: "The large head dressing applied after surgery may impair hearing temporarily." },
                    { id: 36, question: "Which visual change should the nurse carefully observe and record as a potential neurologic deficit?", options:["Diplopia", "Hyperopia", "Presbyopia", "Color blindness"], correct: 0, rationale: "The nurse carefully observes any neurologic deficit, such as visual changes like diplopia or blurred vision." },
                    { id: 37, question: "Which specific goal is an indication for performing a craniotomy procedure?", options:["Evacuating a blood clot", "Repairing a facial bone fracture", "Treating a superficial scalp laceration", "Diagnosing a mild physical concussion"], correct: 0, rationale: "A craniotomy involves opening the skull to remove a tumor, relieve elevated ICP, evacuate a blood clot, or control hemorrhage." },
                    { id: 38, question: "Which neck movement must be avoided to prevent tearing of the suture line after an infratentorial surgery?", options:["Flexion of the neck", "Extension of the legs", "Elevation of the arms", "Rotation of the shoulders"], correct: 0, rationale: "After infratentorial surgery, the nurse must avoid flexion of the neck to prevent tearing of the suture line." },
                    { id: 39, question: "What resource should the nurse provide to help an aphasic patient communicate effectively?", options:["Picture and word cards", "A high volume hearing aid", "Only close family members", "Written verbal consent forms"], correct: 0, rationale: "For aphasic patients, writing materials or picture and word cards of frequently used items may help improve communication." },
                    { id: 40, question: "Why is careful assessment of respiratory status deemed essential for neurosurgical patients?", options:["Small degrees of hypoxia can aggravate cerebral ischemia", "It directly measures the exact intracranial pressure", "It prevents superficial skin integrity breakdown", "It guarantees normal gastrointestinal tract motility"], correct: 0, rationale: "Assessment of respiratory status is essential because small degrees of hypoxia can aggravate cerebral ischemia." },
                    { id: 41, question: "A craniotomy procedure involves permanently excising a bone flap without repositioning it after surgery.", options:["False", "True"], correct: 0, rationale: "A craniectomy involves excision. A craniotomy involves creating a bony flap and repositioning it after surgery." },
                    { id: 42, question: "The transsphenoidal surgical approach provides access to the pituitary gland directly through the nasal cavity.", options: ["True", "False"], correct: 0, rationale: "The transsphenoidal approach is used to access the pituitary gland by going through the nose and the sphenoid bone." },
                    { id: 43, question: "Corticosteroids are administered preoperatively to stimulate the patient immune system response.", options: ["False", "True"], correct: 0, rationale: "Corticosteroids like dexamethasone are given before surgery specifically to reduce cerebral edema." },
                    { id: 44, question: "Patients who undergo supratentorial surgery should have the head of the bed elevated thirty to forty five degrees.", options: ["True", "False"], correct: 0, rationale: "The head of the bed is maintained elevated at 30-45 degrees to promote venous drainage after supratentorial craniotomy." },
                    { id: 45, question: "Cerebrospinal fluid can be differentiated from nasal mucus because it contains measurable glucose.", options: ["True", "False"], correct: 0, rationale: "Cerebrospinal fluid contains glucose, which allows it to be differentiated from mucus using Dextrostix." },
                    { id: 46, question: "Cushing triad is clinically characterized by a sharp decrease in blood pressure and an increase in pulse rate.", options:["False", "True"], correct: 0, rationale: "Cushing triad consists of an increase in blood pressure and a decrease in pulse with respiratory failure." },
                    { id: 47, question: "Shivering should be strictly prevented during rewarming because it significantly increases cellular oxygen demands.", options: ["True", "False"], correct: 0, rationale: "Rewarming should occur slowly to prevent shivering, which increases cellular oxygen demands." },
                    { id: 48, question: "Patients are strongly encouraged to cough vigorously after intracranial surgery to clear their airway.", options: ["False", "True"], correct: 0, rationale: "Patients are instructed to avoid coughing, sneezing, or nose blowing because these actions increase pressure and can cause CSF leakage." },
                    { id: 49, question: "Periorbital edema and ecchymosis forming a black eye are common expected consequences of intracranial surgery.", options: ["True", "False"], correct: 0, rationale: "Periorbital edema is a common consequence as fluid drains into dependent areas when the patient is prone during surgery." },
                    { id: 50, question: "Hair removal for cranial surgery is routinely completed several days prior to the admission date.", options: ["False", "True"], correct: 0, rationale: "Hair is removed with clippers immediately before surgery, usually in the operating room, to decrease the chance of infection." }
                ]
            },
            {
                id: 'lumbar',
                title: 'Lumbar Disc Herniation Quiz',
                icon: 'fa-x-ray',
                data: [
                    { id: 1, question: "Which age group represents the most common risk factor for developing a herniated lumbar disc?", options: ["Twenty to thirty years", "Thirty five to fifty years", "Fifty five to seventy years", "Seventy five to ninety years"], correct: 1, rationale: "The most common risk factor is being between the ages of 35 and 50 as the body ages, natural biochemical changes cause discs to gradually dry out." },
                    { id: 2, question: "Which surgical procedure involves the removal of the bone between the spinal process and facet pedicle junction?", options: ["Microscopic discectomy", "Spinal foraminotomy", "Lumbar laminectomy", "Intervertebral fusion"], correct: 2, rationale: "Laminectomy involves the removal of the bone between the spinal process and facet pedicle junction to expose the neural elements in the spinal canal." },
                    { id: 3, question: "The immediate symptoms of spinal trauma typically appear within hours and last for several continuous years.", options: ["True", "False"], correct: 1, rationale: "The immediate symptoms of trauma are short-lived, and the herniated disc symptoms do not appear for months or years." },
                    { id: 4, question: "Testing the postoperative wound dressing for glucose is specifically performed to detect which surgical complication?", options: ["Severe epidural hematoma", "Deep soft tissue infection", "Cerebrospinal fluid leakage", "Recurrent disc herniation"], correct: 2, rationale: "The surgical dressing is inspected for excess drainage and tested for glucose to check for cerebrospinal fluid leakage." },
                    { id: 5, question: "How long is strict bed rest generally recommended for patients experiencing severe acute low back pain?", options: ["One to two days", "Three to five days", "One to two weeks", "Three to four weeks"], correct: 0, rationale: "Bed rest for severe pain is best limited to one to two days, as extended rest will lead to stiffness, muscle weakness and more pain." },
                    { id: 6, question: "Women have twice the statistical risk of developing a lumbar herniated disc when compared directly to men.", options: ["True", "False"], correct: 1, rationale: "Men have twice the risk for lumbar herniated discs compared with women." },
                    { id: 7, question: "In which stage of disc herniation does the nucleus pulposus break through the annulus fibrosis but completely remain within the disc?", options: ["General disc degeneration", "Initial disc prolapse", "Advanced disc extrusion", "Complete disc sequestration"], correct: 2, rationale: "During extrusion, the gel-like nucleus pulposus breaks through the tire-like wall but remains within the disc." },
                    { id: 8, question: "A positive straight leg raising test occurs when sciatic pain is experienced at which specific physical angle range?", options: ["Ten to thirty degrees", "Thirty to seventy degrees", "Seventy to ninety degrees", "Ninety to one hundred degrees"], correct: 1, rationale: "The patient has a positive straight leg raising test if they experience sciatic pain when the straight leg is at an angle of between 30 and 70 degrees." },
                    { id: 9, question: "A patient should be immediately placed on a standard bedpan while lying completely flat on their back to maintain proper spinal alignment.", options: ["True", "False"], correct: 1, rationale: "The patient should not be placed on a bedpan while lying on his back. They should roll onto it to maintain proper alignment." },
                    { id: 10, question: "Which sleeping position is considered the most comfortable and appropriate for a patient with a lumbar disc herniation?", options: ["Prone with the head elevated", "Supine with the knees elevated", "Lateral with the hips extended", "Supine with the legs flattened"], correct: 1, rationale: "The most comfortable sleep position is lying on the back using a relatively firm mattress with slightly elevating the knees by placing a flat pillow under them." },
                    { id: 11, question: "Chronic low back pain is medically defined as pain that persists continuously for a minimum of how many weeks?", options: ["Four continuous weeks", "Six continuous weeks", "Eight continuous weeks", "Twelve continuous weeks"], correct: 3, rationale: "Low back pain may be classified by duration as chronic when the pain lasts for more than twelve weeks." },
                    { id: 12, question: "Cauda equina syndrome typically causes an increased muscle tone in the external urinary sphincter.", options: ["True", "False"], correct: 1, rationale: "Cauda equina syndrome causes decreased tone in the external sphincter, along with involuntary overflow incontinence." },
                    { id: 13, question: "Which specific bed turning technique is essential to prevent twisting the spine after lumbar surgery?", options: ["Pivot transfer technique", "Logrolling method process", "Slide board transfer action", "Three point turning shift"], correct: 1, rationale: "The patient is taught to turn as a unit using the logrolling fashion to facilitate turning and avoid twisting the spine." },
                    { id: 14, question: "What precise anatomical structure is physically displaced beyond the intervertebral disc space in a herniated disc?", options: ["Central spinal nerve root", "Internal nucleus pulposus", "Terminal cauda equina bundle", "Outer spinal cord membrane"], correct: 1, rationale: "A herniated disc is a displacement of disc material, specifically the nucleus pulposus or annulus fibrosis, beyond the intervertebral disc space." },
                    { id: 15, question: "Therapeutic ice application is considered most effective when used continuously for the first seven days after back pain suddenly starts.", options: ["True", "False"], correct: 1, rationale: "Ice is most effective for the first forty-eight hours after the back pain has started to decrease initial inflammation." },
                    { id: 16, question: "What specific biochemical change primarily decreases the natural water content of the nucleus pulposus during the aging process?", options: ["Massive increase in calcium deposits", "Progressive loss of protein polysaccharides", "Complete depletion of synovial fluid", "Continuous overproduction of lactic acid"], correct: 1, rationale: "With aging, the loss of protein polysaccharides in the disc decreases the water content of the nucleus pulposus." },
                    { id: 17, question: "Which specific diagnostic tool is utilized to diagnose peripheral nerve impairments and correctly localize the involved spinal nerve roots?", options: ["Standard computed tomography", "Advanced magnetic resonance imaging", "Diagnostic electromyography testing", "Traditional lumbar myelography"], correct: 2, rationale: "Electrophysiological studies like electromyography localize the specific spinal nerve roots involved and diagnose peripheral nerve impairments." },
                    { id: 18, question: "Patients managing a herniated disc should be strictly instructed to completely avoid active range of motion physical exercises.", options: ["True", "False"], correct: 1, rationale: "Patients are actually encouraged to perform active and passive range of motion exercises while avoiding activities that cause straining." },
                    { id: 19, question: "Which distinct surgical procedure permanently fuses the vertebral spinous process with a bone graft to structurally stabilize the spine?", options: ["Minimally partial laminotomy", "Microscopic endoscopic discectomy", "Traditional lumbar laminectomy", "Surgical discectomy with fusion"], correct: 3, rationale: "Discectomy with fusion involves the fusion of the vertebral spinous process with a bone graft to bridge over the defective disk and stabilize the spine." },
                    { id: 20, question: "Which neurological finding represents a classic clinical presentation of the dangerous cauda equina syndrome?", options: ["Severe unilateral foot drop", "Progressive saddle anesthesia", "Hyperactive deep tendon reflexes", "Significantly increased muscle spasticity"], correct: 1, rationale: "Symptoms of cauda equina syndrome include saddle anesthesia, which is the loss of sensation in the buttocks, perineum, and inner thighs." },
                    { id: 21, question: "Surgical intervention should only be considered after completely finishing a full twelve weeks of conservative treatment regardless of symptom severity.", options: ["True", "False"], correct: 1, rationale: "Surgery may be recommended prior to completing six weeks of care if there is severe pain or progressive neurological symptoms." },
                    { id: 22, question: "What is the primary physiological reason for safely providing solid food as early as possible after spinal surgery?", options: ["To prevent severe postoperative hypovolemia", "To effectively stimulate intestinal peristalsis", "To greatly enhance rapid tissue healing", "To directly reduce systemic wound infection"], correct: 1, rationale: "Solid food is given as early as possible after surgery to stimulate peristalsis and to prevent the occurrence of distension." },
                    { id: 23, question: "What physical action typically significantly aggravates the severe radicular pain directly associated with a herniated disc?", options: ["Maintaining strict complete bed rest", "Practicing very shallow breathing exercises", "Experiencing sudden sneezing or coughing", "Lying down in a lateral recumbent position"], correct: 2, rationale: "Radicular pain is aggravated by actions that increase intraspinal fluid pressure, such as bending, lifting, straining, sneezing, or coughing." },
                    { id: 24, question: "Systemic corticosteroid medications are absolutely contraindicated during the initial acute symptomatic phase of a lumbar herniated disc.", options: ["True", "False"], correct: 1, rationale: "Systemic corticosteroids may be used in the acute phase along with muscle relaxants and nonsteroidal anti-inflammatory drugs to decrease inflammation." },
                    { id: 25, question: "A patient verbally shows a lack of recall and makes clear statements of misconception regarding their treatment. Which nursing diagnosis completely applies?", options: ["Ineffective peripheral tissue perfusion", "Significantly impaired physical mobility", "Deficient knowledge regarding the condition", "High risk for urinary elimination alteration"], correct: 2, rationale: "A nursing diagnosis of deficient knowledge is evidenced by requests for information, statements of misconception, and lack of recall." },
                    { id: 26, question: "To properly assess a patient using the standard straight leg raising test, what exact position must the patient's knee be maintained in?", options: ["Maintained completely flexed backward", "Maintained slightly bent comfortably", "Maintained completely straight throughout", "Maintained externally rotated outward"], correct: 2, rationale: "During the straight leg raising test, the examiner lifts the patient's leg to flex the hip while the knee is kept completely straight." },
                    { id: 27, question: "Patients should be heavily instructed to regularly carry household items weighing up to five kilograms to rapidly strengthen their recovering back muscles.", options: ["True", "False"], correct: 1, rationale: "Patients should avoid carrying a weight of more than two kilograms to prevent placing strain on the injured nerves and spine." },
                    { id: 28, question: "What is the primary specific surgical goal when a surgeon performs a routine spinal foraminotomy?", options: ["To replace the completely damaged central disc", "To increase the physical space for the nerve exit", "To remove the entire posterior arch of the vertebra", "To biologically fuse two adjacent vertebral bodies"], correct: 1, rationale: "A foraminotomy involves the removal of the intervertebral foramen to increase the space for the exit of a spinal nerve." },
                    { id: 29, question: "What common distinct physical sign is frequently observed in the back due to severe muscle spasm from a sudden disc herniation?", options: ["Development of excessive lumbar lordosis", "Appearance of noticeable thoracic kyphosis", "Complete loss of the normal lumbar curve", "Formation of extreme lateral spinal scoliosis"], correct: 2, rationale: "Movement of the back is restricted, and the back appears straight with a loss of the normal lumbar curve due to muscle spasm." },
                    { id: 30, question: "Applying a hot thermal compress is considered an excellent medical option for relieving painful muscle spasms immediately during the very first two days.", options: ["True", "False"], correct: 1, rationale: "Heat therapy is helpful for painful muscle spasms, but only after the first forty-eight hours have passed." },
                    { id: 31, question: "Which specific pathological factor accurately represents a severe infectious cause of debilitating low back pain?", options: ["Malignant progressive bone metastasis", "Degenerative central spinal stenosis", "Bacterial progressive osteomyelitis", "Mechanical sudden muscle spasm"], correct: 2, rationale: "Infectious causes of low back pain include osteomyelitis and abscess formations." },
                    { id: 32, question: "Where does the displaced nucleus pulposus primarily lie during the advanced sequestration stage of a herniated disc?", options: ["Safely inside the intact annulus fibrosis", "Entirely within the adjacent bone vertebra", "Completely outside the disc in the spinal canal", "Directly anterior to the solid vertebral body"], correct: 2, rationale: "During sequestration, the nucleus pulposus breaks through the annulus fibrosis and lies outside the disc directly in the spinal canal." },
                    { id: 33, question: "Why are nonsteroidal antiinflammatory drugs typically ordered to be directly taken with antacids for patients treating herniated discs?", options: ["To safely prevent severe gastrointestinal irritation", "To rapidly enhance intestinal medication absorption", "To safely decrease the overall systemic blood pressure", "To chemically stimulate earlier postoperative ambulation"], correct: 0, rationale: "Nonsteroidal anti-inflammatory drugs are ordered to be taken with antacids or food to prevent gastrointestinal irritation." },
                    { id: 34, question: "Which specific furniture item is most appropriate to strongly recommend for a recovering patient when sitting down at home?", options: ["Very soft thickly cushioned living room sofa", "Very firm completely straight backed chair", "Directly on the floor with comfortably crossed legs", "Highly adjustable reclining bedroom lounge chair"], correct: 1, rationale: "It is recommended to use a firm straight-backed chair with feet on a footstool or flat on the floor to maintain proper spinal alignment." },
                    { id: 35, question: "How long should a postoperative patient completely avoid taking full tub baths after safely undergoing standard spinal surgery?", options: ["Around one to two consecutive weeks", "Around three to four consecutive weeks", "Around six to eight consecutive weeks", "Around ten to twelve consecutive weeks"], correct: 1, rationale: "Tub baths should be avoided for three to four weeks depending on the physician's recommendation to prevent surgical site complications." },
                    { id: 36, question: "Which specific alternative conservative therapy involves safely inserting hair thin needles deeply into the skin near the targeted area of pain?", options: ["Direct electrical transcutaneous nerve stimulation", "Deep penetrating localized ultrasound therapy", "Traditional physical meridian acupuncture therapy", "Direct localized targeted epidural steroid injection"], correct: 2, rationale: "Acupuncture is an alternative therapy that uses hair-thin needles inserted into the skin near the area of pain." },
                    { id: 37, question: "When safely turning a patient directly on the very first postoperative day, what essential protective tool should the nursing staff strictly utilize?", options: ["Heavy mechanical ceiling overhead lift", "Simple standardized medical turning sheet", "Heavy weighted physical traction pulley", "Smooth plastic sliding transfer board"], correct: 1, rationale: "A turning sheet and sufficient personnel should be used when turning the patient, especially on the first postoperative day." },
                    { id: 38, question: "Which specific intensive exercise program is generally medically prescribed to stabilize the spine and decrease pain for an advanced disc herniation?", options: ["Vigorous outdoor continuous aerobic running", "Heavy progressively increasing weight lifting", "Prone positioned physical back extension exercises", "Intensive repetitive high impact jumping routines"], correct: 2, rationale: "Back extension exercises in a prone or standing position, along with abdominal strengthening, are prescribed to strengthen the back and decrease pain." },
                    { id: 39, question: "What is the primary important medical purpose of having a patient routinely perform muscle setting exercises carefully before their scheduled surgery?", options: ["To successfully prevent massive gastrointestinal stasis", "To successfully maintain their basic muscle tone", "To successfully reduce their baseline blood pressure", "To successfully increase their deep tendon reflexes"], correct: 1, rationale: "The patient is encouraged to perform deep breathing and muscle setting exercises preoperatively to maintain muscle tone." },
                    { id: 40, question: "Which specific dangerous postoperative complication is physically characterized by severe inflammation of one of the delicate membranes surrounding the spinal cord?", options: ["Massive expanding surgical epidural hematoma", "Progressive debilitating cauda equina syndrome", "Severe localized postoperative surgical arachnoiditis", "Degenerative mechanical central spinal stenosis"], correct: 2, rationale: "Arachnoiditis, which is the inflammation of the arachnoid membrane, is listed as a potential surgical complication of herniated disc procedures." }
                ]
            },
            {
                id: 'assessment',
                title: 'Neurological Assessment Quiz',
                icon: 'fa-stethoscope',
                data: [
                    { id: 1, question: "What is the total maximum score a patient can achieve on the Glasgow Coma Scale?", options: ["Fifteen", "Thirteen", "Ten", "Eight"], correct: 0, rationale: "The Glasgow Coma Scale is a 15-point scoring system used to quantify the level of consciousness after a brain injury." },
                    { id: 2, question: "Which cranial nerve is responsible for the sense of smell?", options: ["Olfactory nerve", "Optic nerve", "Facial nerve", "Vagus nerve"], correct: 0, rationale: "The olfactory nerve is the first cranial nerve and acts to transmit sensory information related to smell." },
                    { id: 3, question: "Which term describes the loss of memory for immediate and recent events?", options:["Anterograde amnesia", "Retrograde amnesia", "General aphasia", "Speech dysarthria"], correct: 0, rationale: "Anterograde amnesia specifically refers to the loss of memory for immediate and recent events." },
                    { id: 4, question: "What is the usual grading scale range used to assess muscle strength?", options: ["Zero to five", "One to ten", "Zero to three", "One to four"], correct: 0, rationale: "The Medical Research Council scale assigns a score from 0 to 5 for each muscle based on strength." },
                    { id: 5, question: "Which cranial nerve is evaluated by asking the patient to shrug their shoulders against resistance?", options:["Spinal accessory nerve", "Hypoglossal nerve", "Glossopharyngeal nerve", "Oculomotor nerve"], correct: 0, rationale: "The spinal accessory nerve innervates the trapezius muscle, which is tested by shrugging the shoulders against resistance." },
                    { id: 6, question: "Which tool is primarily used to test visual acuity during a neurological examination?", options:["Snellen chart", "Tuning fork", "Reflex hammer", "Penlight torch"], correct: 0, rationale: "The Snellen eye chart is used specifically for examining visual acuity at a comfortable reading distance." },
                    { id: 7, question: "What type of response does a patient in a stupor primarily exhibit?", options:["Verbal response to continuous vigorous stimulation", "Spontaneous eye opening to normal conversation", "Reflex response to minimal painful stimuli only", "Complete orientation to time and specific place"], correct: 0, rationale: "A stupor is characterized by an impaired state where the patient provides a verbal response only to vigorous and continuous stimulation." },
                    { id: 8, question: "Which test assesses the ability to identify a familiar object placed in the hand with closed eyes?", options:["Stereognosis", "Proprioception", "Lateralization", "Coordination"], correct: 0, rationale: "Stereognosis evaluates integrative sensation by asking the patient to identify a familiar object using their fingers with their eyes closed." },
                    { id: 9, question: "Which muscle is tested for strength by asking the patient to open their mouth and clench their teeth?", options:["Masseter muscle", "Trapezius muscle", "Deltoid muscle", "Biceps muscle"], correct: 0, rationale: "The masseter and temporalis muscles are tested for strength and equality by having the patient clench their teeth." },
                    { id: 10, question: "What does a widened palpebral fissure and a flattened nasolabial fold typically indicate?", options:["Facial nerve weakness", "Optic nerve damage", "Trigeminal nerve lesion", "Oculomotor nerve palsy"], correct: 0, rationale: "These signs indicate facial weakness, which happens when the facial nerve becomes damaged." },
                    { id: 11, question: "Which reflex is elicited by stroking the lateral aspect of the sole of the foot from the heel to the toes?", options: ["Plantar reflex", "Patellar reflex", "Achilles reflex", "Abdominal reflex"], correct: 0, rationale: "The plantar reflex involves stroking the lateral aspect of the sole from the heel to the toes to observe toe movements." },
                    { id: 12, question: "Which function is tested by asking the patient to run the heel of one foot up and down the shin of the other leg?", options:["Cerebellar function", "Sensory perception", "Muscular strength", "Cranial reflexes"], correct: 0, rationale: "The heel-knee-shin test evaluates cerebellar function by observing the speed and precision of movements." },
                    { id: 13, question: "What is the normal ratio of air conduction to bone conduction in Rinne test?", options:["Air conduction lasts twice as long as bone conduction", "Bone conduction lasts twice as long as air conduction", "Air conduction and bone conduction last equally long", "Bone conduction is completely absent during the test"], correct: 0, rationale: "Normally, air conduction is heard twice as long as bone conduction during Rinne test." },
                    { id: 14, question: "Which cranial nerve is responsible for taste on the anterior two thirds of the tongue?", options:["Facial nerve", "Glossopharyngeal nerve", "Vagus nerve", "Hypoglossal nerve"], correct: 0, rationale: "The facial nerve is responsible for taste sensation on the anterior two-thirds of the tongue." },
                    { id: 15, question: "What finding is considered abnormal when observing the tongue at rest and on protrusion?", options:["Deviation to one side", "Uniform pink color", "Smooth moist surface", "Perfect central alignment"], correct: 0, rationale: "Deviation to one side indicates possible damage to the hypoglossal nerve." },
                    { id: 16, question: "Which specific area is assessed to evaluate the function of the trochlear nerve?", options:["Extraocular eye movements", "Facial muscle strength", "Auditory hearing acuity", "Palatal swallowing ability"], correct: 0, rationale: "The trochlear nerve is evaluated through testing the six cardinal directions of gaze for extraocular muscle movements." },
                    { id: 17, question: "How should the patient be positioned when testing the triceps deep tendon reflex while seated?", options:["Support the upper arm and let the forearm hang free", "Keep the arm fully extended and perfectly rigid", "Hold the patient arm tightly against their chest", "Elevate the entire arm straight above the head"], correct: 0, rationale: "When testing the triceps reflex in a seated patient, the upper arm should be supported to allow the forearm to hang freely." },
                    { id: 18, question: "Which medical condition is frequently associated with an increased risk of peripheral neuropathy?", options:["Diabetes mellitus", "Essential hypertension", "Ischemic cerebral stroke", "Bacterial meningitis"], correct: 0, rationale: "Patients with diabetes mellitus frequently present with peripheral neuropathy." },
                    { id: 19, question: "What term refers to an abnormal involuntary oscillation of the eyeballs?", options:["Nystagmus", "Strabismus", "Amblyopia", "Diplopia"], correct: 0, rationale: "Nystagmus is an involuntary horizontal, vertical, or rotary oscillation of the eyeballs." },
                    { id: 20, question: "Which grade represents a muscle that moves against gravity but not against resistance?", options:["Grade three", "Grade two", "Grade four", "Grade one"], correct: 0, rationale: "A grade 3 on the muscle strength scale denotes movement against gravity but not against resistance." },
                    { id: 21, question: "What component of the mental function assessment evaluates the patient inner feelings?", options:["Mood status", "Affect display", "Intelligence level", "Cognitive judgment"], correct: 0, rationale: "Mood represents the patient's internal feelings, whereas affect is the outward expression." },
                    { id: 22, question: "Which instrument is required to properly test vibration sense on bony prominences?", options: ["Tuning fork", "Reflex hammer", "Wooden tongue blade", "Medical stethoscope"], correct: 0, rationale: "A vibrating tuning fork is placed over bony prominences to assess vibration sensory function." },
                    { id: 23, question: "Which sensory test involves moving the patient great toe up and down to check position awareness?", options: ["Proprioception", "Stereognosis", "Light touch", "Temperature discrimination"], correct: 0, rationale: "Joint position sense, or proprioception, is evaluated by demonstrating and testing the upward and downward movement of the toe." },
                    { id: 24, question: "Which condition might lead to bilateral anosmia giving a false indication of nerve damage?", options:["Common cold", "Optic neuritis", "Acoustic neuroma", "Trigeminal neuralgia"], correct: 0, rationale: "Bilateral anosmia can often be due to a simple nasal problem like the common cold rather than cranial nerve damage." },
                    { id: 25, question: "What type of questions should the examiner avoid when testing sensory function?", options:["Leading questions", "Open questions", "Direct questions", "Clarifying questions"], correct: 0, rationale: "Examiners should avoid leading questions (such as asking if something feels sharp) to prevent skewing the sensory evaluation." },
                    { id: 26, question: "Which reflex response indicates a positive Babinski sign in an adult patient?", options:["Extension of the great toe with fanning of other toes", "Rapid flexion of all toes pointing directly downwards", "Immediate withdrawal of the entire lower extremity", "Complete absence of any movement in all the toes"], correct: 0, rationale: "A positive Babinski sign is marked by an abnormal extension of the great toe along with the fanning of the other toes." },
                    { id: 27, question: "Where should the vibrating tuning fork be placed during the Weber test?", options:["Middle of the patient head", "Base of the mastoid bone", "Anterior tibial tubercle", "Medial aspect of malleolus"], correct: 0, rationale: "During the Weber test for lateralization, the vibrating tuning fork is placed strictly on the middle of the patient's head." },
                    { id: 28, question: "Which component is not part of the Glasgow Coma Scale assessment?", options:["Pupillary light reflex", "Eye opening response", "Best verbal response", "Best motor response"], correct: 0, rationale: "The Glasgow Coma Scale scores only eye opening, verbal response, and motor response." },
                    { id: 29, question: "What is the normal response when shining a bright light obliquely into a patient pupil?", options:["Direct constriction", "Rapid dilation", "Upward deviation", "Lateral movement"], correct: 0, rationale: "Shining a bright light obliquely into the pupil normally induces a direct pupillary constriction." },
                    { id: 30, question: "Which cranial nerves are assessed together due to their combined role in swallowing and the gag reflex?", options:["Glossopharyngeal and vagus", "Trigeminal and facial", "Oculomotor and trochlear", "Acoustic and hypoglossal"], correct: 0, rationale: "The glossopharyngeal and vagus nerves are functionally tested together by evaluating the gag reflex, soft palate elevation, and swallowing." },
                    { id: 31, question: "How many digits should a normal patient be able to recall immediately after one hearing?", options:["Seven digits", "Five digits", "Nine digits", "Three digits"], correct: 0, rationale: "Under normal conditions, a patient should be able to recall seven digits correctly after a single hearing." },
                    { id: 32, question: "What condition involves a loss of memory for remote events?", options:["Retrograde amnesia", "Anterograde amnesia", "Expressive aphasia", "Cognitive dysarthria"], correct: 0, rationale: "Retrograde amnesia is categorized as the specific loss of memory for remote, older events." },
                    { id: 33, question: "Which action assesses the strength of the brachioradialis reflex?", options:["Striking the forearm above the radial styloid process", "Tapping the biceps tendon directly at the elbow joint", "Hitting the patellar tendon just below the kneecap", "Striking the Achilles tendon forcefully at the ankle"], correct: 0, rationale: "The brachioradialis reflex is evoked by striking the forearm directly, about 2 to 3 cm above the radial styloid process." },
                    { id: 34, question: "Which finding indicates a positive Romberg test?", options:["Swaying or falling when eyes are fully closed", "Inability to touch the nose with the index finger", "Noticeable tremor when extending the arms forward", "Drooping of the shoulder on one side of the body"], correct: 0, rationale: "A positive Romberg test happens when a standing patient sways or falls as soon as their eyes are closed." },
                    { id: 35, question: "Which term describes the outward expression of emotion during a neurological assessment?", options: ["Affect", "Mood", "Intelligence", "Judgment"], correct: 0, rationale: "Affect represents the physical and outward expression of the patient's internal emotion." },
                    { id: 36, question: "Which cranial nerve is responsible for the corneal reflex alongside the facial nerve?", options: ["Trigeminal nerve", "Oculomotor nerve", "Abducens nerve", "Optic nerve"], correct: 0, rationale: "The trigeminal nerve supplies the sensory component for the corneal reflex." },
                    { id: 37, question: "What does an absence of elevation or constriction of the palatal arch indicate?", options:["Paralysis of the affected side", "Normal strong muscular function", "Extremely hyperactive gag reflex", "Complete sensory loss in the tongue"], correct: 0, rationale: "When there is paralysis, the affected side of the palatal arch fails to constrict or elevate during speech." },
                    { id: 38, question: "Which condition causes the shoulder to droop and the scapula to rotate away from the midline?", options:["Trapezius muscle dysfunction", "Sternocleidomastoid weakness", "Deltoid muscle atrophy", "Biceps tendon rupture"], correct: 0, rationale: "Loss of trapezius muscle function causes shoulder drooping and lateral winging of the scapula." },
                    { id: 39, question: "What is the primary purpose of the finger to nose test?", options:["Evaluate cerebellar speed and precision", "Measure raw muscle strength in the arm", "Assess sensory perception of light touch", "Check the integrity of the optic nerve"], correct: 0, rationale: "The finger-to-nose test observes the speed, precision, and possible oscillation to evaluate cerebellar function." },
                    { id: 40, question: "Which observation indicates normal function during the abdominal reflex test?", options:["Deviation of the umbilicus towards the stimulated area", "Rapid and complete relaxation of the abdominal muscles", "Sudden upward movement of the entire lower rib cage", "Absence of any visible muscle contraction during the test"], correct: 0, rationale: "A normal positive abdominal reflex causes abdominal muscle contraction and umbilical deviation toward the stimulated source." },
                    { id: 41, question: "The Glasgow Coma Scale utilizes a twenty point system to quantify the level of consciousness.", options:["False", "True"], correct: 0, rationale: "The Glasgow Coma Scale is a 15-point scale, not a 20-point system." },
                    { id: 42, question: "A patient in a semi coma state provides no verbal response and only shows reflex responses to painful stimuli.", options: ["True", "False"], correct: 0, rationale: "In a semi-coma, the patient exhibits no verbal response and relies entirely on reflex responses to painful stimuli." },
                    { id: 43, question: "The olfactory and optic nerves exit directly from the cerebrum rather than the brainstem.", options: ["True", "False"], correct: 0, rationale: "Cranial nerves I and II exit from the cerebrum, whereas nerves 3 to 12 exit from the brainstem." },
                    { id: 44, question: "To properly evaluate the patient visual fields the examiner must stand directly behind the patient.", options: ["False", "True"], correct: 0, rationale: "The examiner should stand directly in front of the patient at about 60 cm away to accurately test visual fields." },
                    { id: 45, question: "A score of zero on the Medical Research Council scale indicates that the muscle has full strength.", options: ["False", "True"], correct: 0, rationale: "A score of zero on the MRC scale indicates absolutely no movement." },
                    { id: 46, question: "When testing deep tendon reflexes the examiner should place the target muscle in a state of slight tension.", options: ["True", "False"], correct: 0, rationale: "Proper technique for eliciting deep tendon reflexes involves positioning the limb so the muscle is in slight tension." },
                    { id: 47, question: "The stereognosis test can be performed effectively even if the patient light touch sense is completely absent.", options: ["False", "True"], correct: 0, rationale: "Stereognosis testing requires that both light touch and position sense be intact prior to evaluation." },
                    { id: 48, question: "The tuning fork is a versatile instrument used to test both auditory hearing acuity and physical vibration sense.", options:["True", "False"], correct: 0, rationale: "A tuning fork is used in Rinne and Weber tests for hearing, as well as on bony prominences for assessing vibration sense." },
                    { id: 49, question: "Carpal tunnel syndrome is widely considered a common neurological condition among professional computer typists.", options: ["True", "False"], correct: 0, rationale: "Occupational histories frequently link computer typing to an increased risk of developing carpal tunnel syndrome." },
