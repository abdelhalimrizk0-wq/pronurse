<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Noto Sans', 'Cairo', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .hidden-content { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn:disabled { cursor: default; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="pb-12 bg-gray-50">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm p-8 mb-8 text-center border-t-4 border-blue-600 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fas fa-user-md text-8xl text-blue-600"></i></div>
            
            <h1 class="text-3xl font-bold text-gray-800 mb-2 font-cairo text-center" dir="auto">Total Hip Replacement</h1>
            
            <div class="flex items-center justify-center gap-2 text-green-600 font-semibold bg-green-50 w-fit mx-auto px-4 py-1 rounded-full text-sm">
                <i class="fas fa-check-circle"></i> "تم صنع هذا الامتحان بواسطة عبدالحليم رزق"
            </div>
        </div>
        <div id="quiz-container"></div>
        <div id="result-summary" class="hidden-content bg-white rounded-2xl shadow-lg p-8 text-center mt-8 border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800">Exam Completed</h2>
            <div class="mt-4 text-4xl font-bold text-blue-600 mb-2">
                <span id="score-display">0</span> <span class="text-xl text-gray-400" id="total-display"></span>
            </div>
            <p id="score-message" class="text-gray-500 mb-6"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-3 rounded-xl hover:bg-blue-700 transition shadow-lg hover:shadow-blue-200">
                <i class="fas fa-redo mr-2"></i> Restart Exam
            </button>
        </div>
    </div>

    <script>
        // --- 1. QUESTIONS ARRAY ---
        const rawQuizData = [
            {
                id: 1,
                question: "Which imaging modality must be completely avoided due to the metal implant?",
                options: ["Magnetic resonance imaging", "Computed tomography scan", "Conventional radiography", "Positron emission tomography"],
                correct: 0,
                rationale: "Patients must avoid exposure to MRI studies because of the implanted metal component in the artificial hip."
            },
            {
                id: 2,
                question: "Operating a car is completely restricted and never permitted following a hip replacement.",
                options: ["True", "False"],
                correct: 0,
                rationale: "The text explicitly states to never drive a car, bike, or bicycle after this surgery."
            },
            {
                id: 3,
                question: "What is the correct relative position of the hips and knees when sitting?",
                options: ["Hips higher than knees", "Knees higher than hips", "Hips parallel to knees", "Knees extended fully straight"],
                correct: 0,
                rationale: "When sitting, the patient's hips should be positioned higher than the knees to prevent dislocation."
            },
            {
                id: 4,
                question: "Which condition serves as a primary indication for total hip replacement?",
                options: ["Avascular necrosis", "Active infection", "Systemic osteoporosis", "Mental illness"],
                correct: 0,
                rationale: "Avascular necrosis is an indication for surgery, while active infection, osteoporosis, and mental illness are considered contraindications."
            },
            {
                id: 5,
                question: "Cemented implants are primarily recommended for younger and highly active individuals.",
                options: ["True", "False"],
                correct: 1,
                rationale: "Cemented implants are recommended for elderly individuals over sixty five years with low activity levels."
            },
            {
                id: 6,
                question: "What specific device is used to maintain proper hip alignment while in bed?",
                options: ["Abduction splint", "Compression stocking", "Sequential constrictor", "Overhead trapeze"],
                correct: 0,
                rationale: "An abduction splint or pillows placed between the legs are used to keep the hip in abduction and prevent crossing."
            },
            {
                id: 7,
                question: "Which structure forms the socket of the human hip joint?",
                options: ["Acetabulum", "Femur head", "Synovial membrane", "Articular cartilage"],
                correct: 0,
                rationale: "The socket of the hip joint is formed by the acetabulum, which is part of the large pelvis bone."
            },
            {
                id: 8,
                question: "Which assessment finding most strongly indicates a dislocated prosthesis?",
                options: ["Operated leg shortening", "Decreased wound drainage", "Gradual muscle weakness", "Lower extremity edema"],
                correct: 0,
                rationale: "Shortening of the operated leg, acute groin pain, swelling, and abnormal rotation are key indicators of a dislocated prosthesis."
            },
            {
                id: 9,
                question: "Patients must use a pillow to block their legs from crossing over the midline.",
                options: ["True", "False"],
                correct: 0,
                rationale: "An abduction splint or pillow is required to keep the hip in abduction and prevent the legs from crossing."
            },
            {
                id: 10,
                question: "What is the maximum safe angle for hip flexion during the recovery period?",
                options: ["Ninety degrees", "Forty five degrees", "Sixty degrees", "One hundred degrees"],
                correct: 0,
                rationale: "Hip flexion must be kept at less than ninety degrees to avoid causing the joint prosthesis to become dislocated."
            },
            {
                id: 11,
                question: "What is a critical nursing action during the first postoperative day?",
                options: ["Frequent neurovascular assessment", "Removal of surgical dressing", "Initiation of independent walking", "Discontinuation of pain medication"],
                correct: 0,
                rationale: "Frequent assessment of the neurovascular status of the affected extremity is vital during the initial postoperative period."
            },
            {
                id: 12,
                question: "Which leg should be extended forward when preparing to sit in a chair?",
                options: ["The operated leg", "The unaffected leg", "Both legs together", "Neither leg strictly"],
                correct: 0,
                rationale: "The patient should slide the operated leg forward and lower themselves slowly into the chair using the armrests."
            },
            {
                id: 13,
                question: "The incentive spirometer should be used at least every two hours to prevent respiratory complications.",
                options: ["True", "False"],
                correct: 0,
                rationale: "Patients are instructed to use the incentive spirometer at least every two hours to maintain respiratory function."
            },
            {
                id: 14,
                question: "What is the primary advantage of a cemented artificial hip prosthesis?",
                options: ["Better early fixation", "Bone tissue ingrowth", "Higher stress tolerance", "Enhanced long term stability"],
                correct: 0,
                rationale: "Cemented implants provide better early fixation and faster healing, though they are easier to fracture under overload."
            },
            {
                id: 15,
                question: "Which bodily structure connects the hip joint to the pelvic bone?",
                options: ["Tendons and ligaments", "Articular cartilage tissue", "Synovial fluid membrane", "Skeletal muscle fibers"],
                correct: 0,
                rationale: "The hip joint is attached to the pelvic bone with tendons and ligaments and is covered with muscle for stability."
            },
            {
                id: 16,
                question: "Cementless artificial hips utilize screws and wires to secure the prosthesis to the bone.",
                options: ["True", "False"],
                correct: 0,
                rationale: "Medical nails, screws, and wires are used in cementless implants to allow bone to grow into the surrounding spaces."
            },
            {
                id: 17,
                question: "How frequently should ankle pump exercises be performed while on bed rest?",
                options: ["Hourly during the day", "Every four hours daily", "Once every morning", "Prior to every meal"],
                correct: 0,
                rationale: "With bed rest, ankle pump exercises are actively encouraged hourly or five times every two hours."
            },
            {
                id: 18,
                question: "Which complication is classified as a long term risk of the procedure?",
                options: ["Heterotopic ossification", "Pulmonary embolism", "Wound site infection", "Pressure ulcer formation"],
                correct: 0,
                rationale: "Heterotopic ossification, avascular necrosis, and loosening of the prosthesis are considered long term complications."
            },
            {
                id: 19,
                question: "A dislocated prosthesis can be safely treated at home using manual manipulation techniques.",
                options: ["True", "False"],
                correct: 1,
                rationale: "The surgeon must be notified immediately to reduce and stabilize the hip promptly to avoid circulatory or nerve damage."
            },
            {
                id: 20,
                question: "Which daily activity must a patient strictly avoid after total hip replacement?",
                options: ["Driving a vehicle", "Swimming in pools", "Taking short walks", "Using rocking chairs"],
                correct: 0,
                rationale: "Patients are explicitly instructed to never drive a car, bike, or bicycle after undergoing this procedure."
            },
            {
                id: 21,
                question: "How should a patient navigate ascending stairs after a hip replacement?",
                options: ["The good leg first", "The operated leg first", "Both legs placed together", "The assistive device first"],
                correct: 0,
                rationale: "The guiding principle for stairs is up with the good and down with the bad, meaning the good leg leads when going up."
            },
            {
                id: 22,
                question: "How long should high stress to the new hip joint be strictly avoided?",
                options: ["Three to six months", "One to two months", "Six to twelve months", "Two to four weeks"],
                correct: 0,
                rationale: "Stresses to the newly implanted hip joint should be avoided for the first three to six months to prevent dislocation."
            },
            {
                id: 23,
                question: "A total hip replacement is considered a lifelong permanent procedure.",
                options: ["True", "False"],
                correct: 1,
                rationale: "The implanted hip is not lifelong; it typically functions well and lasts anywhere from fifteen to twenty years."
            },
            {
                id: 24,
                question: "Which postoperative complication is directly associated with physical immobility?",
                options: ["Pulmonary embolism", "Implant loosening", "Heterotopic ossification", "Avascular necrosis"],
                correct: 0,
                rationale: "Immobility complications include pressure ulcers, thromboembolism, pulmonary embolism, atelectasis, and pneumonia."
            },
            {
                id: 25,
                question: "What is the expected functional duration of an implanted artificial hip?",
                options: ["Fifteen to twenty years", "Five to ten years", "Ten to fifteen years", "Twenty to thirty years"],
                correct: 0,
                rationale: "An implanted total hip prosthesis is designed to last and function effectively for fifteen to twenty years."
            },
            {
                id: 26,
                question: "How should a patient advance when walking with a standard walker?",
                options: ["Walker then operated leg", "Walker then good leg", "Operated leg then walker", "Good leg then walker"],
                correct: 0,
                rationale: "The correct sequence is to place the walker one step ahead, step forward with the operated leg first, and then bring the good leg up."
            },
            {
                id: 27,
                question: "Patients can safely regain sexual activities one month after the surgical procedure.",
                options: ["True", "False"],
                correct: 1,
                rationale: "Sexual activities may be safely regained after three months with the patient resting in a dependent position."
            },
            {
                id: 28,
                question: "Which technique is recommended for moving in bed to avoid weight bearing?",
                options: ["Overhead trapeze", "Rolling maneuvers", "Elbow extensions", "Heel drag method"],
                correct: 0,
                rationale: "An overhead trapeze is utilized to help the patient move in bed and lift their pelvis without bearing weight on the affected leg."
            },
            {
                id: 29,
                question: "Which patient characteristic is considered a strict contraindication for hip surgery?",
                options: ["Active infection", "Advanced age", "Degenerative arthritis", "Joint dysplasia"],
                correct: 0,
                rationale: "Active infection, severe osteoporosis, immune compromise, and mental illness are significant contraindications for this surgery."
            },
            {
                id: 30,
                question: "Most patients begin ambulating with assistance within a day after the surgical operation.",
                options: ["True", "False"],
                correct: 0,
                rationale: "Patients with total hip replacements typically begin ambulation with a walker or crutches within a day after surgery."
            },
            {
                id: 31,
                question: "How long before the operation should anticoagulant therapy generally be modified?",
                options: ["Two weeks", "One week", "Three days", "Four weeks"],
                correct: 0,
                rationale: "Medication modification, particularly for anticoagulant therapy, is typically required two weeks before the operation."
            },
            {
                id: 32,
                question: "How should the legs be positioned when a patient is lying on their side?",
                options: ["Operative leg kept above", "Operative leg kept below", "Both legs kept crossed", "Both legs fully flexed"],
                correct: 0,
                rationale: "When resting in a lateral position, the patient must keep the operative leg situated above to prevent dislocation."
            },
            {
                id: 33,
                question: "Patients must avoid bending over at the waist when putting on socks or trousers.",
                options: ["True", "False"],
                correct: 0,
                rationale: "Bending over ninety degrees at the waist is restricted, and a reacher or assistant should be utilized instead."
            },
            {
                id: 34,
                question: "What anatomical component is exclusively replaced during a hemiarthroplasty procedure?",
                options: ["Femoral head", "Pelvic acetabulum", "Synovial membrane", "Articular cartilage"],
                correct: 0,
                rationale: "A hemiarthroplasty, or half replacement, only involves replacing the femoral head of the joint."
            },
            {
                id: 35,
                question: "Where should the good leg be placed when taking a step with crutches?",
                options: ["Beyond the crutches", "Behind the crutches", "Between the crutches", "Parallel to the crutches"],
                correct: 0,
                rationale: "The patient should bring the operated leg up between the crutches and then bring the good leg up beyond the crutches."
            },
            {
                id: 36,
                question: "What is the maximum allowed head of bed elevation following the surgery?",
                options: ["Forty five degrees", "Thirty degrees", "Sixty degrees", "Ninety degrees"],
                correct: 0,
                rationale: "The head of the bed should be elevated no more than forty five degrees to avoid excessive flexion of the hip."
            },
            {
                id: 37,
                question: "What dietary measure is highly encouraged for patients recovering from surgery?",
                options: ["High fiber diet", "Low sodium diet", "High protein diet", "Low carbohydrate diet"],
                correct: 0,
                rationale: "Patients should maintain adequate fluid intake and are highly encouraged to consume a high fiber diet to avoid straining."
            },
            {
                id: 38,
                question: "In which hand should a patient hold their cane during the ambulation process?",
                options: ["Opposite the operated leg", "Alongside the operated leg", "In the dominant hand", "In the non dominant hand"],
                correct: 0,
                rationale: "The cane should strategically be placed in the hand on the side opposite to the operated leg."
            },
            {
                id: 39,
                question: "Which postoperative requirement is specific to cementless implantations?",
                options: ["Strict weight bearing limit", "Immediate full ambulation", "Continuous passive motion", "Extended bed rest duration"],
                correct: 0,
                rationale: "Cementless implantations require strict follow up for weight bearing limits during the first six weeks to allow bone growth."
            },
            {
                id: 40,
                question: "Who must be notified immediately if a prosthesis becomes dislocated?",
                options: ["The surgeon", "The physical therapist", "The charge nurse", "The primary care physician"],
                correct: 0,
                rationale: "The surgeon must be notified immediately because the hip must be reduced and stabilized promptly to avoid nerve damage."
            }
        ];

        // --- 2. SHUFFLE & RENDER LOGIC (DO NOT EDIT) ---
        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
</body>
</html>
