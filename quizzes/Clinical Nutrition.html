<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Noto Sans', 'Cairo', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .hidden-content { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn:disabled { cursor: default; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="pb-12 bg-gray-50">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm p-8 mb-8 text-center border-t-4 border-blue-600 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fas fa-user-md text-8xl text-blue-600"></i></div>
            
            <h1 class="text-3xl font-bold text-gray-800 mb-2 font-cairo text-center" dir="auto">Clinical Nutrition</h1>
            
            <div class="flex items-center justify-center gap-2 text-green-600 font-semibold bg-green-50 w-fit mx-auto px-4 py-1 rounded-full text-sm">
                <i class="fas fa-check-circle"></i> "تم صنع هذا الامتحان بواسطة عبدالحليم رزق"
            </div>
        </div>
        <div id="quiz-container"></div>
        <div id="result-summary" class="hidden-content bg-white rounded-2xl shadow-lg p-8 text-center mt-8 border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800">Exam Completed</h2>
            <div class="mt-4 text-4xl font-bold text-blue-600 mb-2">
                <span id="score-display">0</span> <span class="text-xl text-gray-400" id="total-display"></span>
            </div>
            <p id="score-message" class="text-gray-500 mb-6"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-3 rounded-xl hover:bg-blue-700 transition shadow-lg hover:shadow-blue-200">
                <i class="fas fa-redo mr-2"></i> Restart Exam
            </button>
        </div>
    </div>

    <script>
        // --- 1. QUESTIONS ARRAY ---
        const rawQuizData = [
            {
                id: 1,
                question: "Which scientific field interprets the interaction of dietary substances in relation to human growth and disease?",
                options: ["Nutrition", "Physiology", "Biochemistry", "Microbiology"],
                correct: 0,
                rationale: "Nutrition is the science that interprets the interaction of nutrients and other substances in food in relation to maintenance, growth, reproduction, health, and disease."
            },
            {
                id: 2,
                question: "Which category of nutrients is required in large quantities to provide energy?",
                options: ["Macronutrients", "Micronutrients", "Trace elements", "Essential vitamins"],
                correct: 0,
                rationale: "Macronutrients are the primary components of food that the body requires in relatively large quantities to provide energy."
            },
            {
                id: 3,
                question: "Males typically have higher caloric and protein requirements than females due to larger muscle mass.",
                options: ["True", "False"],
                correct: 0,
                rationale: "Due to differences in body composition, males typically have higher caloric and protein requirements due to larger muscle mass."
            },
            {
                id: 4,
                question: "Which nutrient acts as the preferred and most readily available source of quick energy for the body?",
                options: ["Carbohydrates", "Dietary proteins", "Essential minerals", "Complex vitamins"],
                correct: 0,
                rationale: "Carbohydrates serve as the body's preferred and most readily available source of energy, fueling cellular activities."
            },
            {
                id: 5,
                question: "Which state of nutritional health occurs when nutrient intake is insufficient to meet body needs?",
                options: ["Undernutrition", "Optimal nutrition", "Overnutrition", "Excessive nutrition"],
                correct: 0,
                rationale: "Under-nutrition occurs when nutrient intake is insufficient to meet the body's needs, leading to a depletion of nutrient stores."
            },
            {
                id: 6,
                question: "Vitamins are inorganic elements essential for blood formation and nerve function.",
                options: ["True", "False"],
                correct: 1,
                rationale: "Vitamins are organic compounds, whereas minerals are the inorganic elements essential for blood formation and nerve function."
            },
            {
                id: 7,
                question: "Which specific outcome is a direct consequence of severe undernutrition?",
                options: ["Decreased intestinal motility", "Increased fluid retention", "Accelerated wound healing", "Enhanced immune response"],
                correct: 0,
                rationale: "Consequences of under-nutrition can be severe, leading to issues like weight loss, poor wound healing, and decreased intestinal motility."
            },
            {
                id: 8,
                question: "What specific nutrients play protective roles by reducing inflammation and improving cardiovascular health?",
                options: ["Antioxidants", "Carbohydrates", "Amino acids", "Saturated fats"],
                correct: 0,
                rationale: "Specific nutrients like antioxidants and fiber play protective roles by reducing inflammation and improving cardiovascular health."
            },
            {
                id: 9,
                question: "What condition can result from the excessive use of nutrient supplements?",
                options: ["Nutrient toxicities", "Severe undernutrition", "Decreased metabolism", "Rapid weight loss"],
                correct: 0,
                rationale: "Over-nutrition can also occur from excessive use of nutrient supplements, leading to vitamin or mineral toxicities."
            },
            {
                id: 10,
                question: "Which minerals are vital for bone and teeth formation?",
                options: ["Calcium and phosphorus", "Iron and iodine", "Potassium and sodium", "Zinc and selenium"],
                correct: 0,
                rationale: "Minerals like calcium and phosphorus are vital for bone and teeth formation."
            },
            {
                id: 11,
                question: "Older adults generally require more calories than adolescents due to metabolic changes.",
                options: ["True", "False"],
                correct: 1,
                rationale: "Older adults may require fewer calories but increased amounts of certain micronutrients due to changes in metabolism and absorption."
            },
            {
                id: 12,
                question: "What is the primary role of proteins in the human body?",
                options: ["Building and repairing tissues", "Providing immediate energy", "Regulating body temperature", "Absorbing dietary fats"],
                correct: 0,
                rationale: "Proteins are the primary building blocks of the body, crucial for the growth, repair, and maintenance of all tissues."
            },
            {
                id: 13,
                question: "Which compounds are required in small quantities for immune function and vision?",
                options: ["Essential vitamins", "Inorganic minerals", "Complex carbohydrates", "Saturated fats"],
                correct: 0,
                rationale: "Vitamins are organic compounds vital for immune function, bone health, vision, and antioxidant protection."
            },
            {
                id: 14,
                question: "The body can independently synthesize all the essential nutrients it requires for survival.",
                options: ["True", "False"],
                correct: 1,
                rationale: "Essential nutrients are vital substances that the human body cannot synthesize on its own, or cannot produce in sufficient quantities."
            },
            {
                id: 15,
                question: "What environmental factor can significantly influence metabolic rate and nutrient needs?",
                options: ["Extreme temperatures", "Indoor lighting", "Noise pollution", "Social interactions"],
                correct: 0,
                rationale: "Exposure to extreme temperatures or high altitudes can influence metabolic rate and nutrient needs."
            },
            {
                id: 16,
                question: "Which specific demographic group is particularly vulnerable to undernutrition?",
                options: ["Elderly adults", "Young adult males", "Professional athletes", "Sedentary teenagers"],
                correct: 0,
                rationale: "Vulnerable populations for under-nutrition include pregnant women, infants, children, and elderly adults."
            },
            {
                id: 17,
                question: "A well developed body and clear eyes are physical indicators of optimal nutritional status.",
                options: ["True", "False"],
                correct: 0,
                rationale: "Good nutrition manifests in positive signs like a well-developed body, healthy skin, and clear, bright eyes."
            },
            {
                id: 18,
                question: "Which nutrients facilitate the conversion of macronutrients into usable energy?",
                options: ["B complex vitamins", "Essential fatty acids", "Dietary fibers", "Branched chain amino acids"],
                correct: 0,
                rationale: "Vitamins, especially the B-complex vitamins, are indispensable for energy metabolism, facilitating the conversion of macronutrients into usable energy."
            },
            {
                id: 19,
                question: "How much do nutrient needs increase for pregnant and lactating women compared to normal individuals?",
                options: ["Twenty to thirty percent", "Ten to fifteen percent", "Forty to fifty percent", "Five to ten percent"],
                correct: 0,
                rationale: "Pregnant and lactating women have significantly increased needs for most nutrients, typically twenty to thirty percent more than normal individuals."
            },
            {
                id: 20,
                question: "Proteins can be utilized for energy when carbohydrate and fat stores are insufficient.",
                options: ["True", "False"],
                correct: 0,
                rationale: "Proteins can also be utilized for energy, though this is typically a secondary function occurring when carbohydrate and fat stores are insufficient."
            },
            {
                id: 21,
                question: "What dietary component is essential for the production of thyroid hormone?",
                options: ["Iodine", "Calcium", "Potassium", "Magnesium"],
                correct: 0,
                rationale: "Minerals such as iodine are critical for thyroid hormone production, which regulates metabolic rates."
            },
            {
                id: 22,
                question: "Which of the following is an example of an inorganic element essential for oxygen transport?",
                options: ["Iron", "Calcium", "Potassium", "Magnesium"],
                correct: 0,
                rationale: "Minerals like iron are inorganic elements that are central to oxygen transport in the blood."
            },
            {
                id: 23,
                question: "Carbohydrates serve as the concentrated and highly efficient long term energy storage in the body.",
                options: ["True", "False"],
                correct: 1,
                rationale: "Carbohydrates provide quick energy, while fats serve as a concentrated and efficient long-term energy storage."
            },
            {
                id: 24,
                question: "Which food items are recognized as primary sources of healthy dietary fats?",
                options: ["Avocados and nuts", "Fruits and vegetables", "Lean meats and poultry", "Whole grains and legumes"],
                correct: 0,
                rationale: "Healthy fats are commonly found in avocados, nuts, seeds, and olive oil."
            },
            {
                id: 25,
                question: "What two main conditions constitute the global issue of malnutrition?",
                options: ["Undernutrition and overnutrition", "Dehydration and hyperhydration", "Malabsorption and excretion", "Digestion and assimilation"],
                correct: 0,
                rationale: "Malnutrition globally encompasses both under-nutrition and over-nutrition, contributing to numerous health complications."
            },
            {
                id: 26,
                question: "Which function is a direct physiological responsibility of dietary fats?",
                options: ["Hormone production", "Enzyme synthesis", "Muscle contraction", "Oxygen transport"],
                correct: 0,
                rationale: "Fats are crucial for energy storage, insulation, the absorption of fat-soluble vitamins, and the production of hormones."
            },
            {
                id: 27,
                question: "What characterizes a state of optimal nutrition in human tissues?",
                options: ["Sufficient nutrient reserves", "Rapid metabolic depletion", "Elevated toxic compounds", "Decreased immune cells"],
                correct: 0,
                rationale: "In optimal nutrition, body tissues have sufficient nutrient reserves to support normal metabolic functions during periods of increased demand."
            },
            {
                id: 28,
                question: "What is an important bodily function supported directly by adequate water consumption?",
                options: ["Temperature regulation", "Hormone production", "Bone calcification", "Tissue regeneration"],
                correct: 0,
                rationale: "Water is essential for bodily functions including nutrient transport, temperature regulation, lubrication of joints, and waste elimination."
            },
            {
                id: 29,
                question: "Diets high in processed foods and added sugars decrease the risk of chronic diseases.",
                options: ["True", "False"],
                correct: 1,
                rationale: "Diets low in processed foods and added sugars are associated with a reduced risk of chronic diseases. High intake increases the risk."
            },
            {
                id: 30,
                question: "What biological substances act as direct participants in myriad biochemical reactions?",
                options: ["Cofactors and coenzymes", "Antigens and antibodies", "Hormones and transmitters", "Simple and complex sugars"],
                correct: 0,
                rationale: "Many nutrients act as cofactors, coenzymes, or direct participants in the myriad biochemical reactions that constitute metabolism."
            },
            {
                id: 31,
                question: "What specific requirement increases significantly for individuals recovering from illness or major surgery?",
                options: ["Additional nutrients and calories", "Reduced fluid and mineral intake", "Strict carbohydrate elimination", "Decreased dietary protein intake"],
                correct: 0,
                rationale: "Individuals recovering from illness or surgery often require additional nutrients and calories to support tissue repair and immune function."
            },
            {
                id: 32,
                question: "Which sign reflects adequate hydration and sufficient nutrient intake regarding physical appearance?",
                options: ["Smooth elastic skin", "Pale dry conjunctiva", "Rapid weight loss", "Chronic muscle fatigue"],
                correct: 0,
                rationale: "Healthy skin that is smooth, clear, and elastic reflects adequate hydration and nutrient intake."
            },
            {
                id: 33,
                question: "Micronutrients are required in minute quantities but their deficiencies can lead to chronic diseases.",
                options: ["True", "False"],
                correct: 0,
                rationale: "Despite being required in minute quantities, deficiencies in micronutrients can lead to a wide range of health issues and chronic diseases."
            },
            {
                id: 34,
                question: "Which clinical sign strongly indicates insufficient intake of dietary fluids and nutrients?",
                options: ["Severe dehydration", "Peripheral edema", "Chronic anemia", "Morbid obesity"],
                correct: 0,
                rationale: "Dehydration is listed as a direct consequence and severe symptom of under-nutrition and insufficient fluid intake."
            },
            {
                id: 35,
                question: "What dietary strategy is paramount to ensure sufficient intake of vital micronutrients?",
                options: ["Consuming diverse whole foods", "Restricting total caloric intake", "Elimating dietary carbohydrates", "Increasing saturated fat consumption"],
                correct: 0,
                rationale: "A well-balanced diet rich in diverse whole foods is paramount to ensure sufficient intake of vital micronutrients."
            },
            {
                id: 36,
                question: "What type of compounds are essential amino acids classified as?",
                options: ["Essential nutrients", "Inorganic minerals", "Dietary fibers", "Complex carbohydrates"],
                correct: 0,
                rationale: "The category of essential nutrients includes vitamins, minerals, certain fatty acids, and specific amino acids."
            },
            {
                id: 37,
                question: "Which specific bodily function depends heavily on adequate protein consumption?",
                options: ["Enzyme and hormone production", "Insulation and heat preservation", "Rapid energy expenditure", "Fat soluble vitamin absorption"],
                correct: 0,
                rationale: "Proteins are fundamental for the growth, repair, and maintenance of tissues, as well as for the production of enzymes and hormones."
            },
            {
                id: 38,
                question: "Which health condition is strongly associated with prolonged caloric excess?",
                options: ["Morbid obesity", "Chronic anemia", "Muscle wasting", "Nutrient malabsorption"],
                correct: 0,
                rationale: "Excess caloric intake from over-nutrition contributes to harmful body weight conditions such as morbid obesity."
            },
            {
                id: 39,
                question: "What physiological process involves using dietary nutrients to protect against oxidative stress?",
                options: ["Maintaining optimal health", "Regulating body temperature", "Building structural tissues", "Eliminating metabolic waste"],
                correct: 0,
                rationale: "Maintaining optimal health includes supporting immune function and protecting against oxidative stress through collective nutrient contribution."
            },
            {
                id: 40,
                question: "Maintaining a healthy body weight within an appropriate range for height indicates a balance between energy intake and expenditure.",
                options: ["True", "False"],
                correct: 0,
                rationale: "Ideal weight for height involves maintaining a healthy body weight within an appropriate range, indicating a balance between energy intake and expenditure."
            }
        ];

        // --- 2. SHUFFLE & RENDER LOGIC (DO NOT EDIT) ---
        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
</body>
</html>
