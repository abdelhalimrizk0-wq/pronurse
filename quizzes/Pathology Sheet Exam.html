    <script>
        const rawQuizData = [
            // PART I (MCQ)
            { id: 1, question: "Powerful pain inducing chemical mediators ....................", options: ["Kinins", "Prostaglandins", "Bradykinins", "All of them"], correct: 3, rationale: "Bradykinin and prostaglandins are key chemical mediators derived from plasma and cells that powerfully induce pain during inflammatory processes." },
            { id: 2, question: "Localized area of Suppurative inflammation in the epidermis is termed ........", options: ["Phlegmon", "Abscess", "Pustule", "Furuncle"], correct: 2, rationale: "A pustule is specifically defined as a small abscess located within the epidermis." },
            { id: 3, question: "Digestion of cells/ tissues by their own enzymes is known as .............", options: ["Necrosis", "Autolysis", "Gangrene", "Putrefaction"], correct: 1, rationale: "Postmortem autolysis refers to self-digestion by enzymes that are present within or released into the cytoplasm of cells after death." },
            { id: 4, question: ".............is cooling of the body after death", options: ["Melena", "Algor mortis", "Livor mortis", "Rigor mortis"], correct: 1, rationale: "Algor mortis is the specific postmortem change denoting the cooling of the body following somatic death." },
            { id: 5, question: "................. is characterized by increased number of Goblet cells", options: ["Purulent Inflammation", "Fibrinous Inflammation", "Serous Inflammation", "Catarrhal Inflammation"], correct: 3, rationale: "Catarrhal or mucous inflammation is characterized microscopically by numerous goblet cells and a predominantly mucus exudate." },
            { id: 6, question: ".................is the type of cells predominant in allergic and parasitic diseases", options: ["Lymphocytes", "Macrophages", "Neutrophils", "Eosinophils"], correct: 3, rationale: "Persistent eosinophilia is a primary sign of systemic hypersensitivity commonly caused by parasitic diseases and allergic conditions." },
            { id: 7, question: "Lymphocytes modified to produce antibodies is known as", options: ["T- helper cells", "T-cytotoxic cells", "Plasma cells", "Epithelioid cells"], correct: 2, rationale: "B-cells (a kind of lymphocyte) mature into antibody-producing plasma cells during the immune process." },
            { id: 8, question: "Heart failure cell is hemosiderin laden macrophage present in ................. suffer from CVC", options: ["Liver", "Heart", "Lung", "All of them"], correct: 2, rationale: "Heart failure cells are hemosiderin-laden macrophages found specifically in the alveoli of the lung during chronic passive hyperemia (congestion) due to left-sided heart failure." },
            { id: 9, question: "If the bone is broken to many separated parts is called .", options: ["Greenstick fracture", "Compound fracture", "Comminuted fracture", "Simple fracture"], correct: 2, rationale: "A comminuted fracture involves the bone splintering or breaking into multiple separated fragments." },
            { id: 10, question: "Edema is caused by:", options: ["Decreased plasma osmotic pressure", "Lymphatic obstruction.", "Increased hydrostatic pressure", "all of them"], correct: 3, rationale: "The pathogenesis of edema includes decreased plasma osmotic pressure, increased venous hydrostatic pressure, and lymphatic obstruction among other mechanisms." },
            { id: 11, question: "Localized Suppurative inflammation under the skin is termed ......", options: ["Cellulitis", "Abscess", "Pustule", "Furuncle"], correct: 1, rationale: "Based on the exam's model answer, Abscess is the recognized term for a localized suppurative inflammation under the skin." },
            { id: 12, question: "Without inflammation", options: ["Infections would go unchecked", "Wounds would never heal", "Injured tissues might remain permanent", "All of them"], correct: 3, rationale: "Inflammation is fundamentally beneficial; without it, infections would go unchecked, wounds would never heal, and injured tissues might remain permanently damaged." },
            { id: 13, question: "Recruitment of leukocytes to sites of inflammation is termed.....", options: ["Emigration of leukocytes", "Chemotaxis of leukocytes", "Margination of leukocytes", "Pavementing of leukocytes"], correct: 0, rationale: "According to the exam model answer, Emigration is the primary term used for the actual recruitment and physical exit of leukocytes into the tissues." },
            { id: 14, question: "Inflammation of nasal cavity is termed ......", options: ["Sinusitis", "Rhinitis", "Stomatitis", "mastitis"], correct: 1, rationale: "Rhinitis is the specific medical term for the inflammation of the mucous membranes of the nasal cavity." },
            { id: 15, question: "The significance of hemorrhage depends on:", options: ["The volume of blood loss", "The rate of blood loss and", "The site of hemorrhage.", "All of the them"], correct: 3, rationale: "The clinical impact and significance of any hemorrhage are directly determined by the volume, the rate of loss, and the anatomical site where it occurs." },
            { id: 16, question: "Which of the following is plasma derived chemical mediators of inflammation", options: ["Histamine", "Prostaglandins", "Interleukins", "Kallikreins"], correct: 3, rationale: "The kinin-forming system (which includes Kallikreins) is a cascade of endogenous plasma-derived inflammatory mediators, unlike histamine or prostaglandins which are cell-derived." },
            { id: 17, question: "Fluid exudation in inflammation occur at.......", options: ["Levels of venules", "Levels of arterioles", "Levels of capillaries", "all levels of microcirculation"], correct: 3, rationale: "The vascular phenomena of acute inflammation, including increased permeability and fluid exudation, affect all levels of the microcirculation (arterioles, capillaries, and venules)." },
            { id: 18, question: "Type I hypersensitivity reaction is mediated by ......... ..", options: ["Ig A", "Ig D", "Ig E", "Ig M"], correct: 2, rationale: "Type I (Immediate/Anaphylactic) hypersensitivity involves IgE antibodies binding to mast cells and basophils." },
            { id: 19, question: "Suppurative inflammation open to outside by several openings is termed ......", options: ["Cellulitis", "Phlegmon", "Carbuncle", "Furuncle"], correct: 2, rationale: "A carbuncle is a form of suppurative inflammation characterized by severe localized subcutaneous abscesses that drain to the skin through several openings." },
            { id: 20, question: "Escape of all blood constituents through apparently severed blood vessel is termed ......... .", options: ["hemorrhage by Rhexis", "Petechiae", "Ecchymosis", "hemorrhage by Diapedesis"], correct: 0, rationale: "Hemorrhage by Rhexis refers specifically to bleeding caused by a physical break or rupture in the vessel wall." },
            { id: 21, question: "Putrefied tissue in the living body (during life) is called ......", options: ["Necrosis", "Gangrene", "Infarction", "None of all"], correct: 1, rationale: "Gangrene is defined as putrefied tissue within a living body, resulting from the putrefaction of normal or necrotic tissue." },
            { id: 22, question: "Escape of all blood constituents through apparently intact blood vessel is known as ......... .", options: ["Rhexis", "Petechiae", "Ecchymosis", "Diapedesis"], correct: 3, rationale: "Hemorrhage by Diapedesis is the passage of blood constituents through an intact, but highly permeable, vessel wall." },
            { id: 23, question: "Diffuse generalized edema in which fluid in subcutaneous tissues is termed......", options: ["Ascites", "Anasarca", "Nutmeg Liver", "None of all"], correct: 1, rationale: "Anasarca is the medical terminology for diffuse and generalized subcutaneous (SC) edema." },
            { id: 24, question: "Refers to the study of disease in which tissues and organs are examined with the unaided eye.", options: ["systemic pathology", "general pathology", "microscopic pathology", "gross pathology"], correct: 3, rationale: "Gross pathology (macroscopic pathology) is the evaluation of diseased tissues and organs strictly using the naked (unaided) eye." },
            { id: 25, question: "Abscess is a type of ................ Inflammation", options: ["Catarrhal", "Suppurative", "hemorrhagic", "serous"], correct: 1, rationale: "An abscess is a localized form of suppurative (purulent) inflammation characterized by a localized collection of pus." },
            { id: 26, question: "A clean break, completely separating the fractured bone into two parts, is termed........", options: ["Simple fracture", "Comminuted fracture", "Compound fracture", "Greenstick fracture"], correct: 0, rationale: "A simple fracture involves a clean break separating the bone into two distinct parts without puncturing the surrounding skin." },
            { id: 27, question: "A type of acute immediate hypersensitivity reaction in the skin only mediated by IgE antibodies is termed", options: ["Urticaria", "Anaphylaxis", "Hyperemia", "Anemia"], correct: 0, rationale: "Urticaria is a classic localized Type I hypersensitivity (IgE-mediated) pathological lesion occurring in the skin." },
            { id: 28, question: "Healing of an abscess is by", options: ["first intention", "second intention", "Regeneration", "substitution"], correct: 1, rationale: "Wounds with tissue loss or separated edges, such as an excavated abscess, heal by Second Intention which requires abundant granulation tissue." },
            { id: 29, question: "The term \"...........\" refers to the \"state in which an individual is living in complete harmony with his environment.", options: ["Disease", "Lesions", "Health", "gross pathology"], correct: 2, rationale: "Health is defined relatively as the state where an individual is living in complete harmony with their environment with normally performing body functions." },
            { id: 30, question: "Diffuse Suppurative inflammation under the skin is termed ......", options: ["Cellulitis", "Abscess", "Carbuncle", "Furuncle"], correct: 0, rationale: "Phlegmon (often clinically synonymous with Cellulitis in subcutaneous layers) is the term for a diffuse, non-circumscribed suppurative inflammation." },
            { id: 31, question: "Persistent foramen oval or inter ventricular defect usually cause", options: ["Acute Passive Hyperemia", "Acute Active Hyperemia", "Chronic Active Hyperemia", "Chronic Passive Hyperemia"], correct: 3, rationale: "Congenital heart defects like persistent foramen ovale lead to long-term interference with heart outflow, resulting in Chronic Passive Hyperemia (congestion)." },
            { id: 32, question: "The simplest type of inflammation occurs on serous membranes is", options: ["Purulent Inflammation", "Fibrinous Inflammation", "Serous Inflammation", "Catarrhal Inflammation"], correct: 2, rationale: "Serous inflammation is a mild exudative response characterized by blood plasma exudation, frequently occurring on serous cavities and membranes." },
            { id: 33, question: "The principal constituent of Catarrhal inflammation is ......... .", options: ["Fibrin", "serous fluid", "Mucus", "lymphocytes"], correct: 2, rationale: "Mucus is the predominant constituent in catarrhal inflammation, which is strictly limited to mucous membranes." },
            { id: 34, question: "..................is the type of cells predominant in acute inflammation", options: ["Lymphocytes", "Macrophages", "Neutrophils", "All of them"], correct: 2, rationale: "The acute inflammatory response is characterized primarily by the emigration and predominance of neutrophils." },
            { id: 35, question: "Macrophages are the type of cells predominant in", options: ["Acute inflammation", "Chronic inflammation", "Allergic inflammation", "All of them"], correct: 1, rationale: "Chronic inflammation is a prolonged proliferative reaction characterized by the predominance of macrophages, giant cells, and plasma cells." },
            { id: 36, question: "......................refers to the process of a foreign body moving in the bloodstream and subsequently becoming lodged in a vessel causing ischemic necrosis.", options: ["Embolism", "Liquefaction necrosis", "Infarction", "Thrombosis"], correct: 0, rationale: "Embolism is the precise process where a foreign body (embolus) circulates through the bloodstream until it lodges in a vessel, which can subsequently cause infarction." },
            { id: 37, question: "...........refers to hemorrhage that occurs from lung and comes out with cough.", options: ["Hemoptysis", "Hematemesis", "Hematuria", "Epistaxis"], correct: 0, rationale: "Hemoptysis is the clinical term for hemorrhage originating from the respiratory tract, presenting as expectoration (coughing up blood)." },
            { id: 38, question: "A fracture in which the periosteum remains intact and holds the ends of bone in place is called", options: ["Greenstick fracture", "Compound fracture", "Comminuted fracture", "Simple fracture"], correct: 0, rationale: "A greenstick fracture is an incomplete break where the periosteum largely remains intact, typically bending the bone." },
            { id: 39, question: "If the bone is broken to many parts with opening of covering skin is called .", options: ["Greenstick fracture", "Compound fracture", "Comminuted fracture", "Simple fracture"], correct: 1, rationale: "A compound fracture indicates that the broken bone has pierced through the skin, exposing the internal injury to the external environment." },
            { id: 40, question: "Petechial hemorrhage are of ............... size.", options: ["1 mm", "5 mm", "10 mm", "20 mm"], correct: 0, rationale: "Petechiae are defined as tiny, pin-point morphological hemorrhages measuring approximately 1-2 mm in diameter." },
            { id: 41, question: "Gangrene in lungs is an example of .............. gangrene.", options: ["Dry", "Moist", "Gas", "All of the above"], correct: 1, rationale: "Moist gangrene typically occurs in internal organs (like the lungs) due to their rich blood supply and higher moisture content, which favors bacterial putrefaction." },
            { id: 42, question: "the study of the diseases of the organ, systems of the body is referred to", options: ["systemic pathology", "general pathology", "microscopic pathology", "gross pathology"], correct: 0, rationale: "Systemic pathology specifically refers to the study of diseases associated with the major organ systems of the body." },
            { id: 43, question: "Collection of edematous fluid in the peritoneal cavity is termed.......", options: ["Ascites", "Anasarca", "Nutmeg Liver", "CVC"], correct: 0, rationale: "Ascites is the specific medical term denoting the abnormal accumulation of fluid within the peritoneal cavity." },
            { id: 44, question: "Chronic General passive hyperemia in liver is called", options: ["Brown atrophy", "Brown induration", "Nutmeg", "Brown liver"], correct: 2, rationale: "Nutmeg liver is the classic macroscopic description of hepatic chronic passive hyperemia, caused by central venous congestion." },
            { id: 45, question: "The phenomena of Cellular exudate in inflammation includes.....", options: ["Margination ( homing)", "Pavementing (firm adhesion)", "Emigration", "All"], correct: 3, rationale: "The cellular exudative response in inflammation progresses sequentially through margination, pavementing, chemotaxis, emigration, and phagocytosis." },
            { id: 46, question: "The structural or morphological alterations associated with a disease state in an individual is termed", options: ["Disease", "Lesions", "Health", "gross pathology"], correct: 1, rationale: "Lesions are objectively identifiable structural or morphological deviations and alterations associated with a disease state." },
            { id: 47, question: "Metrorrhagia is hemorrhage from ............... .", options: ["Intestine", "Stomach", "Oviduct", "Uterus"], correct: 3, rationale: "Metrorrhagia is the specific clinical terminology referring to irregular hemorrhage originating from the uterus." },
            { id: 48, question: "Septic thrombus must have ........................ in it.", options: ["Virus", "Parasite", "Fungi", "Bacteria"], correct: 3, rationale: "A septic thrombus implies infection and subsequent suppuration, which is invariably caused by the presence and colonization of pyogenic bacteria." },
            { id: 49, question: "Presence of foreign material in blood vessels is known as", options: ["Thrombus", "Emboli", "Ischemia", "Infarction"], correct: 1, rationale: "An embolus is any circulating foreign body or material (thrombus fragments, fat, air, parasites) traveling inappropriately within blood vessels." },
            { id: 50, question: "Gout is the deposition of.. ............. in tissues.", options: ["Uric acid crystals", "Oxalate crystals", "Hemosiderin", "Urobilin"], correct: 0, rationale: "Gout infiltration is a disturbance characterized directly by the deposition of uric acid crystals within tissues." },
            { id: 51, question: "Healing of stratified epithelium occur by", options: ["Regeneration", "Substitution", "First intention", "Second intention"], correct: 0, rationale: "Epithelium (epidermis, GI mucosa) is composed of labile cells that are continuously dividing, allowing them to heal effectively via complete regeneration." },
            { id: 52, question: "Inflammation aims to", options: ["Destroy the irritant", "Dilute the irritant", "Repair of the damaged tissue.", "All of the above"], correct: 3, rationale: "The fundamental aims of inflammation are to destroy, dilute, or wall-off the injurious agent, and ultimately heal and reconstitute the damaged tissue." },
            { id: 53, question: "Transformation of one type of cells to another cell type is known as ........... .", options: ["Hypoplasia", "Dysplasia", "Anaplasia", "Metaplasia"], correct: 3, rationale: "Metaplasia is defined as the transformation of one type of fully differentiated cell into another differentiated type from the same germinal layer, often due to chronic stress." },
            { id: 54, question: "Reversion of cells towards embryonic type is known as ....... .", options: ["Anaplasia", "Neoplasia", "Metaplasia", "Hypoplasia"], correct: 0, rationale: "Anaplasia refers to the pathological loss of structural differentiation, reverting cells back toward a more primitive, embryonic type." },
            { id: 55, question: "Prolonged starvation leads to .................... of muscles", options: ["Hypertrophy", "Hyperplasia", "Atrophy", "Metaplasia"], correct: 2, rationale: "Starvation atrophy occurs when insufficient nutrients exhaust energy stores, ultimately leading to a marked decrease in the size of muscle cells and other organs." },
            { id: 56, question: "Deficiency of..................... is associated with rickets in young individuals, and osteomalacia in adult", options: ["Vitamin A", "Phosphorus", "Vitamin D", "Calcium"], correct: 2, rationale: "A deficiency of Vitamin D profoundly disrupts calcium absorption and bone mineralization, leading to rickets in the young and osteomalacia in adults." },
            { id: 57, question: "Increase in size of cells leading to increase in size of organ is known as ........... .", options: ["Atrophy", "Hyperplasia", "Hypertrophy", "Metaplasia"], correct: 2, rationale: "Hypertrophy is strictly defined as an increase in the size of an organ or tissue resulting exclusively from the increased size of its specialized cells, not their number." },
            { id: 58, question: "Fibrosis may lead to ................. .", options: ["Atrophy", "Hyperplasia", "Dysplasia", "Hypertrophy"], correct: 0, rationale: "Extensive fibrosis can cause pressure or vascular obstruction (ischemic atrophy), thereby leading to the progressive atrophy of the surrounded parenchymal cells." },
            { id: 59, question: "The principle causes of edema includes", options: ["increase plasma osmotic pressure", "obstruction of lymphatics", "decrease venous hydrostatic pressure", "All of the above"], correct: 1, rationale: "The true pathogenesis of edema involves decreased plasma osmotic pressure, increased hydrostatic pressure, and lymphatic obstruction. Thus, only obstruction of lymphatics is correct here." },
            { id: 60, question: "Infection with biogenic bacteria (Staph. and Strept. spp.) will produce ....", options: ["Catarrhal inflammation", "Serous inflammation", "Fibrinous inflammation", "Purulent inflammation"], correct: 3, rationale: "Pyogenic bacteria such as Staphylococcus and Streptococcus prominently cause suppurative or purulent inflammation characterized by pus production." },
            { id: 61, question: "Thrombus refers to", options: ["Post-mortem clot", "Intravascular intravital clot", "Extravascular clot", "Clotting of extravasated blood"], correct: 1, rationale: "A thrombus is strictly defined as a blood clot formed inappropriately within the blood vessels (intravascular) during life (intravital)." },
            { id: 62, question: "The term Edema refers to an abnormal accumulation of fluid (water) in", options: ["the intercellular tissue spaces", "the body cavities", "Both (a) and (b)", "Non of the above"], correct: 2, rationale: "Edema is pathologically defined as the excessive accumulation of fluid in both the intercellular (interstitial) spaces and the body cavities." },
            { id: 63, question: "Accumulation of fluids in thoracic cavity is termed ...", options: ["Hydrothorax", "Hydropericardium", "Ascites", "Anasarca"], correct: 0, rationale: "Hydrothorax is the specific terminology used to describe the abnormal accumulation of fluid within the thoracic cavity." },
            { id: 64, question: "The inflammation could be caused by", options: ["Biological causes", "thermal injuries", "Mechanical injuries", "any of the above"], correct: 3, rationale: "Inflammation is triggered by a vast array of injurious agents, including biological infections, toxins, and physical insults like thermal or mechanical injuries." },
            { id: 65, question: "The type of inflammatory cells predominant in inflammatory reactions for the first 6 to 24 hours", options: ["Lymphocytes", "Neutrophils", "Macrophages", "Basophils"], correct: 1, rationale: "In the acute phase of an inflammatory response (initial hours to a few days), neutrophils rapidly emigrate and overwhelmingly dominate the cellular exudate." },
            { id: 66, question: "The predominant constituent of exudate in catarrhal inflammation is", options: ["Neutrophils", "Lymphocytes", "Fibrin", "Mucus"], correct: 3, rationale: "Catarrhal inflammation is confined to mucous membranes and its defining characteristic is a thick, slimy exudate where mucus is the predominant constituent." },
            { id: 67, question: "Factors which make an individual more susceptible to a disease (damp weather, poor ventilation, etc.) is called", options: ["Exciting causes", "Predisposing Causes of Diseases", "extrinsic causes", "Non of the above"], correct: 1, rationale: "Predisposing causes are intrinsic or extrinsic environmental factors (like chilling or poor ventilation) that lower resistance, making a host more susceptible to disease." },
            { id: 68, question: "Progressive development of a disease process from the time of its initiation to its final conclusion in recovery or death", options: ["prognosis", "Diagnosis", "Pathogenesis", "Lesions"], correct: 2, rationale: "Pathogenesis meticulously describes the progressive sequence of events and development of a disease process from its initiation to its final outcome." },
            { id: 69, question: "The probable outcome of a disease is termed", options: ["Diagnosis", "apoptosis", "Prognosis", "Non of the above"], correct: 2, rationale: "Prognosis refers to the clinical prediction or probable outcome of a specific disease in a living individual." },
            { id: 70, question: "Systematic dissection of the carcass (dead body) in order to evaluate any abnormal changes (lesions) that may be present is called", options: ["Diagnosis", "Prognosis", "Autopsy", "Euthanasia"], correct: 2, rationale: "An autopsy (or necropsy) is the gross examination and systematic dissection of a carcass to evaluate all present postmortem or pathological lesions." },
            { id: 71, question: "Increased amount of blood in the venous side of the vascular system due to sudden myocardial failure is termed", options: ["acute general passive H", "acute local passive H", "chronic general Passive H", "chronic local Passive H"], correct: 0, rationale: "Sudden myocardial necrosis or failure severely obstructs systemic venous return, causing an immediate, body-wide acute general passive hyperemia (congestion)." },
            { id: 72, question: "A local area of ischemic necrosis, due to obstruction of an end artery is termed", options: ["Necrosis", "Apoptosis", "Infarction", "Gangrene"], correct: 2, rationale: "Infarction is strictly defined as the localized necrosis of tissue directly resulting from severe ischemia, typically caused by vessel occlusion." },
            { id: 73, question: "A type of Burns characterized by blister formation", options: ["First degree burns", "Second degree burns", "Third degree burns", "Fourth degree burns"], correct: 1, rationale: "Thermal injuries classified as second-degree burns specifically involve the epidermis and manifest distinctively via blister formation." },
            { id: 74, question: "Anaphylaxis could be treated by", options: ["Anti-inflammatory", "Antihistaminic", "Antipyretic", "Non of the above"], correct: 1, rationale: "Since anaphylaxis (a Type I hypersensitivity) involves massive release of histamine from mast cells, administering an antihistaminic is a direct and logical treatment." },

            // PART II (TRUE OR FALSE)
            { id: 75, question: "Serum Ferritin is index of iron store", options: ["True", "False"], correct: 0, rationale: "Serum ferritin correlates directly with the body's total iron stores, making it a primary diagnostic index for iron deficiency." },
            { id: 76, question: "Hemolytic anemia is regenerative anemia according to Bone Marrow response", options: ["True", "False"], correct: 0, rationale: "Because hemolytic anemia destroys mature red cells but leaves the bone marrow intact, it exhibits a strong regenerative response marked by very high reticulocyte counts." },
            { id: 77, question: "The term allergy means \"changed reactivity\" of the host when meeting an \"agent\" on a second or subsequent occasion.", options: ["True", "False"], correct: 0, rationale: "Allergy and hypersensitivity intrinsically denote an excessive, changed, or injurious immune reactivity upon re-exposure to a specific antigen." },
            { id: 78, question: "Healing or Repair of tissues composed largely of permanent cells will occur by regeneration", options: ["True", "False"], correct: 1, rationale: "Permanent cells (like neurons and cardiac myocytes) are terminally differentiated and possess zero regenerative capability; they heal exclusively via scarring." },
            { id: 79, question: "The term dystrophic calcification is used when calcium salts are deposited in dead tissues while blood calcium level is within normal range", options: ["True", "False"], correct: 0, rationale: "Dystrophic calcification strictly occurs locally in necrotic or degenerated tissues despite normal blood calcium levels, differentiating it from metastatic calcification." },
            { id: 80, question: "The term \" Pathognomonic Lesions \" is employed to describe \"state in which an individual exhibits an anatomical, physiological, biochemical or behavioral deviation from the normal.\"", options: ["True", "False"], correct: 1, rationale: "This statement describes the definition of 'Disease'. A pathognomonic lesion is a specific change that indicates without doubt the cause of a particular disease." },
            { id: 81, question: "The term \"health\" is the \"state in which an individual is living in complete harmony with his environment", options: ["True", "False"], correct: 0, rationale: "Health is fundamentally defined as a relative state where all body functions are performed normally and the individual is in complete environmental harmony." },
            { id: 82, question: "The term \" disease \" refers to morphopathological changes which indicate without doubt the cause of particular disease", options: ["True", "False"], correct: 1, rationale: "Changes indicating without doubt the cause of a disease describe 'Pathognomonic Lesions', not the general concept of 'Disease'." },
            { id: 83, question: "Coagulative necrosis Is a type of necrosis characterized by Loss of cell details and preservation of tissue architecture", options: ["True", "False"], correct: 0, rationale: "Coagulative necrosis microscopically maintains the basic tissue architecture (as cellular proteins denature rapidly) while internal cellular details are lost." },
            { id: 84, question: "Liquefactive necrosis Is a type of necrosis characterized by Loss of tissue architecture and cell details", options: ["True", "False"], correct: 0, rationale: "In liquefactive necrosis, enzymatic digestion outpaces protein denaturation, resulting in a structureless fluid mass completely losing original tissue architecture." },
            { id: 85, question: "The term pathology refers to the \"scientific study of disease\"", options: ["True", "False"], correct: 0, rationale: "Pathology literally translates to and functions fundamentally as the comprehensive scientific study of disease mechanisms and manifestations." },
            { id: 86, question: "Hematoma refers to a collection of edematous fluid in the pericardial cavity", options: ["True", "False"], correct: 1, rationale: "A hematoma is a localized collection of clotted blood. The accumulation of edematous fluid in the pericardial cavity is properly termed hydropericardium." },
            { id: 87, question: "The term clinical symptoms \" refer to any \"functional evidence of disease that can be determined subjectively or by the patient\"", options: ["True", "False"], correct: 0, rationale: "Clinical symptoms are strictly subjective manifestations (like pain or discomfort) felt and reported by the patient, unlike objective clinical signs." },
            { id: 88, question: "Predisposing Causes of Disease: refer to those factors which are directly responsible for a disease (bacteria, viruses,... etc)", options: ["True", "False"], correct: 1, rationale: "Factors directly responsible for disease are 'Exciting Causes'. Predisposing causes only make the host more susceptible." },
            { id: 89, question: "The term \"Clinical signs\" refer to any \"functional evidence of disease which can be determined objectively or by the observer\"", options: ["True", "False"], correct: 0, rationale: "Clinical signs are exclusively those functional evidences (like lameness or redness) that can be measured or observed objectively." },
            { id: 90, question: "The term \"Mortalities\": refers to the ratio of sick to well individual in a community.", options: ["True", "False"], correct: 1, rationale: "The ratio of sick to well individuals is called 'Morbidity'. Mortality refers exclusively to the number of deaths." },
            { id: 91, question: "The term \"Rigor Mortis\" refers to stiffening of all muscles after death", options: ["True", "False"], correct: 0, rationale: "Rigor mortis is a hallmark postmortem change characterized by the biochemical depletion of ATP, causing muscles to rigidly stiffen." },
            { id: 92, question: "The term \"Hernia\" is the protrusion of an organ through a natural or an artificial body opening", options: ["True", "False"], correct: 0, rationale: "A hernia physically consists of a ring, sac, and contents where an organ displaces and protrudes through a structural body wall opening." },
            { id: 93, question: "Exciting Causes of Diseases: refer to those factors which make an individual more susceptible to a disease", options: ["True", "False"], correct: 1, rationale: "Factors making an individual susceptible are 'Predisposing causes'. Exciting causes are the direct culprits (e.g., bacteria, toxins)." },
            { id: 94, question: "The term \"autolysis\" refers to presence of intracellular visible fat (lipids) in places other than adipose tissue", options: ["True", "False"], correct: 1, rationale: "The abnormal presence of intracellular fat is lipid accumulation. Autolysis specifically refers to postmortem self-digestion by cellular enzymes." },
            { id: 95, question: "Anemia refers to decreased amount of blood supply to in any organ or portion of the body", options: ["True", "False"], correct: 1, rationale: "A local decreased arterial blood supply to a specific tissue or organ is termed 'Ischemia', not anemia." },
            { id: 96, question: "Active hyperemia is an increased amount of blood in the arterial side of the vascular system.", options: ["True", "False"], correct: 0, rationale: "Active hyperemia fundamentally involves vasodilation leading to an intentionally increased flow of oxygenated blood in the arterial side." },
            { id: 97, question: "Ischemia is a quantitative or a qualitative decrease in the amount of blood in the vascular system", options: ["True", "False"], correct: 1, rationale: "This is the definition of Anemia. Ischemia is strictly defined as a local deficiency of arterial blood directed to a specific portion of an organ." },
            { id: 98, question: "Obesity means excessive storage of fat in adipose tissue and connective tissue", options: ["True", "False"], correct: 0, rationale: "Obesity is metabolically recognized as the excessive and systemic storage of fat within adipose and connective tissues." },
            { id: 99, question: "Passive hyperemia is deficiency of arterial blood to a portion of an organ or part", options: ["True", "False"], correct: 1, rationale: "Passive hyperemia (congestion) is the accumulation of blood on the venous side due to obstructed outflow, not a deficiency of arterial supply." },
            { id: 100, question: "Hemorrhage is the escape of all the constituents of blood from any portion of the circulatory system either by rhexis or diapedesis.", options: ["True", "False"], correct: 0, rationale: "Hemorrhage is comprehensively defined as the escape of blood constituents from vessels, occurring mechanically (rhexis) or through permeability (diapedesis)." },
            { id: 101, question: "Shock is a clinical term which refers to peripheral circulatory failure", options: ["True", "False"], correct: 0, rationale: "Shock fundamentally represents a systemic peripheral circulatory failure causing pooling of blood and critically low perfusion (anoxia) to tissues." },
            { id: 102, question: "Polycythemia means decrease in PCV, Hb and / or RBC count.", options: ["True", "False"], correct: 1, rationale: "Polycythemia signifies an increase in red cell mass, PCV, and Hb, whereas a decrease characterizes anemia." },
            { id: 103, question: "Left Shift means presence of reticulocytes in peripheral blood circulation.", options: ["True", "False"], correct: 1, rationale: "A 'Left Shift' in hematology refers specifically to the increased presence of immature neutrophils (band cells) indicating inflammation, not reticulocytes." },
            { id: 104, question: "Dry Ice is a one of chemical preservatives of samples.", options: ["True", "False"], correct: 1, rationale: "Dry ice provides a physical method of preservation through extreme freezing, not a chemical preservation method." },
            { id: 105, question: "MCHC is index of RBCs Volume.", options: ["True", "False"], correct: 1, rationale: "MCV measures RBC volume, whereas MCHC measures the mean corpuscular hemoglobin concentration." },
            { id: 106, question: "Wet needle and syringe can be used for collection of blood sample.", options: ["True", "False"], correct: 1, rationale: "Using a wet needle or syringe leads to in vitro hemolysis and renders the blood sample unsuitable for accurate diagnostic analysis." },
            { id: 107, question: "Collection of blood from patient in calm condition is desirable.", options: ["True", "False"], correct: 0, rationale: "A calm, resting state prevents stress-induced leukogram alterations and avoids physiological shifts that skew analytical results." },
            { id: 108, question: "Lipemic blood sample suitable for complete blood count.", options: ["True", "False"], correct: 1, rationale: "Lipemia severely interferes with spectrophotometric measurements (like hemoglobin concentration) and invalidates standard CBC analyses." },
            { id: 109, question: "Bone marrow is main factory for synthesis of all types of blood cells", options: ["True", "False"], correct: 0, rationale: "In adults, the bone marrow is the primary hematopoietic organ responsible for synthesizing myeloid, erythroid, and megakaryocyte lineages." },
            { id: 110, question: "Pink colored stopper of anticoagulated tube indicate presence of citrates anticoagulant.", options: ["True", "False"], correct: 1, rationale: "Citrate is represented by a blue-stoppered tube. Pink is not standard for citrate." },
            { id: 111, question: "Serum samples harvested from blood collected on without anticoagulant.", options: ["True", "False"], correct: 0, rationale: "Serum is precisely the liquid extracted after blood is allowed to fully clot naturally, necessitating the absence of anticoagulants." },
            { id: 112, question: "Hemolysis means leukocytic destruction", options: ["True", "False"], correct: 1, rationale: "Hemolysis pathologically signifies the rupture of the red cell (erythrocyte) membrane, not leukocyte destruction." },
            { id: 113, question: "IgG and IgM share in occurrence of AIHA", options: ["True", "False"], correct: 0, rationale: "Autoimmune Hemolytic Anemia (AIHA) is a classic Type II cytotoxic hypersensitivity driven directly by IgG or IgM antibodies binding to target cells." },
            { id: 114, question: "Heparin is a natural anticoagulant used for ESR estimation", options: ["True", "False"], correct: 1, rationale: "Sodium citrate (black top) is the required anticoagulant for standard Erythrocyte Sedimentation Rate (ESR) estimation, not heparin." },
            { id: 115, question: "Hematoma is a one of complications of blood sample collection", options: ["True", "False"], correct: 0, rationale: "Improper venipuncture technique can easily lead to blood leaking into the surrounding tissue, forming a painful hematoma." },
            { id: 116, question: "Reticulocytes are immature WBCs.", options: ["True", "False"], correct: 1, rationale: "Reticulocytes are polychromatophilic, immature red blood cells (erythrocytes) released during a regenerative marrow response." },
            { id: 117, question: "Monocytes are blood cells share in formation of blood clot", options: ["True", "False"], correct: 1, rationale: "Thrombocytes (platelets) are the specific blood elements required for primary hemostasis and blood clot formation, not monocytes." },
            { id: 118, question: "Vitamin B12 Deficiency results in normocytic anemia", options: ["True", "False"], correct: 1, rationale: "Vitamin B12 or folate deficiency distinctly causes megaloblastic (macrocytic) anemia, characterized by abnormally large RBCs." },
            { id: 119, question: "Fibrinogen level in plasma is important for blood clot", options: ["True", "False"], correct: 0, rationale: "Fibrinogen is a critical soluble plasma protein that is converted to a solid fibrin meshwork during coagulation." },

            // PART III (MATCHING CONVERTED TO MCQ)
            { id: 120, question: "Match the correct description for: Heparin", options: ["Collecting heparinated blood / Plasma testing", "is microcytic anemia", "means increase blood platelet count", "means abnormal hemoglobin"], correct: 0, rationale: "Heparin (found in green-top tubes) is used practically for collecting heparinated whole blood or plasma." },
            { id: 121, question: "Match the correct description for: Thrombocytopathy", options: ["means platelet malfunction", "means RBCs formation", "is associated with allergy condition", "enhanced by deficiency of the RBCs enzyme (G6PD)"], correct: 0, rationale: "Thrombocytopathy implies a normal platelet count but clinically evident bleeding due to dysfunctional (malfunctioning) platelets." },
            { id: 122, question: "Match the correct description for: Erythropoiesis", options: ["means RBCs formation", "is suitable for glucose measuring in blood", "is associated with acute inflammation", "characterized by pancytopenia"], correct: 0, rationale: "Erythropoiesis is the specific physiological process of red blood cell (RBC) formation and maturation." },
            { id: 123, question: "Match the correct description for: Sodium fluoride", options: ["is suitable for glucose measuring in blood", "means abnormal hemoglobin", "characterized by increase serum ferritin", "is caused by intrinsic factor deficiency"], correct: 0, rationale: "Sodium fluoride (gray top) acts as a glycolysis inhibitor, making it uniquely suitable for accurate blood sugar measuring." },
            { id: 124, question: "Match the correct description for: Eosinophilia", options: ["means increase blood eosinophil count", "is suitable for blood transfusion", "means platelet malfunction", "fragmented RBCs observed in microangiopathic hemolytic Anemia"], correct: 0, rationale: "Eosinophilia strictly translates to an abnormal increase in the peripheral blood eosinophil count." },
            { id: 125, question: "Match the correct description for: Thalassemia", options: ["means abnormal hemoglobin", "is microcytic anemia", "means RBCs formation", "is suitable for glucose measuring in blood"], correct: 0, rationale: "Thalassemia falls under hemoglobinopathies, which represent an inherited group of diseases marked by abnormal hemoglobin structure or synthesis." },
            { id: 126, question: "Match the correct description for: Basophilia", options: ["is associated with allergy condition", "means increase blood platelet count", "enhanced by deficiency of the RBCs enzyme (G6PD)", "is associated with acute inflammation"], correct: 0, rationale: "Systemic hypersensitivity and allergic conditions characteristically present with persistent eosinophilia and/or basophilia." },
            { id: 127, question: "Match the correct description for: Neutrophilia", options: ["is associated with acute inflammation", "characterized by pancytopenia", "means abnormal hemoglobin", "characterized by increase serum ferritin"], correct: 0, rationale: "Neutrophilia reflects bone marrow mobilization and is a classic hallmark sign of an acute inflammatory response." },
            { id: 128, question: "Match the correct description for: Thrombocytosis", options: ["means increase blood platelet count", "means increase blood eosinophil count", "is suitable for blood transfusion", "is caused by intrinsic factor deficiency"], correct: 0, rationale: "Thrombocytosis clinically denotes an abnormal increase in the absolute number of circulating platelets." },
            { id: 129, question: "Match the correct description for: IDA anemia", options: ["is microcytic anemia", "means platelet malfunction", "fragmented RBCs observed in microangiopathic hemolytic Anemia", "is associated with allergy condition"], correct: 0, rationale: "Iron Deficiency Anemia (IDA) typically presents microscopically as a microcytic and hypochromic anemia." },
            { id: 130, question: "Match the correct description for: Pernicious anemia", options: ["is caused by intrinsic factor deficiency", "enhanced by deficiency of the RBCs enzyme (G6PD)", "is suitable for glucose measuring in blood", "is associated with acute inflammation"], correct: 0, rationale: "Pernicious anemia is a specific form of megaloblastic anemia caused fundamentally by an intrinsic factor deficiency leading to poor B12 absorption." },
            { id: 131, question: "Match the correct description for: Schistocytes", options: ["fragmented RBCs observed in microangiopathic hemolytic Anemia", "characterized by pancytopenia", "means abnormal hemoglobin", "characterized by increase serum ferritin"], correct: 0, rationale: "Schistocytes are severely fragmented RBCs often generated mechanically, notably observed in Disseminated Intravascular Coagulation (DIC)." },
            { id: 132, question: "Match the correct description for: Anemia of inflammation", options: ["characterized by increase serum ferritin", "is microcytic anemia", "means increase blood platelet count", "means increase blood eosinophil count"], correct: 0, rationale: "Anemia of Chronic Disease/Inflammation traps iron centrally, leading to an inherently increased or preserved serum ferritin." },
            { id: 133, question: "Match the correct description for: Favism", options: ["enhanced by deficiency of the RBCs enzyme (G6PD)", "means RBCs formation", "is associated with allergy condition", "is suitable for blood transfusion"], correct: 0, rationale: "Favism causes acute hemolysis distinctly linked to a genetic deficiency in the RBC enzyme glucose-6-phosphate dehydrogenase (G6PD)." },
            { id: 134, question: "Match the correct description for: Aplastic anemia", options: ["characterized by pancytopenia", "is caused by intrinsic factor deficiency", "means platelet malfunction", "fragmented RBCs observed in microangiopathic hemolytic Anemia"], correct: 0, rationale: "Aplastic anemia results from severe hypoproliferative bone marrow damage, inherently manifesting as pancytopenia across all blood cell lines." }
        ];

        // --- 2. SHUFFLE & RENDER LOGIC ---
        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
