        const TITLES = {
            'general_clinical': 'General & Clinical Pathology',
            'clinical': 'Clinical Pathology Quiz',

        };

        // --- APP STATE ---
        let currentQuizData = [];
        let score = 0;
        let answeredCount = 0;
        let currentQuizId = '';

        // --- VIEW CONTROLLERS ---
        function showHome() {
            document.getElementById('home-screen').classList.remove('hidden-content');
            document.getElementById('quiz-screen').classList.add('hidden-content');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function startQuiz(quizId) {
            currentQuizId = quizId;
            document.getElementById('home-screen').classList.add('hidden-content');
            document.getElementById('quiz-screen').classList.remove('hidden-content');
            
            // Set Title
            document.getElementById('quiz-title').innerText = TITLES[quizId];
            
            // Prepare Data
            const rawData = ALL_QUIZZES[quizId];
            
            // Shuffle Questions and Options
            currentQuizData = rawData.map(q => {
                const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
                // Fisher-Yates shuffle for options
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                return { 
                    ...q, 
                    options: opts.map(o => o.text), 
                    correct: opts.findIndex(o => o.isCorrect) 
                };
            });
            // Shuffle questions themselves
            for (let i = currentQuizData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentQuizData[i], currentQuizData[j]] = [currentQuizData[j], currentQuizData[i]];
            }

            // Reset Counters
            score = 0;
            answeredCount = 0;
            document.getElementById('result-summary').classList.add('hidden-content');
            
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function restartCurrentQuiz() {
            startQuiz(currentQuizId);
        }

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${currentQuizData.length}`;
            const container = document.getElementById('quiz-container');
            
            container.innerHTML = currentQuizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                        ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = currentQuizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            
            // Prevent multiple clicks
            if (!feedback.classList.contains('hidden-content')) return;
            
            feedback.classList.remove('hidden-content');
            
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { 
                    btn.classList.add('correct-answer'); 
                    btn.innerHTML += '<i class="fas fa-check float-right"></i>'; 
                }
                else if (i === optIndex) { 
                    btn.classList.add('wrong-answer'); 
                    btn.innerHTML += '<i class="fas fa-times float-right"></i>'; 
                }
                else { 
                    btn.classList.add('opacity-50'); 
                }
            });

            if (optIndex === q.correct) score++;
            answeredCount++;

            if (answeredCount === currentQuizData.length) {
                const summary = document.getElementById('result-summary');
                summary.classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                
                const percentage = (score / currentQuizData.length) * 100;
                let message = "";
                if (percentage >= 90) message = "Outstanding! You are a master.";
                else if (percentage >= 75) message = "Great job! Keep it up.";
                else if (percentage >= 50) message = "Good effort, but review the weak points.";
                else message = "Keep studying and try again!";
                
                document.getElementById('score-message').innerText = message;
                
                setTimeout(() => {
                    summary.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 500);
            }
        };
