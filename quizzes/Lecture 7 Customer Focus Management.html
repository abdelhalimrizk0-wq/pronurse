<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Noto Sans', 'Cairo', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .hidden-content { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn:disabled { cursor: default; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="pb-12 bg-gray-50">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm p-8 mb-8 text-center border-t-4 border-blue-600 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fas fa-user-md text-8xl text-blue-600"></i></div>
            
            <h1 class="text-3xl font-bold text-gray-800 mb-2 font-cairo text-center" dir="auto">Lecture 7: Customer Focus Management</h1>
            
            <div class="flex items-center justify-center gap-2 text-green-600 font-semibold bg-green-50 w-fit mx-auto px-4 py-1 rounded-full text-sm">
                <i class="fas fa-check-circle"></i> "تم صنع هذا الامتحان بواسطة عبدالحليم رزق"
            </div>
        </div>
        <div id="quiz-container"></div>
        <div id="result-summary" class="hidden-content bg-white rounded-2xl shadow-lg p-8 text-center mt-8 border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800">Exam Completed</h2>
            <div class="mt-4 text-4xl font-bold text-blue-600 mb-2">
                <span id="score-display">0</span> <span class="text-xl text-gray-400" id="total-display"></span>
            </div>
            <p id="score-message" class="text-gray-500 mb-6"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-3 rounded-xl hover:bg-blue-700 transition shadow-lg hover:shadow-blue-200">
                <i class="fas fa-redo mr-2"></i> Restart Exam
            </button>
        </div>
    </div>

    <script>
        // --- 1. QUESTIONS ARRAY ---
        const rawQuizData = [
            { 
                id: 1, 
                question: "Customer Relationship Management software in healthcare is strictly designed for managing internal employee payroll systems.", 
                options: ["True", "False"], 
                correct: 1, 
                rationale: "Healthcare CRM is software designed to unify medical teams, track valuable patient information, and save time, not for employee payroll." 
            },
            { 
                id: 2, 
                question: "Which stage of the customer life cycle involves converting prospective individuals into actual revenue generating users?", 
                options: ["Conversion", "Reach", "Retention", "Acquisition"], 
                correct: 0, 
                rationale: "Conversion is the stage where prospective customers turn into actual paying customers, expecting revenue from them." 
            },
            { 
                id: 3, 
                question: "What is a potential direct consequence of utilizing inaccurate or incomplete patient data within a healthcare facility?", 
                options: ["Life threatening mistakes", "Immediate staff promotions", "Decreased facility maintenance", "Increased marketing efficiency"], 
                correct: 0, 
                rationale: "Errors and incomplete records can severely impact the quality of care, potentially leading to life-threatening mistakes and malpractice lawsuits." 
            },
            { 
                id: 4, 
                question: "Who is officially considered an internal customer within a typical healthcare organization?", 
                options: ["Hospital department employees", "Admitted facility patients", "Visiting patient relatives", "External medical suppliers"], 
                correct: 0, 
                rationale: "Internal customers include the employees and departments within the organization." 
            },
            { 
                id: 5, 
                question: "Which specific challenge arises when different organizational software systems fail to connect and share data effectively?", 
                options: ["Lack of technology integration", "Service outage crisis", "Understanding customer expectations", "Choosing the right channels"], 
                correct: 0, 
                rationale: "Lack of Technology Integration occurs when systems are not connected with each other and data flow between them is absent." 
            },
            { 
                id: 6, 
                question: "Which characteristic of a high-performing hospital focuses specifically on managing people amid health care reform challenges?", 
                options: ["Talent management", "Consistent leadership", "Transparency integration", "Defined strategic vision"], 
                correct: 0, 
                rationale: "Talent management involves focusing on the development of talent and managing people in the challenges of health care reform." 
            },
            { 
                id: 7, 
                question: "Providing excellent customer service usually indicates that the healthcare organization suffers from poorly refined internal administrative systems.", 
                options: ["True", "False"], 
                correct: 1, 
                rationale: "Poor customer service is an indicator of bigger problems. A company that provides excellent customer service is likely to have robust and refined processes." 
            },
            { 
                id: 8, 
                question: "Which action represents a recommended strategy for improving healthcare customer service after the patient physically leaves the facility?", 
                options: ["Making follow up phone calls", "Deleting electronic medical records", "Ignoring negative online feedback", "Canceling future medical appointments"], 
                correct: 0, 
                rationale: "Reaching Out to Patients Through Follow Up Calls, text messages, or system interaction can help improve the customer service experience." 
            },
            { 
                id: 9, 
                question: "At which stage of the customer life cycle do completely satisfied individuals transform into active brand promoters?", 
                options: ["Advocacy", "Conversion", "Retention", "Acquisition"], 
                correct: 0, 
                rationale: "Advocacy is the stage where truly satisfied customers become brand advocates." 
            },
            { 
                id: 10, 
                question: "What is the very first essential step in the formal organizational process of implementing a Customer Relationship Management system?", 
                options: ["Understanding customers needs and expectations", "Monitoring customer satisfaction levels", "Communicating needs to all employees", "Terminating underperforming medical staff"], 
                correct: 0, 
                rationale: "The first step in implementing a CRM system is understanding customers' needs and expectations across all aspects of a business." 
            },
            { 
                id: 11, 
                question: "When dealing with an angry patient, employees should always take the frustration personally and defend the healthcare company aggressively.", 
                options: ["True", "False"], 
                correct: 1, 
                rationale: "When handling angry customers, you should empathize, not lose your cool, and remember they are frustrated with the company/products, so do not take it personally." 
            },
            { 
                id: 12, 
                question: "What specific operational action must a nurse manager perform to successfully maintain a strong organizational customer focus?", 
                options: ["Measure customer satisfaction continuously", "Eliminate all internal employee feedback", "Restrict communication with community partners", "Ignore the concept of cultural empowerment"], 
                correct: 0, 
                rationale: "The role of a nurse manager includes measuring and monitoring customer satisfaction continuously to identify trends and problems." 
            },
            { 
                id: 13, 
                question: "The institute for healthcare improvement triple aim includes improving patient experience, improving population health, and achieving what other goal?", 
                options: ["Reducing the cost of healthcare", "Increasing general hospital admissions", "Expanding physical hospital infrastructure", "Hiring additional administrative executives"], 
                correct: 0, 
                rationale: "The triple aims are improving the patient experience of care, improving the health of populations, and reducing the cost of healthcare." 
            },
            { 
                id: 14, 
                question: "How is the technique of customer focus management primarily measured within a modern healthcare organization?", 
                options: ["Based on the patient pathway", "Based on total medical supplies", "Based on annual marketing budget", "Based on physician vacation hours"], 
                correct: 0, 
                rationale: "Customer focus management measurement techniques should be based on the 'patient pathway'." 
            },
            { 
                id: 15, 
                question: "Which outcome is a direct recognized benefit of implementing Customer Relationship Management software in a healthcare setting?", 
                options: ["Reduced errors in medical bills", "Increased manual paperwork requirements", "Decreased digital legal compliance", "Eliminated need for patient education"], 
                correct: 0, 
                rationale: "Benefits of CRM in healthcare include saving time and resources, ensuring digital compliance, and reducing errors in medical bills." 
            },
            { 
                id: 16, 
                question: "What frequently causes insecurities and mental barriers among organizational staff during a new software implementation process?", 
                options: ["Lack of communication from top management", "Excessive hiring of service professionals", "Overabundance of customized patient communication", "Strict adherence to defined strategic visions"], 
                correct: 0, 
                rationale: "Lack of communication regarding CRM implementation decisions from top management can give rise to insecurities and mental barriers in the staff." 
            },
            { 
                id: 17, 
                question: "The primary key to providing great customer service in healthcare is treating patients merely as entities that generate maximum revenue.", 
                options: ["True", "False"], 
                correct: 1, 
                rationale: "The first key to great customer service is to stop treating patients as customers whose sole purpose is to generate revenue, and instead view them as people." 
            },
            { 
                id: 18, 
                question: "Which stage of the customer life cycle primarily requires performing active marketing activities to promote a specific service?", 
                options: ["Reach", "Acquisition", "Conversion", "Retention"], 
                correct: 0, 
                rationale: "Reach is the initial stage that primarily requires performing marketing activities to promote your brand or services." 
            },
            { 
                id: 19, 
                question: "Which organizational characteristic involves driving quality performance specifically through improved internal communication and data sharing?", 
                options: ["Transparency", "Clinical integration", "Patient engagement", "Talent management"], 
                correct: 0, 
                rationale: "Transparency drives organizational awareness and quality performance through improved communication and data sharing." 
            },
            { 
                id: 20, 
                question: "Adopting a clinical integration strategy allows a hospital and its physicians to jointly participate in what specific financial model?", 
                options: ["Value based contracting models", "Individual fee processing models", "Outdated traditional payment models", "Experimental insurance coverage models"], 
                correct: 0, 
                rationale: "Clinical integration allows both the hospital and its physicians to achieve goals by jointly participating in value-based contracting models." 
            },
            { 
                id: 21, 
                question: "Customer requirements are formally defined as the expectations and key drivers that determine final satisfaction with a specific service.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "Customer requirements are referred to as wants, key drivers, and expectations that determine whether the customer leaves satisfied." 
            },
            { 
                id: 22, 
                question: "What must an organization calculate first when a customer demands a service that initially appears impossible to provide?", 
                options: ["The cost of resources and time", "The total number of registered nurses", "The emotional state of the patient", "The physical size of the facility"], 
                correct: 0, 
                rationale: "If a demand can be met, you first need to know the cost of it in terms of resources, time, and money." 
            },
            { 
                id: 23, 
                question: "Why is communicating customer needs throughout the organization considered a critical step in system implementation?", 
                options: ["Ensures all employees comprehend expectations", "Allows managers to ignore negative feedback", "Reduces the need for marketing campaigns", "Replaces the need for a strategic vision"], 
                correct: 0, 
                rationale: "Communicating needs throughout the organization ensures that all employees fully comprehend these expectations and requirements." 
            },
            { 
                id: 24, 
                question: "Hiring the right healthcare employees means exclusively selecting individuals whose only capability is answering phones and greeting patients.", 
                options: ["True", "False"], 
                correct: 1, 
                rationale: "Hiring the right employees means they do much more than just answer phones and greet patients; they represent the company's face in front of customers." 
            },
            { 
                id: 25, 
                question: "What term describes a series of activities specifically designed to enhance the feeling that a medical product met patient expectations?", 
                options: ["Customer service", "Clinical diagnosis", "Organizational governance", "Structural auditing"], 
                correct: 0, 
                rationale: "Customer service is defined as a series of activities designed to enhance the level of customer satisfaction." 
            },
            { 
                id: 26, 
                question: "Which high-performing hospital characteristic involves rapidly adapting to shifts in demographic statistics and technological advancements?", 
                options: ["Change management and adaptability", "Consistent organizational leadership", "Transparent data sharing practices", "Value based physician alignment"], 
                correct: 0, 
                rationale: "Change management and adaptability involves the ability to rapidly adapt to changes in the marketplace, including demographics and technological advancements." 
            },
            { 
                id: 27, 
                question: "The acquisition stage of the customer life cycle involves receiving prospect information to initiate relationship building.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "Acquisition is the stage where you start receiving a prospect's information to initiate relationship building." 
            },
            { 
                id: 28, 
                question: "Which administrative action is identified as a fundamental expectation of a nurse manager regarding organizational customer focus?", 
                options: ["Promote cultural empowerment and leadership", "Discourage patient feedback mechanisms", "Eliminate electronic medical records", "Ignore external customer requirements"], 
                correct: 0, 
                rationale: "The role of the nurse manager includes promoting a cultural empowerment, leadership, and customer care." 
            },
            { 
                id: 29, 
                question: "Which specific operational challenge involves facing the wrath of customers because a required technological tool is unexpectedly down?", 
                options: ["Service outage crisis", "Lack of technology integration", "Exceeding customer expectations", "Choosing the right channels"], 
                correct: 0, 
                rationale: "Dealing with a Service Outage Crisis involves facing a crisis and the wrath of customers when your service is down." 
            },
            { 
                id: 30, 
                question: "External customers in a healthcare setting are limited exclusively to other governmental agencies and independent regulatory business organizations.", 
                options: ["True", "False"], 
                correct: 1, 
                rationale: "External customers in a healthcare setting include patients, relatives, and visitors." 
            }
        ];

        // --- 2. SHUFFLE & RENDER LOGIC (DO NOT EDIT) ---
        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
</body>
</html>
