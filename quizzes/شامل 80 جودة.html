<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Noto Sans', 'Cairo', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .hidden-content { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn:disabled { cursor: default; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="pb-12 bg-gray-50">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm p-8 mb-8 text-center border-t-4 border-blue-600 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fas fa-user-md text-8xl text-blue-600"></i></div>
            
            <h1 class="text-3xl font-bold text-gray-800 mb-2 font-cairo text-center" dir="auto">Concepts of Quality & Patient Safety</h1>
            
            <div class="flex items-center justify-center gap-2 text-green-600 font-semibold bg-green-50 w-fit mx-auto px-4 py-1 rounded-full text-sm">
                <i class="fas fa-check-circle"></i> "تم صنع هذا الامتحان بواسطة عبدالحليم رزق"
            </div>
        </div>
        <div id="quiz-container"></div>
        <div id="result-summary" class="hidden-content bg-white rounded-2xl shadow-lg p-8 text-center mt-8 border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800">Exam Completed</h2>
            <div class="mt-4 text-4xl font-bold text-blue-600 mb-2">
                <span id="score-display">0</span> <span class="text-xl text-gray-400" id="total-display"></span>
            </div>
            <p id="score-message" class="text-gray-500 mb-6"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-3 rounded-xl hover:bg-blue-700 transition shadow-lg hover:shadow-blue-200">
                <i class="fas fa-redo mr-2"></i> Restart Exam
            </button>
        </div>
    </div>

    <script>
        const rawQuizData = [
            { id: 1, question: "Which principle of Total Quality Management requires understanding a framework for managing interrelated processes to achieve the best results?", options: ["System approach to management", "Customer focused approach", "Factual approach to decision making", "Continual process improvement"], correct: 0, rationale: "The system approach to management involves understanding a system for managing interrelated processes to integrate them effectively." },
            { id: 2, question: "How should standards of nursing care be viewed as nursing theory and knowledge evolve?", options: ["As a temporary working model", "As a permanent legal contract", "As an unchangeable historical document", "As a rigid organizational mandate"], correct: 0, rationale: "A standard should be considered temporary and a working model because as nursing theory evolves, standards should be updated." },
            { id: 3, question: "Which type of quality team focuses primarily on overseeing the overall quality strategy of the organization?", options: ["Quality Management", "Quality Assurance", "Quality Control", "Continuous Improvement"], correct: 0, rationale: "Quality Management is responsible for overseeing the quality strategy, whereas QA prevents defects and QC identifies them." },
            { id: 4, question: "Which practice specifically refers to eliminating the presence of all microorganisms during healthcare delivery?", options: ["Surgical asepsis", "Medical asepsis", "Clean technique", "Contact precautions"], correct: 0, rationale: "Surgical asepsis refers to the practice that eliminates the presence of all microorganisms, also known as sterilization." },
            { id: 5, question: "Where did the concept of quality initially start during the nineteenth century before spreading to healthcare?", options: ["Car companies in Japan", "Textile mills in England", "Automobile plants in the United States", "Craft guilds in Rome"], correct: 0, rationale: "The quality concept started in Japan in the 19th century in car companies." },
            { id: 6, question: "Which type of nursing audit evaluates the resources and environment such as staffing and equipment?", options: ["Structure Audit", "Process Audit", "Outcome Audit", "Concurrent Audit"], correct: 0, rationale: "Structure audit focuses on the resources and environment like staffing and equipment." },
            { id: 7, question: "Which stage of the customer life cycle initiates relationship building by collecting prospect information like email addresses?", options: ["Acquisition", "Reach", "Conversion", "Retention"], correct: 0, rationale: "Acquisition is the stage where you start receiving prospect information and initiate relationship building." },
            { id: 8, question: "Which characteristic reflects a negative unit level safety culture regarding non punitive response to error?", options: ["Staff worry that mistakes are kept in their personnel files", "Staff frequently request additional training on error prevention", "Staff openly discuss ways to prevent errors from recurring", "Staff report a high satisfaction rate with management decisions"], correct: 0, rationale: "In a negative non-punitive response to error, staff feel their mistakes are held against them and worry that mistakes are kept in their file." },
            { id: 9, question: "Which quality improvement tool is based on the rule that eighty percent of problems are created by twenty percent of causes?", options: ["Pareto diagram", "Cause and effect diagram", "Scatter plots", "Flow chart"], correct: 0, rationale: "The Pareto diagram supports the 80/20 rule to prioritize problems by arranging them in decreasing order of importance." },
            { id: 10, question: "The SMART characteristics for nursing standards state that objectives should be based on quantitative measures. Which characteristic does this describe?", options: ["Measurable", "Specific", "Attainable", "Relevant"], correct: 0, rationale: "Measurable means standards should be based on quantitative measures such as direct counts or percentages." },
            { id: 11, question: "What best describes the structure of quality circles within an organization?", options: ["Informal groups of employees voluntarily meeting regularly", "Formal committees appointed by top management annually", "Mandatory interdisciplinary panels led by external consultants", "Temporary task forces created specifically for financial audits"], correct: 0, rationale: "Quality Circles are informal groups of employees who voluntarily meet together on a regular basis." },
            { id: 12, question: "According to Crosby what is the ultimate definition of quality in healthcare delivery?", options: ["Doing the right thing at the right time in the right way for the right person", "Minimizing the cost of resources used in the delivery of patient care", "Achieving the maximum number of daily hospital admissions safely", "Following standardized protocols regardless of individual patient needs"], correct: 0, rationale: "Crosgy defines quality as doing the right thing, at the right time, in the right way, for the right person and having the best possible results." },
            { id: 13, question: "How does an open medical staff system impact nursing time and effort in a hospital ward?", options: ["It requires more time and equipment due to different doctors visiting at various times", "It reduces the variety of medications and treatments administered daily", "It saves time by ensuring consistent therapeutic methods across all patients", "It eliminates the need for nurses to provide reports during medical rounds"], correct: 0, rationale: "In an open system, many more doctors visit at different times, requiring a report for each, which takes more nursing time, effort, and equipment." },
            { id: 14, question: "Which standard describes the desired effect of care such as how the health status of a patient changes after an intervention?", options: ["Outcome standards", "Process standards", "Structure standards", "Environmental standards"], correct: 0, rationale: "Outcome standards describe the desired effect of care or actions in terms of behavior, responses, or how the patient's health status changes." },
            { id: 15, question: "Which phase of the SIX PROFIT MODEL involves tracking the effectiveness of the implementation?", options: ["The letter T", "The letter F", "The letter I", "The letter O"], correct: 0, rationale: "T stands for Track the effectiveness of the implementation and verify that the desired results are met." },
            { id: 16, question: "A review conducted while the patient is still receiving care to provide real time feedback is known as which of the following?", options: ["Concurrent Audit", "Retrospective Audit", "Prospective Audit", "Outcome Audit"], correct: 0, rationale: "Concurrent audits are conducted while patient care is ongoing to provide immediate improvements." },
            { id: 17, question: "What represents the most frequent category of undesired incidents in hospitals that may lead to extended hospitalization?", options: ["Patient falls", "Medication dispensing errors", "Hospital acquired infections", "Surgical site misidentifications"], correct: 0, rationale: "Patient falls constitute the most frequent category of undesired incidents/accidents in hospitals." },
            { id: 18, question: "What does the first stage of the customer life cycle primarily require to promote a brand or service?", options: ["Performing marketing activities", "Receiving contact information", "Expecting revenue generation", "Converting prospects entirely"], correct: 0, rationale: "The first stage is Reach, which requires performing marketing activities to promote your brand or services." },
            { id: 19, question: "Utilizing at least two routes such as name and date of birth is a method used to achieve which patient safety goal?", options: ["Patient identification", "Effective communication", "Safety of medication", "Reduction of infection"], correct: 0, rationale: "Patient identification uses at least two routes to make sure each patient gets the right medicine and therapy." },
            { id: 20, question: "What is a critical rule to follow during a brainstorming session to ensure a successful outcome?", options: ["Avoid criticism of ideas and dominance of particular staff", "Reject suggestions that seem outrageous or unconventional", "Ensure the session lasts for multiple days to maximize input", "Assign a rigid hierarchical speaking order among participants"], correct: 0, rationale: "Brainstorming features include avoiding criticism of ideas and dominance of particular staff, and no ideas are rejected." },
            { id: 21, question: "What is the first step in the quality assurance process for nursing care?", options: ["Setting standard", "Determining criteria", "Evaluate performance", "Making plan"], correct: 0, rationale: "The steps of quality assurance are: 1) Setting standard, 2) Determining criteria, 3) Evaluate performance, 4) Making plan, 5) Follow up." },
            { id: 22, question: "According to the American Nursing Association standards of professional performance include which of the following activities?", options: ["Collegiality", "Outcomes identification", "Diagnosis", "Assessment"], correct: 0, rationale: "Collegiality is a standard of Professional Performance. Assessment, Diagnosis, and Outcomes identification are Standards of Clinical Nursing Practice." },
            { id: 23, question: "Implementing high quality practices in a healthcare organization typically leads to higher patient satisfaction and shorter lengths of stay.", options: ["True", "False"], correct: 0, rationale: "Benefits of quality to patients include shorter length of stay, improved patient outcomes, and higher patient satisfaction." },
            { id: 24, question: "Which aspect is considered an outcome level variable of patient safety culture?", options: ["Frequency of events reported", "Teamwork across hospital units", "Communication openness among staff", "Organizational continuous improvement"], correct: 0, rationale: "Frequency of events reported and Overall perception of safety are outcome-level aspects." },
            { id: 25, question: "Which dimension of quality is defined as the ratio of the outputs of services to the associated costs of producing those services?", options: ["Efficiency of service delivery", "Effectiveness of care", "Technical performance", "Access to services"], correct: 0, rationale: "Efficiency of service delivery is the ratio of the outputs of services to the associated costs of producing those services." },
            { id: 26, question: "Quality inspection is an expensive method that adds value rather than just cost to the achievement of basic quality levels.", options: ["True", "False"], correct: 1, rationale: "Quality inspection is an expensive method that does not add value but adds to the cost of achieving a basic level of quality." },
            { id: 27, question: "Which framework is driven by continuous improvement teams to enhance efficiency and quality?", options: ["Six Sigma", "Root Cause Analysis", "Audit Tools", "Document Review"], correct: 0, rationale: "Continuous Improvement drives initiatives like Lean, Six Sigma, or Kaizen to enhance efficiency and quality." },
            { id: 28, question: "In a healthcare setting who are considered the internal customers of the organization?", options: ["Employees and departments", "Patients and relatives", "Visiting regulatory officials", "Community advocacy groups"], correct: 0, rationale: "Internal customers include the employees and departments within the organization." },
            { id: 29, question: "Organizational standards outline levels of acceptable practice within the institution and represent major infrastructure areas.", options: ["True", "False"], correct: 0, rationale: "Organizational standards outline levels of acceptable practice within the institution and represent major areas of an agency's infrastructure." },
            { id: 30, question: "How does the functional method of patient care assignment compare to the case method?", options: ["It is less time consuming", "It permits more individualized care", "It requires a higher number of nurses", "It provides better educational value"], correct: 0, rationale: "The functional method is less time-consuming than the case method of assignment, which is more educational but requires more nurses." },
            { id: 31, question: "Which graphical tool is used to plot data to detect the relationship between two specific variables?", options: ["Scatter plots", "Flow chart", "Cause and effect diagram", "Pareto diagram"], correct: 0, rationale: "Scatter plots consist of plotting data to detect the relationship between two variables." },
            { id: 32, question: "Retaining existing customers does not terminate the customer life cycle because they will become repeat customers if their needs are met.", options: ["True", "False"], correct: 0, rationale: "Retention: Converting prospects into customers does not end the customer life cycle; one-time customers will become repeat customers." },
            { id: 33, question: "Which factor belongs to the health care team factors that directly affect patient safety?", options: ["Incompatible goals", "Cognitive awareness", "Sensory perception", "Mobility status"], correct: 0, rationale: "Incompatible goals, staffing, training, communication, and procedures are health care team factors. The others are patient factors." },
            { id: 34, question: "What is one of the primary duties of the Nursing Care Quality Assurance Commission?", options: ["Establish qualifications for minimal competency", "Develop new pharmaceutical drugs", "Manage hospital financial budgets", "Dictate mandatory overtime policies"], correct: 0, rationale: "The NCQAC duties include establishing qualifications for minimal competency to grant or deny licensure." },
            { id: 35, question: "Top management in Total Quality Management organizes operations strictly around stakeholder financial demands rather than customer needs.", options: ["True", "False"], correct: 1, rationale: "Top management organizes all of its strategy and operations around customer needs, not strictly financial demands." },
            { id: 36, question: "Which standard domain evaluates the actions required by nurses to deliver care such as assessment techniques and evaluation activities?", options: ["Process Standards", "Structure Standards", "Outcome Standards", "Unit Standards"], correct: 0, rationale: "Process standards tend to be task-oriented and focus on whether practice is fulfilled, including assessment techniques and evaluation activities." },
            { id: 37, question: "Why do quality teams matter regarding the regulatory aspects of a healthcare organization?", options: ["They ensure adherence to industry standards", "They maximize raw material acquisition", "They completely eliminate staff turnover", "They override administrative decisions"], correct: 0, rationale: "Quality teams matter for Compliance: Ensures adherence to industry standards and regulation." },
            { id: 38, question: "Dealing with a service outage crisis smoothly is entirely irrelevant to customer focus since technology fails unpredictably.", options: ["True", "False"], correct: 1, rationale: "Dealing with a service outage crisis is listed as a major challenge affecting customer focus service; you must face the wrath of customers properly." },
            { id: 39, question: "What is the primary purpose of conducting a nursing audit within a healthcare facility?", options: ["To improve patient outcomes and ensure adherence to regulations", "To maximize annual profit margins for the hospital board", "To decrease the total number of nursing staff employed", "To eliminate the need for electronic health records"], correct: 0, rationale: "The purpose of a nursing audit is to improve patient outcomes, enhance nursing practices, and ensure adherence to healthcare regulations." },
            { id: 40, question: "Factual approach to decision making indicates that effective decisions should be based on which foundation?", options: ["Collected facts and analysis of data", "Intuition of senior management", "Historical financial reports exclusively", "Random sampling of competitor actions"], correct: 0, rationale: "Factual approach to decision-making: effective decisions are based on collected facts, and analysis of data." },
            { id: 41, question: "A cause and effect diagram can help decide which causes to investigate for quality improvement when a process goes out of control.", options: ["True", "False"], correct: 0, rationale: "The diagram helps determine which of several causes has the greatest effect and identifies reasons why a process goes out of control." },
            { id: 42, question: "Which situation highly increases the potential for misidentification of a patient according to safety guidelines?", options: ["When the patient is unconscious", "When the patient is fully communicative", "When the patient arrives with family", "When the patient speaks multiple languages"], correct: 0, rationale: "The potential for misidentification is an ever-present harm, especially in the unconscious patient." },
            { id: 43, question: "What specifies the interpretations and characteristics used for measuring whether a nursing standard has been reached?", options: ["Criteria", "Policies", "Protocols", "Benchmarks"], correct: 0, rationale: "Criteria are the interpretations, cues, characteristics or items used for measuring whether the standard has been reached or not." },
            { id: 44, question: "Quality control relies entirely on informal subjective observation rather than any operational techniques or statistical methods.", options: ["True", "False"], correct: 1, rationale: "Quality control is the operational techniques and activities used to evaluate service which is based on statistical methods." },
            { id: 45, question: "In a quality team who typically contributes fresh ideas from beyond the current organizational boundaries?", options: ["External consultants", "Frontline staff", "Subject matter experts", "Core leadership"], correct: 0, rationale: "External consultants contribute fresh ideas from beyond the organization." },
            { id: 46, question: "Which aspect is a direct benefit of Total Quality Management for staff members in an organization?", options: ["Higher job satisfaction", "Increased vacancy rate", "Longer lengths of stay", "Higher operational costs"], correct: 0, rationale: "Benefits of quality to staff include reduced turnover, higher job satisfaction, and opportunities for development." },
            { id: 47, question: "Accessibility to services measures how healthcare services are unrestricted by geographic or economic barriers.", options: ["True", "False"], correct: 0, rationale: "Access to services is the degree to which healthcare services are unrestricted by geographic, economic, social, organizational, or linguistic barriers." },
            { id: 48, question: "Which crucial skill involves an auditor effectively conveying findings and recommendations to the concerned department?", options: ["Communication Skills", "Clinical Knowledge", "Analytical Skills", "Ethical Judgment"], correct: 0, rationale: "Communication Skills: Effectively conveying findings and recommendations." },
            { id: 49, question: "What characterizes high performing healthcare organizations regarding their strategic vision?", options: ["A clear direction for the organization", "Ambiguous goals to remain flexible", "Complete reliance on front line staff decisions", "Avoidance of long term planning frameworks"], correct: 0, rationale: "Defined strategic vision: High-performing healthcare organizations have a strategic plan that Sets a clear direction." },
            { id: 50, question: "The American Nursing Association classifies the ability to advocate for patients and community partners as a clinical nursing practice standard.", options: ["True", "False"], correct: 1, rationale: "Advocating for patients is listed under Standards of Nursing Managers, not Clinical Nursing Practice." },
            { id: 51, question: "In the context of the simple definition of health care errors what does the letter T stand for in the SAFETY acronym?", options: ["Task", "Time", "Team", "Tool"], correct: 0, rationale: "In the table, T stands for Task." },
            { id: 52, question: "Which unit design makes it easier for nurses to recognize patient needs and requires less effort for traffic flow?", options: ["Open ward design", "Closed room design", "Isolated corridor design", "Multi story separated design"], correct: 0, rationale: "In an open ward/unit, all patients are obviously viewed... it requires less effort and traffic flow than the closed one." },
            { id: 53, question: "An aim statement should be recorded in the final team meeting to review what the team has already accomplished.", options: ["True", "False"], correct: 1, rationale: "Aim statement is recorded in the first team meeting is to decide exactly what it is the team plans to do." },
            { id: 54, question: "What is one of the main benefits of using a Customer Relationship Management system in healthcare?", options: ["Reducing errors in medical bills", "Increasing the length of patient stay", "Encouraging isolated departmental work", "Bypassing necessary regulatory checks"], correct: 0, rationale: "The benefits of CRM in healthcare include reducing errors in medical bills." },
            { id: 55, question: "What is considered a common pitfall or problem when running quality circle activities in an organization?", options: ["Irregularity of meetings", "Excessive focus on clinical skills", "Mandatory attendance policies", "Strict management direction"], correct: 0, rationale: "Pitfalls include irregularity of Quality Circle activities, non-maintenance of records, circles running out of problems." },
            { id: 56, question: "Gathering relevant patient records and conducting interviews with nursing staff are activities performed during the evaluation step of a nursing audit.", options: ["True", "False"], correct: 1, rationale: "These activities are part of Step 2: Data Collection, not Step 3: Evaluation." },
            { id: 57, question: "Which organizational standard area involves financial management and creating a productive environment for staff and volunteers?", options: ["Administrative systems", "Governance and leadership", "Community collaboration", "Program management"], correct: 0, rationale: "Administrative systems includes financial management and creating a positive and productive environment for staff & volunteers." },
            { id: 58, question: "Which indicator demonstrates positive supervisor expectations at the unit level regarding patient safety?", options: ["Considering staff suggestions seriously", "Mandating immediate punitive measures", "Ignoring minor established safety protocols", "Reducing temporary agency staff limits"], correct: 0, rationale: "Supervisor says a good word when a job is done... and seriously considers staff suggestions for improving patient safety." },
            { id: 59, question: "A core feature of quality circles is that participation is entirely voluntary with no coercion or pressure.", options: ["True", "False"], correct: 0, rationale: "Feature 3: Voluntary participation, no coercion or pressure on membership." },
            { id: 60, question: "Which document provides an organized checklist and software framework used specifically for internal and external quality evaluations?", options: ["Audit Tools", "Fishbone Diagram", "Scatter Plot", "Run Chart"], correct: 0, rationale: "Audit Tools: Checklists and software for internal and external audits." },
            { id: 61, question: "Continuous Quality Improvement specifically monitors which indicators to guide professionals in preventing patient care problems?", options: ["Structure process and outcome", "Financial input and demographic", "Legislative compliance and marketing", "Personnel attendance and vacation"], correct: 0, rationale: "CQI is the process of monitoring structure, process and outcome indicators." },
            { id: 62, question: "Disconnected reporting systems within a hospital are classified as human factors causing health care errors.", options: ["True", "False"], correct: 1, rationale: "Disconnected reporting systems within a hospital are classified as System failures, not Human Factors." },
            { id: 63, question: "Which practice involves using antimicrobial agents hand washing and cleaning supplies to reduce microorganisms?", options: ["Medical asepsis", "Surgical asepsis", "Complete sterilization", "Barrier nursing"], correct: 0, rationale: "Medical asepsis includes the use of antimicrobial agents, hand washing, cleaning supplies, and disinfection." },
            { id: 64, question: "Which source provides the legal rules and regulations detailing the practice of nursing in a specific state?", options: ["Nursing practice act", "Institutional policy manual", "National certification board", "Medical staff bylaws"], correct: 0, rationale: "Each state has a nursing practice act which details the legal rules and regulations that govern the practice of nursing." },
            { id: 65, question: "Making efficient use of resources and ensuring orders and disciplines are among the main purposes of quality control.", options: ["True", "False"], correct: 0, rationale: "Purposes of quality control: Ensuring orders, accomplishing goals, increase motivation, making efficient use of resources, improve performance." },
            { id: 66, question: "Which aspect relates to maintaining customer trust respect confidentiality and effective listening in healthcare?", options: ["Interpersonal relations", "Continuity of services", "Physical infrastructure", "Access to services"], correct: 0, rationale: "Interpersonal relations: Trust, respect, confidentiality, courtesy, responsiveness, empathy, effective listening." },
            { id: 67, question: "During a nursing audit which action is typically performed in the follow up step of the process?", options: ["Implement corrective actions", "Develop an audit plan", "Identify non conformities", "Prepare an audit report"], correct: 0, rationale: "Step 5: Follow-Up - Implement corrective actions and monitor their effectiveness." },
            { id: 68, question: "Aligning with physicians through clinical integration allows healthcare organizations to participate in value based contracting models.", options: ["True", "False"], correct: 0, rationale: "High-performing healthcare organizations have adopted a clinical integration strategy that allows both to achieve goals by participating in value-based contracting." },
            { id: 69, question: "What is a major communication challenge when implementing a Customer Relationship Management system in a healthcare organization?", options: ["Lack of transparent integration by top management", "Excessive face to face patient consultations", "Overreliance on paper charting systems", "Immediate adoption by all external suppliers"], correct: 0, rationale: "Lack of Communication: CRM implementation decisions are taken by top management... Lack of communication can give rise to insecurities and mental barrier in the staff." },
            { id: 70, question: "Which type of quality team is explicitly focused on ensuring quality regarding environmental compliance?", options: ["Environmental Quality", "Product Quality", "Process Quality", "Operational Quality"], correct: 0, rationale: "Environmental Quality focuses on Ensuring environmental compliance." },
            { id: 71, question: "Flow charts are entirely theoretical and should never be constructed using the knowledge of personnel directly involved in the process.", options: ["True", "False"], correct: 1, rationale: "The realistic flow chart can be constructed by using the knowledge of the personnel who are directly involved in the particular process." },
            { id: 72, question: "What happens when newly graduated nurses constitute the majority of the staff on a ward without experienced nurses?", options: ["More nurses are required to provide the same quality of care", "The ward naturally becomes more efficient immediately", "Patients automatically require shorter hospital stays", "Fewer overall staff are needed due to recent academic knowledge"], correct: 0, rationale: "Fewer highly experienced nurses can provide the same amount and quality of care provided by a greater number of newly graduated nurses. So, you'd need more new ones." },
            { id: 73, question: "Which hospital level aspect indicates that patient care information might be lost during shift changes?", options: ["Hospital handoff and transitions", "Teamwork across hospital units", "Management support for safety", "Non punitive response"], correct: 0, rationale: "Hospital handoff and transitions: when transferring patients to another unit, important patient care information is often lost during shift changes." },
            { id: 74, question: "Resource utilization is considered a standard of professional nursing performance according to the American Nursing Association.", options: ["True", "False"], correct: 0, rationale: "Resources utilization: the registered nurse considers factors related to safety, effectiveness, cost... It is listed under Standards of Professional Nursing Performance." },
            { id: 75, question: "Which feature accurately describes the decision making process within a traditional quality circle?", options: ["Decisions are made by consensus", "Decisions are made by strict majority voting", "Decisions are enforced by top executives", "Decisions are chosen through random selection"], correct: 0, rationale: "Feature 7: Decision by consensus, not by majority." },
            { id: 76, question: "Which factor causes increased medical complexity potentially leading to health care errors?", options: ["Complicated technologies and powerful drugs", "Disconnected reporting systems", "Inadequate hand washing facilities", "Poor nurse communication"], correct: 0, rationale: "Medical complexity involves intensive care, prolonged hospital stay, and complicated technologies, powerful drugs." },
            { id: 77, question: "Resistance from staff is not a recognized challenge in nursing audits because nurses always welcome scrutiny to improve care.", options: ["True", "False"], correct: 1, rationale: "Resistance from Staff is listed as a challenge: Nurses may feel scrutinized or defensive." },
            { id: 78, question: "Which action helps healthcare providers exceed customer expectations according to the challenges of customer focus service?", options: ["Going the extra mile proactively", "Doing only what the minimum standard requires", "Disregarding complaints from angry customers", "Refusing demands that consume extra resources"], correct: 0, rationale: "You should go the extra mile to exceed expectations proactively, which is one of the biggest challenges in customer service." },
            { id: 79, question: "When writing an aim statement for quality improvement what does the letter R represent in the SMART acronym?", options: ["Result oriented", "Reliable", "Relevant", "Reasonable"], correct: 0, rationale: "In the text, R stands for Result oriented. (S for Specific, M for Measurable, A for Achievable, R for Result oriented, T for Time scheduled)." },
            { id: 80, question: "Providing continuous education and training about problem solving techniques is an essential principle of Total Quality Management.", options: ["True", "False"], correct: 0, rationale: "Education and training is a principle of TQM: for all health care providers continuous education and training about quality of patient care, problem solving technique, etc." }
        ];

        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
</body>
</html>
