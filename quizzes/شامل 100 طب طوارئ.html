            { id: 53, question: "Pain originating from the gallbladder and biliary tract is most commonly felt in which abdominal region?", options: ["Upper right quadrant", "Lower left quadrant", "Epigastric region", "Upper left quadrant"], correct: 0, rationale: "Gallbladder and biliary tract conditions, such as cholecystitis, typically cause upper right abdominal pain." },

            { id: 78, question: "According to the primary survey airway assessment, what is the immediate management for a patient who is unresponsive and has an absent gag reflex?", options: ["Definitive airway intubation", "Administration of supplemental high flow oxygen via mask", "Observation and continuous pulse oximetry monitoring", "Performance of needle thoracostomy"], correct: 0, rationale: "An absent gag reflex and unresponsiveness indicate an inability to maintain or protect the airway, necessitating definitive airway management via intubation." },
            { id: 79, question: "Which diagnostic test helps evaluate for signs of hemolytic anemia during a hypertensive crisis workup?", options: ["Complete blood cell count with peripheral smear", "Basic metabolic profile", "Urine toxicology screen", "Electrocardiogram"], correct: 0, rationale: "A complete blood cell count with a peripheral smear is evaluated for signs of microangiopathic hemolytic anemia, which can occur in hypertensive emergencies." },
            { id: 80, question: "Acute abdominal pain refers exclusively to conditions that require immediate surgical intervention.", options: ["True", "False"], correct: 1, rationale: "Acute abdomen refers to severe, sudden pain that may or may not demand immediate operative interference; some cases resolve without surgery." },
            { id: 81, question: "What is the target mean arterial pressure during the initial resuscitation of distributive shock?", options: ["Greater than or equal to sixty five millimeters of mercury", "Greater than or equal to ninety millimeters of mercury", "Greater than or equal to fifty millimeters of mercury", "Greater than or equal to one hundred millimeters of mercury"], correct: 0, rationale: "Early goal-directed therapy for distributive shock targets a mean arterial pressure of greater than or equal to 65 mmHg." },
            { id: 82, question: "What is the most common presenting symptom in up to one third of pediatric patients with bacterial meningitis?", options: ["Seizures", "Petechial rash", "Profound bradycardia", "Painless jaundice"], correct: 0, rationale: "Seizures may be a presenting symptom in up to one-third of pediatric patients with bacterial meningitis." },
            { id: 83, question: "What mechanism causes a closed simple pneumothorax in a trauma patient?", options: ["Puncture of the lung by a rib against a closed glottis", "A penetrating foreign object creating a defect in the chest wall", "The sudden accumulation of blood in the intra thoracic space", "Severe contusion leading to alveolar collapse without pleural breach"], correct: 0, rationale: "In trauma, a closed pneumothorax is often associated with the puncture of the lung by a rib or compression of the chest against a closed glottis." },
            { id: 84, question: "In cases of hemorrhagic shock, permissive hypotension is often employed to avoid disrupting fragile clots.", options: ["True", "False"], correct: 0, rationale: "Permissive hypotension is employed in hemorrhagic shock until bleeding is controlled to prevent disrupting newly formed clots." },
            { id: 85, question: "Which diagnostic approach allows for the direct evaluation of herniated abdominal contents into the thoracic cavity?", options: ["Video assisted thoracoscopic surgery", "Diagnostic peritoneal lavage", "Abdominal ultrasound", "Plain chest radiography"], correct: 0, rationale: "A thoracic approach via video-assisted thoracoscopic surgery allows for the direct evaluation of herniated contents and subsequent reduction in cases of diaphragmatic rupture." },
            { id: 86, question: "Which underlying condition is most typically classified as a structural cardiac cause of syncope?", options: ["Aortic stenosis", "Atrioventricular conduction block", "Ventricular fibrillation", "Vasovagal reflex"], correct: 0, rationale: "Aortic stenosis is a structural outflow obstruction that can cause cardiac syncope, whereas atrioventricular blocks and ventricular fibrillation are rhythm disturbances." },
            { id: 87, question: "During fluid resuscitation in the emergency department, what is the perfusion goal for urine output?", options: ["Greater than zero point five milliliters per kilogram per hour", "Greater than one milliliter per kilogram per hour", "Greater than two milliliters per kilogram per hour", "Greater than zero point one milliliters per kilogram per hour"], correct: 0, rationale: "The perfusion goal during fluid management includes maintaining a urine output greater than 0.5 milliliters per kilogram per hour." },
            { id: 88, question: "Nitroprusside is universally recommended as the safest first line agent for all hypertensive emergencies regardless of the etiology.", options: ["True", "False"], correct: 1, rationale: "The choice of antihypertensive agent depends specifically on the severity of hypertension and the associated end-organ injury; no single agent is universally best." },
            { id: 89, question: "What diagnostic finding in cerebrospinal fluid is uniquely characteristic of viral encephalitis compared to bacterial meningitis?", options: ["Lymphocytic predominance with normal glucose", "Neutrophilic predominance with low glucose", "Massive elevation of protein above five hundred", "Presence of gram negative intracellular diplococci"], correct: 0, rationale: "Viral infections of the central nervous system typically present with a lymphocytic predominance and normal glucose levels, unlike the neutrophilic response and low glucose seen in bacterial infections." },
            { id: 90, question: "Which biochemical change directly results from the cellular shift to anaerobic metabolism during shock?", options: ["Elevated blood lactate levels", "Decreased serum potassium levels", "Elevated systemic vascular resistance", "Decreased carbon dioxide production"], correct: 0, rationale: "Anaerobic metabolism produces increased carbon dioxide and elevated blood lactate levels, leading to metabolic acidosis." },
            { id: 91, question: "A patient with blunt trauma to the abdomen presents with hematuria and an expanding flank hematoma. Which injury is most strongly suspected?", options: ["Renal trauma", "Splenic rupture", "Hepatic laceration", "Diaphragmatic tear"], correct: 0, rationale: "Hematuria, flank pain, and flank hematoma are classic presenting signs of trauma to the kidneys." },
            { id: 92, question: "A patient with syncope presenting without a prodrome or with a prodrome of less than ten seconds is at a high probability for a serious cause.", options: ["True", "False"], correct: 0, rationale: "An absent or very short prodrome increases the probability of a serious, potentially cardiac cause of syncope." },
            { id: 93, question: "What is the standard management for a patient presenting with a very small simple pneumothorax and no ventilatory compromise?", options: ["Observation and close monitoring", "Immediate insertion of a large bore chest tube", "Needle thoracostomy decompression", "Emergency open thoracotomy"], correct: 0, rationale: "Very small pneumothoraxes without ventilatory compromise may not require chest tube insertion and can be managed with observation." },
            { id: 94, question: "Which patient scenario represents the highest priority for immediate intervention based on general emergency principles?", options: ["Uncontrolled bleeding with signs of shock", "Isolated closed fracture of the radius", "Mild dyspnea with an oxygen saturation of ninety five percent", "Superficial laceration to the lower extremity"], correct: 0, rationale: "A patient is considered high priority if they exhibit uncontrolled bleeding and signs of shock, requiring immediate life-saving interventions." },
            { id: 95, question: "What is the primary mechanism of myocardial depression in late stage distributive shock?", options: ["Cytokine mediated reduction in calcium handling", "Direct ischemic necrosis of the right ventricle", "Massive accumulation of intracellular adenosine triphosphate", "Mechanical compression of the coronary arteries"], correct: 0, rationale: "Cytokine-mediated myocardial depression involves altered calcium handling and nitric oxide toxicity, which reduces contractility in late stages." },
            { id: 96, question: "The term acute abdomen typically refers to a sudden and severe abdominal pain that has lasted for more than two weeks.", options: ["True", "False"], correct: 1, rationale: "Acute abdomen refers to sudden, severe pain of unclear etiology that is less than 24 hours in duration." },
            { id: 97, question: "In patients suspected of having an acute CNS infection, why are blood cultures recommended before obtaining a CT scan if lumbar puncture is delayed?", options: ["To provide an alternative avenue for identifying bacterial pathogens", "To directly measure the intracranial pressure", "To rule out the presence of a concomitant viral infection", "To ensure the patient has an adequate white blood cell count for imaging"], correct: 0, rationale: "Blood cultures should be drawn before empiric antibiotics are administered if the lumbar puncture is delayed, to help identify the pathogen in cases of bacteremia." },
            { id: 98, question: "Which clinical indicator is heavily relied upon to identify paradoxical inward movement of the chest wall?", options: ["Visual inspection of respiratory mechanics during inspiration", "Auscultation of diminished breath sounds at the bases", "Percussion of hyperresonance over the affected area", "Palpation of subcutaneous emphysema along the clavicle"], correct: 0, rationale: "Paradoxical motion is identified during the visual inspection of the chest, observing inward movement of the flail segment during inspiration." },
            { id: 99, question: "Which inflammatory mediator is directly triggered by hypoxia and leads to increased microvascular permeability in shock?", options: ["Tumor necrosis factor alpha", "Thyroxine", "Aldosterone", "Antidiuretic hormone"], correct: 0, rationale: "Hypoxia-triggered endothelial activation releases pro-inflammatory cytokines like tumor necrosis factor alpha, causing increased permeability." },
            { id: 100, question: "Patients with a hypertensive urgency often require admission to the intensive care unit for intravenous medication.", options: ["True", "False"], correct: 1, rationale: "Hypertensive emergencies require intensive care unit admission for intravenous medications. Hypertensive urgencies are often managed on an outpatient basis." }
        ];

        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
