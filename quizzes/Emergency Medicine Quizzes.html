                    { question: "Vasovagal syncope is triggered by:", options: ["Sensory or emotional reactions", "Standing up quickly", "Shaving", "Coughing"], correct: 0, rationale: "Vasovagal syncope is a reflex syncope triggered by sensory or emotional reactions." },
                    { question: "Orthostatic syncope is related to:", options: ["Emotional stress", "Postural changes and volume depletion", "Coughing or straining", "Pacing dysfunction"], correct: 1, rationale: "Orthostatic syncope is postural related and linked to volume depletion." },
                    { question: "Situational syncope can be triggered by:", options: ["Shaving", "Emotional trauma", "Coughing and straining", "Standing up quickly"], correct: 2, rationale: "Situational syncope is triggered by specific actions like coughing or straining." },
                    { question: "Carotid sinus pressure syncope can occur during:", options: ["Running", "Sleeping", "Shaving", "Eating"], correct: 2, rationale: "Pressure on the carotid sinus during shaving can trigger reflex syncope." },
                    { question: "Which class of medications is commonly associated with syncope?", options: ["Antibiotics", "NSAIDs", "Beta-blockers and CCBs", "Vitamins"], correct: 2, rationale: "Medications such as CCBs, B-blockers, digoxin, and drugs of abuse can cause syncope." },
                    { question: "Focal CNS hypoperfusion causing syncope can be due to:", options: ["Hyperventilation", "Hypoxia, epilepsy, or dysfunctional brainstem", "Migraine", "Spinal cord injury"], correct: 1, rationale: "Hypoxia, epilepsy, and dysfunctional brainstem can cause focal CNS hypoperfusion." },
                    { question: "During the patient history assessment, what specific trigger is critical to ask about regarding cardiac risk?", options: ["Syncope after eating", "Syncope during exertion", "Syncope while sitting", "Syncope while sleeping"], correct: 1, rationale: "Asking about exertion is critical, as syncope during exertion strongly suggests a cardiac structural or arrhythmic cause." },
                    { question: "Which laboratory test is NOT listed as a standard initial investigation for syncope?", options: ["CBC", "Glucose", "BUN/Cr", "Liver enzymes (ALT/AST)"], correct: 3, rationale: "Standard initial labs mentioned are CBC, glucose, and BUN/Cr." },
                    { question: "Tachydysrhythmias that can cause syncope include:", options: ["Sinus bradycardia", "SVT, Afib, Vtach, Vfib", "First-degree AV block", "Wenckebach block"], correct: 1, rationale: "Tachydysrhythmias include SVT, Afib, Vtach, and Vfib." },
                    { question: "What is the Tilt Table Test primarily used to diagnose?", options: ["Myocardial infarction", "Vasovagal syncope", "Aortic stenosis", "Epilepsy"], correct: 1, rationale: "The Tilt table test is used for diagnosing vasovagal syncope." },
                    { question: "If arrhythmias are suspected but not seen on an initial ECG, what is the next step?", options: ["CT Brain", "Holter monitor for prolonged ECG monitoring", "Tilt table test", "Echocardiogram"], correct: 1, rationale: "A Holter monitor is used for prolonged ECG monitoring if arrhythmias are suspected." },
                    { question: "What is the primary management for Reflex (Vasovagal) Syncope?", options: ["Implantable defibrillator", "Reassurance, education about triggers, and hydration", "Anti-epileptic drugs", "Beta-blockers"], correct: 1, rationale: "Management includes reassurance, education about triggers, and lifestyle modifications (hydration)." },
                    { question: "For Orthostatic Hypotension, non-pharmacological management includes:", options: ["Fluid restriction", "Increase fluid and salt intake, use compression stockings", "Avoid standing entirely", "Hot showers"], correct: 1, rationale: "Management includes increasing fluid/salt intake and compression stockings." },
                    { question: "Which medications might be necessary for treating severe Orthostatic Hypotension?", options: ["Diuretics", "Fludrocortisone and midodrine", "Amiodarone", "Insulin"], correct: 1, rationale: "Medications such as fludrocortisone and midodrine are used if necessary." },
                    { question: "Management of Cardiac Syncope involves:", options: ["Lifestyle modifications only", "Treatment based on specific condition (e.g., pacemakers, ICD)", "Anti-epileptic drugs", "Compression stockings"], correct: 1, rationale: "Management is based on the cardiac condition, such as pacemakers or ICDs." },
                    { question: "Neurological causes of syncope (like seizures) require:", options: ["Cardiology consult", "Consultation with neurology for epilepsy management", "Psychiatric consult", "No action"], correct: 1, rationale: "Consultation with neurology for seizure or central nervous system disorders." },
                    { question: "A key patient education point for preventive measures is:", options: ["Stop all medications", "Teach patients to recognize signs of impending syncope and how to manage triggers", "Encourage prolonged standing", "Advise against drinking water"], correct: 1, rationale: "Teach patients to recognize the signs of impending syncope and how to manage triggers." },
                    { question: "To prevent syncope, patients with orthostatic triggers should:", options: ["Avoid prolonged standing or rapid position changes", "Stand up as fast as possible", "Decrease salt intake", "Perform strenuous exercises immediately upon waking"], correct: 0, rationale: "Patients should avoid prolonged standing or rapid position changes." },
                    { question: "Syncope is defined as a 'temporary loss of consciousness due to a drop in blood flow to the:'", options: ["Heart", "Lungs", "Brain", "Kidneys"], correct: 2, rationale: "It is a temporary loss of consciousness due to a drop in blood flow to the brain." },
                    { question: "Which is considered an 'Other CV disease' that can cause syncope?", options: ["Asthma", "Pulmonary Embolism (PE)", "GERD", "Peptic Ulcer"], correct: 1, rationale: "Pulmonary embolism (PE) and cardiomyopathy are listed under 'Other CV diseases'." },
                    { question: "Loss of postural tone is a defining characteristic of:", options: ["Vertigo", "Dizziness", "Syncope", "Migraine"], correct: 2, rationale: "Syncope is defined by sudden loss of consciousness with loss of postural tone." },
                    { question: "Bradyarrhythmias causing syncope include:", options: ["Ventricular tachycardia", "AV conduction blocks and sinus node dysfunction", "Atrial fibrillation", "SVT"], correct: 1, rationale: "AV conduction blocks and sinus node dysfunction are bradyarrhythmias." },
                    { question: "Syncope follow-up includes:", options: ["Discharge with no further visits", "Regular follow-ups to monitor condition and adjust treatment", "Immediate surgery for all patients", "Lifelong bed rest"], correct: 1, rationale: "Regular follow-ups monitor the condition and response to treatment, adjusting modalities as needed." },
                    { question: "Does syncope typically involve a prolonged recovery period with confusion?", options: ["Yes, always", "No, it features a rapid return to baseline", "Only in cardiac syncope", "Only in vasovagal syncope"], correct: 1, rationale: "Syncope is accompanied by a rapid return to baseline (unlike seizures which have a post-ictal state)." },
                    { question: "Which device is considered for high-risk cardiac syncope (e.g., ventricular arrhythmias)?", options: ["Holter monitor", "Implantable cardioverter-defibrillator (ICD)", "Tilt table", "Compression stocking"], correct: 1, rationale: "Consideration of an implantable cardioverter-defibrillator (ICD) if indicated." }
                ]
            },
            {
                title: "Acute CNS Infection",
                icon: "fa-brain",
                data: [
                    { question: "What is meningitis?", options: ["Infection of the brain parenchyma", "Inflammatory process of the membranes that surround the brain and spinal cord", "Infection of the spinal cord only", "Autoimmune disease of the skull"], correct: 1, rationale: "Meningitis is an inflammatory process of the membranes that surround the brain and spinal cord." },
                    { question: "Bacterial meningitis is most commonly caused by:", options: ["Viruses", "Encapsulated bacterial organisms", "Fungi", "Parasites"], correct: 1, rationale: "It is caused by a bacterial pathogen, most commonly encapsulated organisms." },
                    { question: "Aseptic meningitis is most overall caused by:", options: ["Bacteria", "Fungi", "Viruses such as enteroviruses and echoviruses", "Medication side effects"], correct: 2, rationale: "Enteroviruses and echoviruses are the most common overall cause of aseptic meningitis." },
                    { question: "Encephalitis differs from meningitis because it is an infection of:", options: ["The meninges", "The brain parenchyma", "The skull bone", "The peripheral nerves"], correct: 1, rationale: "Encephalitis is an infection of the brain parenchyma causing inflammation within the CNS." },
                    { question: "How do pathogens typically enter the CNS to cause meningitis?", options: ["Through intact skin", "Violating the blood-brain barrier after upper airway infection, or via bacteremia", "Through the digestive tract directly", "Via mosquito bites only"], correct: 1, rationale: "They enter by violating the BBB after an upper airway infection, via the bloodstream (bacteremia), or CNS inoculation." },
                    { question: "Which two pathogens are the most common causes of acute bacterial meningitis?", options: ["E. coli and S. aureus", "Streptococcus pneumoniae and Neisseria meningitidis", "Listeria and Haemophilus", "Treponema and Borrelia"], correct: 1, rationale: "S. pneumoniae and N. meningitidis are the most common pathogens causing acute bacterial meningitis." },
                    { question: "Listeria monocytogenes as a cause of meningitis is more common in which groups?", options: ["Healthy teenagers", "Patients over 50, infants <3 months, pregnant, or immunocompromised", "Children aged 5-10", "Adults 20-30 years old"], correct: 1, rationale: "It is more common in those >50 years, infants <3 months, immunocompromised, or pregnant." },
                    { question: "The most treatable cause of viral encephalitis is:", options: ["Enterovirus", "HIV", "Herpes simplex virus (HSV)", "Rabies"], correct: 2, rationale: "Infection by herpes simplex virus (HSV) is the most treatable cause of encephalitis." },
                    { question: "What is the classically described triad of bacterial meningitis?", options: ["Fever, neck stiffness, altered mental status", "Headache, rash, cough", "Vomiting, diarrhea, fever", "Seizures, aphasia, coma"], correct: 0, rationale: "The classic triad is Fever, Neck stiffness, and Altered mental status." },
                    { question: "Are all three classic features present in the majority of adult bacterial meningitis patients?", options: ["Yes, almost 100%", "No, present together in less than half of adult patients", "Yes, in 80% of patients", "They are never present together"], correct: 1, rationale: "All three features are present together in less than half of adult patients." },
                    { question: "Infants with meningitis may present with nonspecific symptoms such as:", options: ["Classic neck stiffness", "Aphasia", "Irritability, lethargy, poor feeding, or a bulging fontanelle", "Photophobia"], correct: 2, rationale: "Infants present nonspecifically with irritability, lethargy, poor feeding, rash, or bulging fontanelle." },
                    { question: "Kernig's sign involves:", options: ["Passive flexion of the neck", "Severe neck stiffness", "Flexing the hip and extending the knee to elicit pain in the back and legs", "Tapping the facial nerve"], correct: 2, rationale: "Kernig's sign is flexing the hip and extending the knee to elicit pain in the back and legs." },
                    { question: "Brudzinski's sign involves:", options: ["Passive flexion of the neck eliciting flexion of the hips", "Extending the knee causing pain", "Light sensitivity", "Petechial rash"], correct: 0, rationale: "Brudzinski's sign is passive flexion of the neck eliciting flexion of the hips." },
                    { question: "Petechiae and purpura are classically associated with which type of meningitis?", options: ["Pneumococcal", "Meningococcal", "Viral", "Fungal"], correct: 1, rationale: "Petechiae and purpura are classically associated with meningococcal meningitis." },
                    { question: "What is the preferred diagnostic procedure for suspected meningitis/encephalitis?", options: ["CT Scan alone", "Lumbar puncture (LP)", "Blood culture only", "EEG"], correct: 1, rationale: "A prompt lumbar puncture (LP) is the preferred diagnostic procedure." },
                    { question: "Which CSF finding is highly suggestive of bacterial meningitis?", options: ["Normal glucose", "WBC < 300 with lymphocytic predominance", "Glucose < 40 mg/dL and WBC > 1000 with >80% neutrophils", "Normal opening pressure"], correct: 2, rationale: "Bacterial meningitis shows low glucose (<40), high protein (>200), WBC >1000, and >80% neutrophils." },
                    { question: "In viral meningitis, the CSF glucose level is typically:", options: ["Reduced", "Elevated", "Normal", "Absent"], correct: 2, rationale: "In viral meningitis, CSF glucose is typically normal." },
                    { question: "Neuroimaging (CT scan) is required BEFORE an LP if the patient has:", options: ["A fever", "Altered mental status, new seizures, focal neurologic signs, or papilledema", "A rash", "Neck stiffness"], correct: 1, rationale: "CT is required before LP if there are signs of mass/herniation: altered mental status, seizures, focal signs, immunocompromised, or papilledema." },
                    { question: "What precaution type must be implemented for suspected bacterial meningitis?", options: ["Airborne precautions", "Contact precautions", "Droplet precautions", "Standard precautions only"], correct: 2, rationale: "Implement droplet precautions (private room, surgical masks, face shield) until 24 hours of effective antibiotics." },
                    { question: "When should empiric antibiotics be administered for suspected bacterial meningitis?", options: ["After the final CSF culture results (48 hours)", "Promptly after LP, or after blood cultures if LP is delayed", "Only after a CT scan is read", "Before any blood cultures are drawn"], correct: 1, rationale: "Administer empiric antibiotics after a prompt LP, or after blood cultures if LP/CT is delayed." },
                    { question: "For neonates, empiric treatment in many circumstances includes:", options: ["Ceftriaxone and Vancomycin", "Ampicillin and gentamycin (or cefotaxime)", "Acyclovir", "Dexamethasone only"], correct: 1, rationale: "Neonates: Ampicillin and gentamycin (or cefotaxime based on resistance patterns)." },
                    { question: "For children and adults less than 50 years old, the empiric regimen is typically:", options: ["Ampicillin only", "Third-generation cephalosporin (cefotaxime/ceftriaxone) plus vancomycin", "Gentamycin only", "Fluconazole"], correct: 1, rationale: "Children/adults <50: third-generation cephalosporin plus vancomycin." },
                    { question: "If a patient has risk factors for Listeria monocytogenes, what antibiotic should be ADDED?", options: ["Vancomycin", "Ampicillin", "Gentamycin", "Acyclovir"], correct: 1, rationale: "Consider adding ampicillin to cover Listeria." },
                    { question: "What is the role of intravenous dexamethasone in bacterial meningitis?", options: ["To treat viral co-infection", "It may decrease mortality and neurologic sequelae if started before or with the first antibiotic dose", "To increase CSF pressure", "To cure fungal meningitis"], correct: 1, rationale: "Adjunctive corticosteroid started before/with antibiotics decreases mortality and neurologic sequelae." },
                    { question: "If HSV encephalitis is suspected, what specific treatment must be administered?", options: ["Intravenous Acyclovir", "Vancomycin", "Ampicillin", "Dexamethasone"], correct: 0, rationale: "Intravenous acyclovir is recommended for suspected HSV encephalitis." },
                    { question: "CSF studies for encephalitis typically show:", options: ["High neutrophil count", "Increased white blood cells with a lymphocytic predominance and possibly increased RBCs", "Zero white blood cells", "Massive glucose drop"], correct: 1, rationale: "Encephalitis CSF shows increased WBCs (lymphocytic predominance) and possibly increased RBCs from neuronal death/hemorrhage." },
                    { question: "How many tubes of CSF are typically collected during an LP?", options: ["One", "Two", "Four", "Six"], correct: 2, rationale: "Clinicians typically collect four tubes each containing about 1mL of CSF." },
                    { question: "What should be drawn BEFORE administering empiric antibiotics if LP is delayed by a CT scan?", options: ["Urine culture", "Blood cultures", "Sputum culture", "Skin swab"], correct: 1, rationale: "Obtain blood cultures and begin empiric therapy prior to CT to avoid additional delays." },
                    { question: "If initial CSF laboratory findings do not yield classic results but bacterial meningitis is possible:", options: ["Withhold antibiotics", "Consider empiric treatment for possible bacterial meningitis", "Give only antivirals", "Discharge the patient"], correct: 1, rationale: "Initial CSF findings don't always yield classic results; consider empiric treatment when inconclusive." },
                    { question: "Droplet precautions should be maintained until:", options: ["Patient is discharged", "24 hours of effective antibiotic treatment", "Fever breaks", "The rash disappears"], correct: 1, rationale: "Maintain precautions until 24 hours of effective antibiotic treatment." }
                ]
            }
        ];

        let activeQuizIndex = -1;
        let quizData = [];
        let score = 0; 
        let answeredCount = 0;

        function initMenu() {
            const menuContainer = document.getElementById('menu-cards-container');
            menuContainer.innerHTML = allQuizzes.map((quiz, index) => {
                return `
                <button onclick="startQuiz(${index})" class="menu-btn bg-white rounded-2xl shadow-sm p-6 border border-gray-100 hover:border-blue-400 hover:shadow-md text-left flex items-start gap-4 h-full w-full">
                    <div class="bg-blue-50 p-4 rounded-xl text-blue-600">
                        <i class="fas ${quiz.icon} text-3xl"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-bold text-gray-800 text-lg mb-2 font-cairo">${quiz.title}</h3>
                        <p class="text-sm text-gray-500 font-cairo">${quiz.data.length} Questions</p>
                    </div>
                </button>`;
            }).join('');
        }

        function showMenu() {
            document.getElementById('quiz-area').classList.add('hidden-content');
            document.getElementById('main-menu').classList.remove('hidden-content');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function startQuiz(index) {
            activeQuizIndex = index;
            const rawQuizData = allQuizzes[index].data;
            
            // Deep copy and shuffle questions and options
            quizData = rawQuizData.map(q => {
                const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
            });

            score = 0;
            answeredCount = 0;
            
            document.getElementById('active-quiz-title').innerText = allQuizzes[index].title;
            document.getElementById('result-summary').classList.add('hidden-content');
            document.getElementById('main-menu').classList.add('hidden-content');
            document.getElementById('quiz-area').classList.remove('hidden-content');
            
            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function restartCurrentQuiz() {
            if (activeQuizIndex !== -1) {
                startQuiz(activeQuizIndex);
            }
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Good Job! ممتاز" : "Keep Studying, راجع المحاضرة";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };

        initMenu();

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered (Offline mode enabled)'))
                    .catch(err => console.log('Service Worker Registration Failed', err));
            });
        }
    </script>
</body>
</html>
