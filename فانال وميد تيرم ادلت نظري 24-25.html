    <script>
        // --- 1. QUESTIONS ARRAY ---
        const rawQuizData = [
            // ================= MIDTERM EXAM MCQ =================
            { id: 1, question: "The preoperative checklist is usually completed and signed by the ______ before the patient is transported from the unit to the operating theater.", options: ["Anesthesia nurse", "Circulating nurse", "Preoperative nurse", "Scrub nurse"], correct: 2, rationale: "The preoperative nurse (ward nurse) completes the patient's preparation on the floor and signs the checklist before transferring to the OR." },
            { id: 2, question: "When the anesthetic medication is injected locally into the extradural space near the spinal cord, for anesthetizing several nerves at once. This refers to which type of the following regional anesthesia:", options: ["Local anesthesia", "Epidural anesthesia", "Spinal anesthesia", "Peripheral nerve block"], correct: 1, rationale: "Epidural anesthesia is injected into the extradural (epidural) space, blocking multiple nerve roots simultaneously." },
            { id: 3, question: "All the following are considered from early postoperative complication Except:", options: ["Hemorrhage", "Aspiration", "Shock", "Thrombophlebitis"], correct: 3, rationale: "Thrombophlebitis (like DVT) is a delayed complication caused by prolonged immobility, whereas hemorrhage, shock, and aspiration are immediate/early risks." },
            { id: 4, question: "During the ______ of Acute kidney injury, there is an increase in water content of urine and blood urea nitrogen; Creatinine levels remain elevated in the blood.", options: ["Oliguric phase", "Diuretic phase", "Recovery phase", "Initiation phase"], correct: 1, rationale: "During the diuretic phase, urine output increases but the kidneys cannot yet concentrate urine or clear waste effectively, so BUN and Creatinine remain elevated initially." },
            { id: 5, question: "Which of the following nursing interventions should be included in the client's care plan during dialysis therapy?", options: ["Limit the client's visitors", "Keep the client NPO", "Pad the side rails of the bed", "Monitor the client's blood pressure"], correct: 3, rationale: "Monitoring blood pressure is essential during dialysis because the rapid fluid shifts frequently cause hypotension." },
            { id: 6, question: "What is a common problem associated with peritoneal dialysis?", options: ["Nausea", "Abdominal infection", "Insomnia", "Respiratory problems"], correct: 1, rationale: "Peritonitis (abdominal infection) is the most common and dangerous complication of peritoneal dialysis due to catheter contamination." },
            { id: 7, question: "The purpose of adding dextrose in the solution of peritoneal dialysis is to:", options: ["Increases osmotic pressure for fluid removal.", "Prevents disequilibrium syndrome", "Decreases the risk of peritonitis", "Prevents excess glucose from being removed from the client"], correct: 0, rationale: "Dextrose serves as an osmotic agent, creating an osmotic gradient that pulls excess fluid and wastes from the blood into the dialysate." },
            { id: 8, question: "In treating musculoskeletal injury, elastic bandage is used to:", options: ["Increase edema in the affected part", "Support the affected part", "Improve circulation in the afflicted part", "Allow free motion of the affected part"], correct: 1, rationale: "An elastic bandage provides compression and support to the injured musculoskeletal structure, helping to reduce swelling and stabilize the area." },
            { id: 9, question: "The nurse should instruct the patient with lumbar discectomy that 'pain will persist for a while after the process of wound healing' due to:", options: ["The long time of surgery", "The post operative complications", "The nerve damage which needs time to recover", "The nursing interventions"], correct: 2, rationale: "Nerve roots that were compressed for a long time take significantly longer to heal and regenerate than the surgical wound itself." },

            // ================= MIDTERM TRUE/FALSE =================
            { id: 10, question: "The surgery that must be performed immediately to save or maintain life is defined as imperative urgent surgery.", options: ["True", "False"], correct: 1, rationale: "False. Surgery that must be performed immediately to save a life is called 'Emergent surgery'. 'Urgent' surgery is required within 24-48 hours." },
            { id: 11, question: "Informed consent is necessary for invasive, surgical procedures and nonsurgical procedures.", options: ["True", "False"], correct: 0, rationale: "True. Informed consent is mandatory for all surgical, invasive, and certain high-risk nonsurgical diagnostic procedures." },
            { id: 12, question: "The safety concept is not essential to be considered in immediate postoperative care.", options: ["True", "False"], correct: 1, rationale: "False. Patient safety (airway patency, fall prevention, hemodynamic stability) is the absolute highest priority in the immediate postoperative period." },
            { id: 13, question: "Azotemia is marked accumulation of urea and other nitrogenous wastes such as Creatinine and uric acid in the blood.", options: ["True", "False"], correct: 0, rationale: "True. Azotemia is the medical term for the abnormal accumulation of nitrogen-based waste products in the bloodstream due to renal failure." },
            { id: 14, question: "All patients with acute kidney injury will progress through the oliguric stage of AKI but not will progress through the diuretic stage.", options: ["True", "False"], correct: 1, rationale: "False. Not all AKI patients experience an oliguric phase; many have 'non-oliguric' AKI. Progression through the phases varies per patient." },
            { id: 15, question: "Pathological fracture may be caused by severe muscle contractions.", options: ["True", "False"], correct: 1, rationale: "False. Pathological fractures are caused by underlying diseases weakening the bone (like osteoporosis or cancer). Muscle contractions typically cause avulsion fractures." },
            { id: 16, question: "In Impacted Fracture, ends of broken bones are interfered together.", options: ["True", "False"], correct: 0, rationale: "True. An impacted fracture occurs when the broken ends of the bone are forcefully jammed or driven into each other." },
            { id: 17, question: "In patient with lumbar disc herniation, the back appears straight due to muscle spasm.", options: ["True", "False"], correct: 0, rationale: "True. Severe paraspinal muscle spasms act as a protective splint, causing the normal lumbar lordosis (curve) to flatten out, making the back appear straight." },
            { id: 18, question: "The nurse should instruct patients with lumbar disc herniation to avoid applying back brace after surgery as it increases the pressure on the wound.", options: ["True", "False"], correct: 1, rationale: "False. A postoperative back brace is frequently prescribed to stabilize the spine, restrict painful movements, and promote proper healing." },

            // ================= FINAL EXAM MCQ =================
            { id: 19, question: "Fracture with intact skin is named:", options: ["Simple fracture", "Compound fracture", "Open Fracture", "Complex fracture"], correct: 0, rationale: "A simple (closed) fracture is one where the broken bone does not penetrate or break the overlying skin." },
            { id: 20, question: "The early emergency management of patients with fractures is:", options: ["Control hemorrhage if present", "Using splints", "Immobilize the fractured part", "Record motion and sensation of fractured part"], correct: 2, rationale: "In the specific context of fracture management, immobilizing the fractured part is the critical early step to prevent further tissue and nerve damage." },
            { id: 21, question: "Internal fixation devices as:", options: ["Cast", "Nails", "Traction", "Elastic bandages"], correct: 1, rationale: "Nails, screws, plates, and pins are surgically implanted internal fixation devices. Casts and bandages are external." },
            { id: 22, question: "Patient with closed fracture is encouraged to practice isometric exercises to:", options: ["Affected and unaffected muscles", "Affected joints", "Affected and unaffected joints", "Unaffected joints"], correct: 0, rationale: "Isometric exercises (muscle contraction without joint movement) prevent muscle atrophy in both the affected limb (inside the cast) and unaffected limbs." },
            { id: 23, question: "Compartment syndrome characterized by:", options: ["Pain, pallor, and pulselessness", "Pain, paralysis and paresthesia", "Pain, paralysis and anesthesia", "Pain, paralysis, and pulselessness"], correct: 0, rationale: "The classic '5 Ps' of compartment syndrome are Pain, Pallor, Pulselessness, Paresthesia, and Paralysis. Option A groups the classic early vascular signs." },
            { id: 24, question: "Delayed complications of fracture include:", options: ["Compartment syndrome", "Fat embolism", "Deep vein thrombosis", "Malunion"], correct: 3, rationale: "Compartment syndrome, DVT, and fat embolism are early/acute complications. Malunion (improper healing over time) is a delayed complication." },
            { id: 25, question: "To prevent joint prosthesis displacement, the patient should use:", options: ["Sling and abduction splint", "Brace and adduction splint", "Sling and adduction splint", "Immobilizer and adduction splint"], correct: 0, rationale: "An abduction splint (wedge) is used post-hip replacement to keep the legs apart, as adduction (crossing legs) causes prosthesis displacement." },
            { id: 26, question: "Over-head trapeze is used for movement in bed for patient post hip replacement to:", options: ["Avoid crossing midline with affected leg", "Avoid weight bearing on the affected leg", "Avoid adduction of the affected leg", "Avoid abduction of the affected leg"], correct: 1, rationale: "The trapeze allows the patient to lift their upper body and pelvis independently, avoiding any weight-bearing stress on the newly operated hip." },
            { id: 27, question: "The nurse teaches patients to use fracture bedpan post Lt total hip replacement as the following:", options: ["Flex Lt hip and use overhead trapeze...", "Flex Rt and Lt hips and use overhead trapeze...", "Flex Rt hip and use overhead trapeze to lift pelvis up onto bedpan.", "Flex Rt and Lt knees and use overhead trapeze..."], correct: 2, rationale: "The patient flexes the unaffected (Right) hip to push up, while keeping the operated (Left) hip straight to avoid excessive flexion and dislocation." },
            { id: 28, question: "Cemented artificial hips are commonly used for patients who:", options: ["Has more activity", "Need early fixation", "Aged around 50 years", "Tolerate more load"], correct: 1, rationale: "Cemented hips provide immediate, early fixation to the bone, allowing faster weight-bearing, typically preferred for older, less active patients." },
            { id: 29, question: "Top of the cane used post hip replacement should be:", options: ["At waist level when standing.", "At hip level when standing.", "At wrist level when standing.", "At elbow level when standing."], correct: 1, rationale: "The cane should be at the level of the greater trochanter (hip level) or wrist crease to allow a slight 15-30 degree elbow flexion." },
            { id: 30, question: "When using crutches the first step is:", options: ["Place the crutches one step ahead", "Place the unaffected leg one step ahead", "Place the affected leg one step ahead", "Place the crutches and affected leg one step ahead"], correct: 0, rationale: "The standard sequence begins with moving the assistive device (crutches) forward first to establish a stable base." },
            { id: 31, question: "Which of the following methods categorize burns according to the percentage of total body surface area (TBSA)?", options: ["Palm method", "Rule of nines", "Lund and Browder method", "Rule of fives"], correct: 1, rationale: "The 'Rule of Nines' is the standard, rapid clinical method used to estimate the percentage of TBSA affected by a burn." },
            { id: 32, question: "Which of the following are characteristic of the deep partial thickness burn:", options: ["Red and painful with clear blisters", "Completely healed in less than 2 weeks", "Painless and charred", "Yellow or white with less blanching"], correct: 3, rationale: "Deep partial-thickness burns extend deep into the dermis, appearing mottled, yellow or white, with decreased pain sensation and sluggish/less blanching." },
            { id: 33, question: "Which of the following methods is recommended for cooling a burn?", options: ["Applying ice directly to the burn", "Covering it with a wet cloth", "Using running water", "Using alcohol wipes"], correct: 2, rationale: "Cool running water is the recommended first-aid to stop the burning process. Ice causes vasoconstriction and exacerbates tissue damage." },
            { id: 34, question: "Which of the following changes occur in fluid distribution within the first few hours after a burn?", options: ["Fluid shift causes hemoconcentration due to capillary damage", "Fluid moves from the interstitial space to the intravascular space", "Overall fluid volume remains stable", "Increased fluid retention in the intravascular space"], correct: 0, rationale: "Burn trauma increases capillary permeability, causing intravascular plasma to leak into tissues. The loss of plasma leaves the remaining blood highly concentrated (hemoconcentration)." },
            { id: 35, question: "Which of the following is common hematological change following a burn injury?", options: ["Increased platelet count", "Increased red blood cell count", "Thrombocytopenia", "Hypercoagulability"], correct: 1, rationale: "Due to the massive fluid shift out of the vessels (plasma loss), there is a relative increase in the red blood cell count and hematocrit (hemoconcentration)." },
            { id: 36, question: "Which of the following pulmonary affection signs are considered indicative of burn injury?", options: ["Hypotension and dizziness", "Decreased heart rate and blood pressure", "Increased appetite and thirst", "Hoarseness, dry cough, and tachypnea"], correct: 3, rationale: "Hoarseness, dry cough, and tachypnea are cardinal signs of inhalation injury (pulmonary affection) resulting from inhaling smoke or hot gases." },
            { id: 37, question: "Which of the following may result from the constriction of blood vessels:", options: ["Decreased cardiac rate", "Compartment syndrome", "Increased blood flow to tissues.", "Fluid overload"], correct: 1, rationale: "Severe circumferential burns can act like a tourniquet, constricting blood vessels and tissues, leading to compartment syndrome." },
            { id: 38, question: "The primary characteristic in patients with Chronic Obstructive Pulmonary Disease (COPD) is:", options: ["Increased airflow in and out of the lungs", "Complete obstruction of airflow", "Limited airflow in and out of the lungs.", "All of the above"], correct: 2, rationale: "COPD is primarily characterized by progressive, irreversible airflow limitation (obstruction) in and out of the lungs." },
            { id: 39, question: "What is the earliest symptom of chronic bronchitis?", options: ["Chronic productive cough.", "Wheezing", "Dyspnea on exertion", "Cyanosis"], correct: 0, rationale: "A chronic, productive cough (often termed 'smoker's cough') is the hallmark and earliest clinical symptom of chronic bronchitis." },
            { id: 40, question: "Prolonged expiration in a patient with Chronic Obstructive Pulmonary Disease indicates which of the following:", options: ["Increased lung capacity", "Decreased mucus production", "Obstructed air passages", "All of the above"], correct: 2, rationale: "Prolonged expiration is a direct result of obstructed air passages and loss of elastic recoil, making it difficult for the patient to push air out." },
            { id: 41, question: "Which of the following inherited conditions primarily associated with an Increased risk of developing emphysema?", options: ["Chronic obstructive pulmonary disease (COPD)", "Asthma", "Alpha-1 antitrypsin deficiency.", "Tuberculosis"], correct: 2, rationale: "Alpha-1 antitrypsin (AAT) deficiency is a genetic disorder that predisposes individuals to severe, early-onset emphysema." },
            { id: 42, question: "What is a common physical examination finding in patients with emphysema?", options: ["A Barrel chest", "Decreased respiratory rate", "Increased breath sounds", "Cyanosis"], correct: 0, rationale: "Chronic air trapping and lung hyperinflation in emphysema alter the chest wall mechanics, leading to a classic 'barrel chest' appearance." },
            { id: 43, question: "What is the characteristic posture of a patient with emphysema during respiratory distress?", options: ["Supine position", "Tripod position", "Lying flat", "Prone position"], correct: 1, rationale: "The tripod position (leaning forward with hands on knees) optimizes the use of accessory muscles to ease breathing distress." },
            { id: 44, question: "A spirometry test in patients with COPD would typically show:", options: ["Increased FEV1 and FVC", "Decreased FEV1 and decreased FVC", "Decreased FEV1 and increased FVC", "Increased FEV1 and decreased FVC"], correct: 1, rationale: "Spirometry in COPD typically shows a decrease in the Forced Expiratory Volume in 1 second (FEV1) and a normal or decreased Forced Vital Capacity (FVC)." },
            { id: 45, question: "Which of the following initial treatments is recommended for inflammation associated with a lumbar herniated disc?", options: ["Heat therapy", "Massage therapy", "Ice application", "Acupuncture"], correct: 2, rationale: "During the acute inflammatory phase (first 48 hours), ice application is recommended to cause vasoconstriction and reduce swelling and pain." },
            { id: 46, question: "The nurse should instruct the patient with lumbar disc herniation to perform all the following exercises to improve muscles strength and decrease pain Except:", options: ["Back extension exercises", "High-impact aerobics exercises", "Abdominal muscle strengthening", "Low back muscle strengthening"], correct: 1, rationale: "High-impact aerobics put massive compressive stress on the intervertebral discs and are contraindicated for herniation patients." },
            { id: 47, question: "In which of the following lumbar surgeries, the patient will have two different wound sites?", options: ["Artificial disc", "Laminectomy", "Discectomy with fusion", "Percutaneous laser discectomy."], correct: 2, rationale: "A discectomy with spinal fusion often requires a bone graft, usually taken from the patient's iliac crest, resulting in two surgical wounds." },
            { id: 48, question: "To decrease paresthesia in patients with lumbar disc herniation, the nurse should:", options: ["Use the foot board", "Apply pelvic traction", "Elevate both limbs", "Apply ice application."], correct: 1, rationale: "Pelvic traction gently separates the vertebrae, decompressing the pinched nerve root and thereby decreasing radicular pain and paresthesia." },
            { id: 49, question: "The nurse should instruct the patient with lumbar disc herniation to avoid all the following Except:", options: ["Stretching legs", "Carrying weight more than 2kg.", "Active range of motion exercises", "Straining."], correct: 2, rationale: "Active ROM exercises are encouraged to maintain mobility. The patient MUST avoid heavy lifting, straining, and excessive stretching that pulls the nerve." },
            { id: 50, question: "When 'the gel-like nucleus pulposus breaks through the annulus fibrosus but remains within the disc' refers to:", options: ["Disc Degeneration", "Disc Prolapse", "Disc Extrusion.", "Disc Sequestration"], correct: 1, rationale: "A disc prolapse (or protrusion) occurs when the nucleus bulges through the inner annulus layers but is still contained by the outermost layers." },
            { id: 51, question: "A pneumococcal polysaccharide vaccine is recommended for all the following patients Except those with:", options: ["Cigarette smoking", "Chronic lung disease.", "Chronic heart disease", "Organ transplantation"], correct: 3, rationale: "Severely immunocompromised patients (like organ transplants) require the Conjugate vaccine (PCV) first, not just the polysaccharide (PPSV23) vaccine." },
            { id: 52, question: "Which of the following classifications of pneumonia is associated with a high mortality rate?", options: ["Health care-associated pneumonia", "Hospital-acquired pneumonia", "Community-acquired pneumonia", "Ventilator-associated pneumonia"], correct: 3, rationale: "Ventilator-associated pneumonia (VAP) carries the highest mortality rate due to highly virulent, multidrug-resistant hospital pathogens." },
            { id: 53, question: "All the following key elements play an important role in the prevention of ventilator-associated pneumonia Except:", options: ["Elevation of the head of the bed", "Daily oral care with chlorhexidine", "Daily sedation vacations.", "Isolation of patient in a separated room"], correct: 3, rationale: "The 'VAP Bundle' includes HOB elevation, strict oral care, and sedation vacations. General room isolation is not a direct VAP prevention strategy." },
            { id: 54, question: "All the following diseases are complications of pneumonia Except:", options: ["Sepsis and septic shock", "Atelectasis", "Direct complications", "Delirium"], correct: 2, rationale: "'Direct complications' is not a specific medical disease or condition, unlike sepsis, atelectasis, and delirium." },
            { id: 55, question: "If the patient with pneumonia is unable to cough effectively, the nurse should remove the mucus through:", options: ["Deep breathing and coughing exercises", "Postural drainage to the patient.", "Nasotracheal suctioning.", "Positioning the patient in supine position"], correct: 2, rationale: "If the patient is too weak to cough effectively and clear their own airway, mechanical nasotracheal suctioning is required to remove the secretions." },
            { id: 56, question: "A patient who is currently a resident in a nursing home, comes to the outpatient chest clinic complaining of pleuritic chest pain, tachypnea, and body temp. was 39°C. Which type of pneumonia was diagnosed?", options: ["Health care-associated pneumonia", "Hospital-acquired pneumonia", "Ventilator acquired pneumonia", "Community-acquired pneumonia"], correct: 0, rationale: "Pneumonia developing in a patient living in a long-term care facility (nursing home) is classified as Health Care-Associated Pneumonia (HCAP)." },
            { id: 57, question: "Surgery that is performed for the excision of a tumor or inflamed appendix is known as:", options: ["Diagnostic surgery", "Reconstructive surgery", "Palliative surgery", "Curative surgery"], correct: 3, rationale: "Curative surgery completely removes the diseased organ or tissue (like a tumor or appendix) to cure the condition." },
            { id: 58, question: "The surgery that is scheduled to be performed within weeks or months is referred as:", options: ["Imperative urgent surgery", "Planned or required surgery", "Elective surgery", "Emergent surgery"], correct: 1, rationale: "Required (planned) surgery needs to be done, but can safely be scheduled within a few weeks or months (e.g., cataract removal)." },
            { id: 59, question: "The preoperative checklists provide nurses guidance for immediate preoperative patient preparation. Which of the following nursing actions is incorrect preparation?", options: ["Let's hairpins, wigs, and jewelry in place", "Take vital signs to assess patient status", "Review the presence of signed consent in patient chart", "Verify that the patient is fasting for the last 8 hrs."], correct: 0, rationale: "Leaving hairpins, jewelry, and wigs in place is incorrect and dangerous. They must be removed to prevent electrocautery burns and airway obstruction." },
            { id: 60, question: "Maintaining continuous observations during surgery to anticipate the needs of patients, scrub nurses, surgeons, and anesthesiologists. This is considered from the role of which of the following intraoperative nurses?", options: ["Circulating nurse", "Anesthesia nurse", "Scrub nurse", "Assistant nurse"], correct: 0, rationale: "The circulating nurse acts as the unsterile manager of the OR, continuously observing the team and anticipating their needs." },
            { id: 61, question: "A post-operative total hip replacement patient (post-op day 3) reports left calf pain. The nurse found redness and swelling during the assessment. What complication best explains these findings?", options: ["Positioning during surgery", "Atelectasis", "Wound infection", "Deep vein thrombosis"], correct: 3, rationale: "Unilateral calf pain, redness, and swelling are the classic clinical manifestations of a Deep Vein Thrombosis (DVT), common after orthopedic surgery." },
            { id: 62, question: "The postoperative hiccup that results from toxemia or uremia that stimulate center at dorsal area of medulla is described as:", options: ["Direct", "Indirect", "Reflexive", "Transient"], correct: 0, rationale: "Direct hiccups are caused by systemic conditions (like uremia or toxemia) directly stimulating the hiccup center in the medulla." },
            { id: 63, question: "All the following are considered from the early postoperative complication Except:", options: ["Hemorrhage", "Shock", "Aspiration", "Urinary tract infection"], correct: 3, rationale: "UTIs are generally delayed postoperative complications, developing days later usually secondary to urinary catheterization, while hemorrhage and shock are immediate." },
            { id: 64, question: "When hemodialysis patient becomes restless, disoriented and tells the nurse, he has a headache during hemodialysis. Which of the following complications she suspects?", options: ["Arrhythmias", "Air embolism", "Infection", "Disequilibrium syndrome"], correct: 3, rationale: "Dialysis disequilibrium syndrome is caused by rapid shifts of fluids and solutes in the brain, presenting as headache, restlessness, and disorientation." },
            { id: 65, question: "A patient is admitted to an emergency unit with massive bleeding and the patient is at risk for acute renal failure. The cause is considered...", options: ["post-renal causes", "pre-renal causes", "Intra-renal causes", "Intrinsic renal causes"], correct: 1, rationale: "Massive bleeding causes profound hypotension and hypovolemia, drastically reducing blood flow to the kidneys, which is a classic 'pre-renal' cause of AKI." },
            { id: 66, question: "What is a common problem associated with peritoneal dialysis?", options: ["Nausea", "Insomnia", "Peritoneal infection", "Respiratory problems"], correct: 2, rationale: "Peritonitis (peritoneal infection) is the most frequent and serious complication of peritoneal dialysis." },
            { id: 67, question: "The first action should the nurse do to start hemodialysis through an Arteriovenous (AV) fistula in the left arm is:", options: ["Keeping the AV fistula site dry", "Assessing the AV fistula for a bruit and thrill", "Keeping the AV fistula wrapped in gauze", "Taking the blood pressure from the left arm"], correct: 1, rationale: "Before initiating dialysis, the nurse MUST assess the patency of the AV fistula by palpating for a thrill and listening for a bruit." },
            { id: 68, question: "The nurse should maintain the drain time for the patient on peritoneal dialysis at the prescribed time to avoid which complication:", options: ["Hyperglycemia", "Fluid overload", "Infection", "Disequilibrium syndrome"], correct: 1, rationale: "Inadequate drain time leaves excess dialysate fluid inside the peritoneal cavity, quickly leading to dangerous fluid overload." },
            { id: 69, question: "The nurse was instilling 1200 ml of dialysate solution for patients undergoing peritoneal dialysis only 400 ml was drained. What should she do?", options: ["Place the patient on supine position", "Clamp the catheter and notify the doctor", "Instill 800 ml of dialysate solution", "Check the catheter for obstruction"], correct: 3, rationale: "If drainage is inadequate, the primary nursing action is to check the catheter for kinks or obstruction, and reposition the patient to facilitate gravity drainage." },
            { id: 70, question: "A patient with Acute renal failure has the following labs: GFR 95 mL/min, Blood Urea Nitrogen 27 mg/dL, Potassium 3.9 mEq/L and Creatinine 1 mg/dL. The patient's 24-hour urinary output is 1800 ml. Based on these findings, what is the phase of acute renal failure?", options: ["Initiation phase", "Oliguric phase", "Diuresis phase", "Recovery phase"], correct: 3, rationale: "Normalization of GFR, Potassium, and Creatinine alongside stable urine output strictly indicates the patient has entered the Recovery phase." },
            { id: 71, question: "All the following can be used to manage cerebral edema before intracranial surgery (ICS) Except:", options: ["Diuretic", "Hyperosmolar agent", "Valium", "Dexamethasone"], correct: 2, rationale: "Valium (Diazepam) is an anti-anxiety/anticonvulsant medication. Unlike Mannitol or Dexamethasone, it does NOT reduce cerebral edema." },
            { id: 72, question: "To prevent infection in patients undergone intracranial surgeries, all the following should be done EXCEPT:", options: ["Assess for a complaint of neck rigidity", "Instruct the patient to avoid coughing", "Assess for dilated pupil on the operative side", "Reinforce a blood stained dressing with sterile dressings"], correct: 2, rationale: "Assessing for a dilated pupil is an evaluation of Intracranial Pressure (ICP) and neurological deterioration, not an infection prevention measure." },
            { id: 73, question: "Which of the following is the correct incision location for infratentorial ICS?", options: ["At the nape of the neck.", "Beneath the upper lip.", "Beyond hair line.", "Beyond the third ventricle."], correct: 0, rationale: "The infratentorial approach accesses the posterior fossa (cerebellum/brainstem), requiring an incision at the back of the head (nape of the neck)." },
            { id: 74, question: "In which of the following intracranial surgeries, protective helmet may be prescribed for patients?", options: ["Burr holes", "Craniotomy", "Craniectomy", "Transsphenoidal surgery"], correct: 2, rationale: "A craniectomy involves the removal of a portion of the skull without replacing it. A helmet is required to protect the exposed brain tissue." },
            { id: 75, question: "If the nurse suspected cerebrospinal fluid (CSF) leakage and wanted to differentiate between the CSF and mucus in post ICS, which of the following will be used?", options: ["CSF monitoring.", "Observing Cushing's Triad.", "Dextrostix.", "Serum electrolyte monitoring."], correct: 2, rationale: "CSF contains glucose, whereas nasal mucus does not. A Dextrostix tests the fluid for glucose, confirming if it is CSF." },
            { id: 76, question: "The nurse observed the following (decreased serum sodium and serum osmolality, edema) on a patient who has undergone pituitary tumor excision. Which of the following may cause these signs?", options: ["Duodenal ulcer.", "Diabetes insipidus.", "Dural venous sinus thrombus.", "Syndrome of Inappropriate Antidiuretic Hormone Secretion"], correct: 3, rationale: "SIADH involves excessive ADH release, causing water retention, dilutional hyponatremia (low sodium), and decreased serum osmolality." },

            // ================= FINAL EXAM TRUE/FALSE =================
            { id: 77, question: "Sprain is an injury to tendons, bone and ligaments.", options: ["True", "False"], correct: 1, rationale: "False. A sprain is specifically an injury to ligaments (bone-to-bone connections). An injury to muscle/tendon is a 'strain'." },
            { id: 78, question: "Reduction means immobilization of fractured bone.", options: ["True", "False"], correct: 1, rationale: "False. Reduction is the process of manually realigning the broken bone fragments back to their normal anatomical position." },
            { id: 79, question: "Prevention of infection is necessary before total hip replacement surgery, it may result from urinary, skin and wound infections.", options: ["True", "False"], correct: 0, rationale: "True. Any systemic infection must be cleared before joint replacement to prevent catastrophic seeding of bacteria into the new prosthetic joint." },
            { id: 80, question: "Length of dislocated hip is decreased.", options: ["True", "False"], correct: 0, rationale: "True. A dislocated hip typically presents with a visibly shortened limb that is abnormally rotated." },
            { id: 81, question: "Hypokalemia is a common electrolyte imbalance associated with burns.", options: ["True", "False"], correct: 1, rationale: "False. Hyperkalemia (high potassium) is the immediate and dangerous imbalance due to massive cell destruction releasing intracellular potassium." },
            { id: 82, question: "Thermal burns are caused by direct contact with hot liquids.", options: ["True", "False"], correct: 0, rationale: "True. Thermal burns result from exposure to heat, including hot liquids (scalds), open flames, and hot surfaces." },
            { id: 83, question: "Chronic bronchitis is characterized by destruction of alveolar walls.", options: ["True", "False"], correct: 1, rationale: "False. The destruction of alveolar walls is the defining characteristic of Emphysema, not Chronic Bronchitis." },
            { id: 84, question: "Inhaled bronchodilators are not used to manage symptoms in both emphysema and chronic bronchitis.", options: ["True", "False"], correct: 1, rationale: "False. Inhaled bronchodilators are the absolute primary medical treatment for managing airway obstruction in all COPD conditions." },
            { id: 85, question: "Conservative treatment for patients with lumbar disc herniation should stop after 6 weeks if no improvement is noticed.", options: ["True", "False"], correct: 0, rationale: "True. If 6 weeks of conservative therapy fails to relieve symptoms, surgical intervention is typically evaluated and recommended." },
            { id: 86, question: "The nurse should instruct patients with lumbar disc herniation to avoid applying back brace after surgery as it increases the pressure on the wound.", options: ["True", "False"], correct: 1, rationale: "False. A back brace is prescribed postoperatively to stabilize the spine and promote healing, not to compress the wound." },
            { id: 87, question: "Patients with pneumonia must be instructed to engage in only moderate activity during the initial phases of treatment.", options: ["True", "False"], correct: 1, rationale: "False. Strict bed rest is essential during the initial acute phase to conserve energy and reduce the body's metabolic oxygen demands." },
            { id: 88, question: "The incidence of bronchopneumonia is less common than lobar pneumonia.", options: ["True", "False"], correct: 1, rationale: "False. Bronchopneumonia (patchy consolidation across multiple areas) is clinically much more common than lobar pneumonia." },
            { id: 89, question: "Medullary depression is the stage that refers to proper induction of general anesthesia.", options: ["True", "False"], correct: 1, rationale: "False. Medullary depression (Stage IV) represents severe, dangerous overdose. Stage III is the proper surgical anesthesia stage." },
            { id: 90, question: "The risk of foreign object retention in the intraoperative patient's wound is not easily preventable.", options: ["True", "False"], correct: 1, rationale: "False. Retained foreign objects are highly preventable through strict, rigorous surgical counting protocols of all instruments and sponges." },
            { id: 91, question: "Gastrointestinal bleeding and increased gastric acid production is considered signs and symptoms of chronic renal failure.", options: ["True", "False"], correct: 0, rationale: "True. Uremia associated with chronic renal failure leads to severe mucosal inflammation, increasing gastric acid and the risk of GI bleeding." },
            { id: 92, question: "When continuous ambulatory peritoneal dialysis is performed, 400 mL of dialysate is instilled by gravity through the catheter in 30 to 40 minutes.", options: ["True", "False"], correct: 1, rationale: "False. In CAPD, a much larger volume (typically 2000 mL) is instilled over a shorter period of 10 to 20 minutes." },
            { id: 93, question: "Before intracranial surgery, the patient should shower the hair with preferred cleansing solution.", options: ["True", "False"], correct: 0, rationale: "True. Preoperative hair washing with antimicrobial solution drastically reduces scalp microbial flora and prevents surgical site infections." },
            { id: 94, question: "After transsphenoidal surgery, the nasal packing should be changed, if it is soaked with blood, with another sterile one.", options: ["True", "False"], correct: 1, rationale: "False. Nasal packing after this surgery MUST NEVER be removed by the nurse, as it can dislodge the surgical graft and cause a massive CSF leak." }
        ];

        // --- 2. SHUFFLE & RENDER LOGIC (DO NOT EDIT) ---
        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Excellent Work!" : "Keep Studying, You can do it!";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
