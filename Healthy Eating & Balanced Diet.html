<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Noto Sans', 'Cairo', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .hidden-content { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn:disabled { cursor: default; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="pb-12 bg-gray-50">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm p-8 mb-8 text-center border-t-4 border-blue-600 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fas fa-user-md text-8xl text-blue-600"></i></div>
            
            <h1 class="text-3xl font-bold text-gray-800 mb-2 font-cairo text-center" dir="auto">Healthy Eating & Balanced Diet</h1>
            
            <div class="flex items-center justify-center gap-2 text-green-600 font-semibold bg-green-50 w-fit mx-auto px-4 py-1 rounded-full text-sm">
                <i class="fas fa-check-circle"></i> "تم صنع هذا الامتحان بواسطة عبدالحليم رزق"
            </div>
        </div>
        <div id="quiz-container"></div>
        <div id="result-summary" class="hidden-content bg-white rounded-2xl shadow-lg p-8 text-center mt-8 border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800">Exam Completed</h2>
            <div class="mt-4 text-4xl font-bold text-blue-600 mb-2">
                <span id="score-display">0</span> <span class="text-xl text-gray-400" id="total-display"></span>
            </div>
            <p id="score-message" class="text-gray-500 mb-6"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-3 rounded-xl hover:bg-blue-700 transition shadow-lg hover:shadow-blue-200">
                <i class="fas fa-redo mr-2"></i> Restart Exam
            </button>
        </div>
    </div>

    <script>
        const rawQuizData = [
            { 
                id: 1, 
                question: "Two cups of raw leafy greens count as one standard cup of vegetables.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "According to serving size guidelines, two cups of raw leafy greens equal one standard cup of vegetables." 
            },
            { 
                id: 2, 
                question: "What is the maximum recommended daily intake of sodium to prevent hypertension according to the guidelines?", 
                options: ["Two grams", "Three grams", "Four grams", "Five grams"], 
                correct: 0, 
                rationale: "The guidelines state that keeping salt intake below 5 grams per day is equivalent to less than 2 grams of sodium per day." 
            },
            { 
                id: 3, 
                question: "Which item is excluded from the vegetable section of the Healthy Eating Plate due to its impact on blood sugar?", 
                options: ["Potatoes", "Carrots", "Broccoli", "Spinach"], 
                correct: 0, 
                rationale: "Potatoes do not count as vegetables on the Healthy Eating Plate due to their negative impact on blood sugar." 
            },
            { 
                id: 4, 
                question: "Which nutrient combination is primarily responsible for enhancing bone density and strength?", 
                options: ["Calcium and vitamin D", "Iron and vitamin C", "Potassium and magnesium", "Sodium and phosphorus"], 
                correct: 0, 
                rationale: "Calcium, vitamin D, and other minerals are essential for bone density and strength, reducing the risk of osteoporosis." 
            },
            { 
                id: 5, 
                question: "Complementary foods introduced at six months of age should include small amounts of added salt and sugar to enhance taste.", 
                options: ["True", "False"], 
                correct: 1, 
                rationale: "Salt and sugar should not be added to complementary foods for infants and young children." 
            },
            { 
                id: 6, 
                question: "What is the ideal target percentage of total energy intake from free sugars for enhanced health benefits?", 
                options: ["Less than five percent", "Less than ten percent", "Less than fifteen percent", "Less than twenty percent"], 
                correct: 0, 
                rationale: "While less than 10% is recommended, the ideal target is less than 5% for additional health benefits." 
            },
            { 
                id: 7, 
                question: "Which chronic disease is strongly associated with the rising need for global nutrition prioritization?", 
                options: ["Type two diabetes", "Multiple sclerosis", "Rheumatoid arthritis", "Chronic asthma"], 
                correct: 0, 
                rationale: "Prioritizing nutrition is an imperative due to rising rates of chronic diseases such as obesity, cardiovascular diseases, and type 2 diabetes." 
            },
            { 
                id: 8, 
                question: "One and a half ounces of natural cheese counts as one cup of milk equivalent.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "One cup of milk or yogurt, 1.5 ounces of natural cheese, or 2 ounces of processed cheese counts as one cup." 
            },
            { 
                id: 9, 
                question: "What proportion of the Healthy Eating Plate should be composed of whole grains?", 
                options: ["One quarter", "One third", "One half", "Two thirds"], 
                correct: 0, 
                rationale: "The Healthy Eating Plate recommends that one quarter of your plate consists of whole grains." 
            },
            { 
                id: 10, 
                question: "How many grams of fruits and vegetables are considered adequate for daily intake?", 
                options: ["Four hundred grams", "Three hundred grams", "Five hundred grams", "Six hundred grams"], 
                correct: 0, 
                rationale: "Adequate intake is at least 400 grams or five portions of fruits and vegetables per day." 
            },
            { 
                id: 11, 
                question: "How much cooked rice represents a standard one ounce grain equivalent serving?", 
                options: ["One half cup", "One quarter cup", "One third cup", "One full cup"], 
                correct: 0, 
                rationale: "One half cup of cooked rice, pasta, or cooked cereal counts as a one ounce equivalent." 
            },
            { 
                id: 12, 
                question: "Exclusive breastfeeding is highly recommended for the first entire year of an infant life.", 
                options: ["True", "False"], 
                correct: 1, 
                rationale: "Infants should be exclusively breastfed for the first 6 months of life, not the entire first year." 
            },
            { 
                id: 13, 
                question: "What is the recommended maximum limit for total daily energy intake derived from dietary fats?", 
                options: ["Thirty percent", "Twenty percent", "Forty percent", "Fifty percent"], 
                correct: 0, 
                rationale: "Controlled fat intake should be less than 30% of total energy intake, preferring unsaturated fats." 
            },
            { 
                id: 14, 
                question: "Which type of fat should be completely avoided due to its adverse health effects?", 
                options: ["Partially hydrogenated oils", "Cold pressed olive oils", "Refined peanut oils", "Natural soybean oils"], 
                correct: 0, 
                rationale: "Partially hydrogenated oils contain unhealthy trans fats and should be avoided." 
            },
            { 
                id: 15, 
                question: "The visual representation on the Healthy Eating Plate emphasizes the need for regular physical activity.", 
                options: ["True", "False"], 
                correct: 0, 
                rationale: "The person running on the Healthy Eating Plate serves as a reminder that physical activity is equally important for weight control and health." 
            },
            { 
                id: 16, 
                question: "Which component of a healthy diet is most directly responsible for promoting regular bowel movements?", 
                options: ["Dietary fiber", "Lean protein", "Complex carbohydrates", "Unsaturated fats"], 
                correct: 0, 
                rationale: "Fiber-rich foods promote regular bowel movements and a healthy gut microbiome." 
            },
            { 
                id: 17, 
                question: "In a standard two thousand calorie diet roughly how many grams of free sugars represent the ten percent upper limit?", 
                options: ["Fifty grams", "Forty grams", "Sixty grams", "Seventy grams"], 
                correct: 0, 
                rationale: "Less than 10% of total energy intake from free sugars is approximately 50g for a 2000-calorie diet." 
            },
            { 
                id: 18, 
                question: "What is the maximum recommended daily intake of milk and dairy products for adults?", 
                options: ["Two servings", "Three servings", "Four servings", "Five servings"], 
                correct: 0, 
                rationale: "The Healthy Eating Plate advises limiting milk and dairy products to one to two servings per day." 
            },
            { 
                id: 19, 
                question: "Which essential element must be consumed in proper amounts alongside diverse foods to maintain a healthy weight?", 
                options: ["Fluids", "Supplements", "Probiotics", "Electrolytes"], 
                correct: 0, 
                rationale: "A healthy diet involves consuming diverse foods in appropriate proportions alongside the right amount of fluids." 
            },
            { 
                id: 20, 
                question: "Adequate intake of vitamins and antioxidants is specifically highlighted to support the integrity of which organs?", 
                options: ["Skin teeth and eyes", "Heart lungs and liver", "Brain nerves and spinal cord", "Kidneys bladder and pancreas"], 
                correct: 0, 
                rationale: "Adequate intake of vitamins, minerals, and antioxidants supports the health and integrity of the skin, teeth, and eyes." 
            }
        ];

        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
</body>
</html>
