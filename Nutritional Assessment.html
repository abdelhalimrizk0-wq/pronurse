<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Noto Sans', 'Cairo', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .hidden-content { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn:disabled { cursor: default; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="pb-12 bg-gray-50">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm p-8 mb-8 text-center border-t-4 border-blue-600 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fas fa-user-md text-8xl text-blue-600"></i></div>
            
            <h1 class="text-3xl font-bold text-gray-800 mb-2 font-cairo text-center" dir="auto">Nutritional Assessment Quiz</h1>
            
            <div class="flex items-center justify-center gap-2 text-green-600 font-semibold bg-green-50 w-fit mx-auto px-4 py-1 rounded-full text-sm">
                <i class="fas fa-check-circle"></i> "تم صنع هذا الامتحان بواسطة عبدالحليم رزق"
            </div>
        </div>
        <div id="quiz-container"></div>
        <div id="result-summary" class="hidden-content bg-white rounded-2xl shadow-lg p-8 text-center mt-8 border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800">Exam Completed</h2>
            <div class="mt-4 text-4xl font-bold text-blue-600 mb-2">
                <span id="score-display">0</span> <span class="text-xl text-gray-400" id="total-display"></span>
            </div>
            <p id="score-message" class="text-gray-500 mb-6"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-3 rounded-xl hover:bg-blue-700 transition shadow-lg hover:shadow-blue-200">
                <i class="fas fa-redo mr-2"></i> Restart Exam
            </button>
        </div>
    </div>

    <script>
        // --- 1. QUESTIONS ARRAY (GENERATE 50 QUESTIONS HERE) ---
        const rawQuizData = [
            {
                id: 1,
                question: "Skinfold thickness primarily measures the deep visceral fat surrounding internal organs.",
                options: ["True", "False"],
                correct: 1,
                rationale: "Skinfold thickness measures subcutaneous fat at specific body sites using calipers, not deep visceral fat."
            },
            {
                id: 2,
                question: "Which specific clinical finding during a physical examination strongly indicates a deficiency in essential fatty acids and vitamin A?",
                options: ["Dry and scaly skin", "Spoon shaped nails", "Swollen bleeding gums", "Pale conjunctival tissue"],
                correct: 0,
                rationale: "Dry and scaly skin is a characteristic sign of essential fatty acid and Vitamin A deficiency."
            },
            {
                id: 3,
                question: "What is the primary advantage of conducting a biochemical nutritional assessment over a standard clinical evaluation?",
                options: ["It detects subclinical malnutrition early", "It determines gross body composition", "It evaluates the patient living environment", "It relies on visible physical symptoms"],
                correct: 0,
                rationale: "Biochemical tests provide objective data that can confirm deficiencies or excesses and detect subclinical malnutrition before physical signs appear."
            },
            {
                id: 4,
                question: "Which body mass index range indicates a normal and healthy weight according to international standards?",
                options: ["Eighteen point five to twenty four point nine", "Twenty five to twenty nine point nine", "Thirty to thirty four point nine", "Less than eighteen point five"],
                correct: 0,
                rationale: "A BMI of 18.5 to 24.9 is universally classified as the healthy weight range."
            },
            {
                id: 5,
                question: "The twenty four hour dietary recall method guarantees a perfectly accurate representation of an individual's typical long term eating habits.",
                options: ["True", "False"],
                correct: 1,
                rationale: "The 24-hour recall relies on memory and may not represent typical or long-term intake accurately."
            },
            {
                id: 6,
                question: "Which specific physical measurement directly screens for acute malnutrition during emergencies?",
                options: ["Mid upper arm circumference", "Waist to hip ratio", "Subcutaneous skinfold thickness", "Total head circumference"],
                correct: 0,
                rationale: "Mid-Upper Arm Circumference is a simple and effective measure particularly useful for screening acute malnutrition in emergency settings."
            },
            {
                id: 7,
                question: "Which nutritional deficiency is classically associated with the development of spoon shaped fingernails?",
                options: ["Iron deficiency", "Biotin deficiency", "Calcium deficiency", "Riboflavin deficiency"],
                correct: 0,
                rationale: "Spoon-shaped nails are a direct and specific clinical sign of iron deficiency."
            },
            {
                id: 8,
                question: "What does an elevated waist to hip ratio primarily indicate when assessing human health risks?",
                options: ["Abdominal fat accumulation", "Total lean muscle mass", "Subcutaneous fluid retention", "Overall skeletal density"],
                correct: 0,
                rationale: "A higher Waist-to-Hip Ratio indicates greater central adiposity or abdominal fat accumulation."
            },
            {
                id: 9,
                question: "The body mass index calculation precisely quantifies the exact percentage of total body fat in highly muscular individuals.",
                options: ["True", "False"],
                correct: 1,
                rationale: "BMI does not directly measure body fat and can be highly misleading in individuals with a high muscle mass."
            },
            {
                id: 10,
                question: "Which assessment parameter is essential for evaluating healthy brain development in children under two years of age?",
                options: ["Head circumference", "Total body length", "Upper arm circumference", "Abdominal skinfold thickness"],
                correct: 0,
                rationale: "Measuring the head circumference in infants less than two years old assesses brain development."
            },
            {
                id: 11,
                question: "Which specific blood test serves as a primary biochemical marker for evaluating human protein status?",
                options: ["Serum albumin", "Blood glucose", "Total hematocrit", "Serum triglycerides"],
                correct: 0,
                rationale: "Serum albumin and prealbumin are direct biochemical markers of protein status."
            },
            {
                id: 12,
                question: "Which distinct clinical symptom affecting the mouth is commonly observed due to a severe deficiency in riboflavin?",
                options: ["Cheilosis", "Glossitis", "Night blindness", "Muscle wasting"],
                correct: 0,
                rationale: "Cheilosis, which affects the mouth and lips, is a clinical sign of riboflavin deficiency."
            },
            {
                id: 13,
                question: "What is the primary diagnostic objective of measuring the lipid panel during a biochemical assessment?",
                options: ["To evaluate cardiovascular risk", "To detect subclinical anemia", "To assess carbohydrate metabolism", "To measure total hydration status"],
                correct: 0,
                rationale: "The lipid panel, including cholesterol and triglycerides, is used to assess fat metabolism and cardiovascular risk."
            },
            {
                id: 14,
                question: "Measuring the mid upper arm circumference is a highly complex and invasive procedure requiring specialized surgical instruments.",
                options: ["True", "False"],
                correct: 1,
                rationale: "MUAC is a simple, non-invasive, and effective measure used for rapid screening."
            },
            {
                id: 15,
                question: "Which dietary assessment method requires the patient to meticulously document all consumed items over a consecutive period of several days?",
                options: ["Food diary", "Food frequency questionnaire", "Twenty four hour recall", "Observed food consumption"],
                correct: 0,
                rationale: "A Food Diary or Record involves the individual recording all foods and beverages consumed over a period of 3 to 7 days."
            },
            {
                id: 16,
                question: "Which underlying condition is typically suspected when a clinician observes distinct pallor in the conjunctival tissue of the eyes?",
                options: ["Iron deficiency", "Vitamin A deficiency", "Calcium deficiency", "Protein deficiency"],
                correct: 0,
                rationale: "Conjunctival pallor is a characteristic clinical sign of iron deficiency."
            },
            {
                id: 17,
                question: "Which physical finding during a clinical examination directly suggests a deficiency in protein or biotin?",
                options: ["Dry and sparse hair", "Severely swollen gums", "Spoon shaped fingernails", "Flaky and scaly skin"],
                correct: 0,
                rationale: "Dry, brittle, and sparse hair indicates a deficiency in protein or biotin."
            },
            {
                id: 18,
                question: "Which category of nutritional assessment focuses on evaluating the individual's living conditions and ability to purchase meals?",
                options: ["Environmental assessment", "Dietary assessment", "Clinical assessment", "Anthropometric assessment"],
                correct: 0,
                rationale: "Environmental assessment considers aspects of living conditions that affect the ability to purchase, prepare, or consume food."
            },
            {
                id: 19,
                question: "What is the standard measurement defined as the longest horizontal dimension used for assessing infants?",
                options: ["Horizontal length", "Vertical standing height", "Total body mass", "Cranial circumference"],
                correct: 0,
                rationale: "For infants under two years, length is defined as the longest horizontal dimension of the body."
            },
            {
                id: 20,
                question: "Environmental assessment primarily involves analyzing the metabolic byproducts found in routine patient urine samples.",
                options: ["True", "False"],
                correct: 1,
                rationale: "Environmental assessment evaluates living conditions and social factors, whereas biochemical assessment analyzes urine samples."
            },
            {
                id: 21,
                question: "Which visible clinical finding on the skin is characteristically associated with a severe deficiency in vitamin K?",
                options: ["Unexplained bruising", "Night blindness", "Severe bone pain", "Muscle wasting"],
                correct: 0,
                rationale: "Bruising on the skin is a clinical sign associated with a deficiency in Vitamin C or Vitamin K."
            },
            {
                id: 22,
                question: "Which specific dietary evaluation tool asks individuals to report how often they eat certain foods over the past month or year?",
                options: ["Food frequency questionnaire", "Twenty four hour recall", "Food dietary record", "Observed food consumption"],
                correct: 0,
                rationale: "The Food Frequency Questionnaire assesses the frequency of consumption of specific foods over a defined period."
            },
            {
                id: 23,
                question: "Which specific positioning technique is required when correctly measuring a standing adult's physical height?",
                options: ["Looking straight ahead in the Frankfurt plane", "Bending the knees slightly for balance", "Placing the arms firmly across the chest", "Tilting the head backwards gently"],
                correct: 0,
                rationale: "Proper height measurement requires the patient to look straight ahead in the Frankfurt plane, with heels and back touching the wall."
            },
            {
                id: 24,
                question: "Which specific biochemical laboratory indicator is utilized primarily to screen patients for diabetes?",
                options: ["Blood glucose", "Serum albumin", "Total hematocrit", "Lipid panel"],
                correct: 0,
                rationale: "Blood glucose is specifically used to assess carbohydrate metabolism and screen for diabetes."
            },
            {
                id: 25,
                question: "Why does the observed food consumption method generally yield the most highly accurate dietary intake data?",
                options: ["It is conducted in controlled settings", "It relies entirely on patient memory", "It requires minimal participant effort", "It uses rapid screening checklists"],
                correct: 0,
                rationale: "In controlled settings like hospitals, food intake can be directly observed and measured, providing the most accurate data."
            },
            {
                id: 26,
                question: "Which assessment domain explicitly explores a patient's history of chronic diseases and previous surgical procedures?",
                options: ["Clinical assessment", "Dietary assessment", "Biochemical assessment", "Environmental assessment"],
                correct: 0,
                rationale: "Clinical assessment involves taking a thorough medical history, including chronic diseases and past surgeries."
            },
            {
                id: 27,
                question: "What specific nutritional deficiency is classically responsible for the presentation of swollen and actively bleeding gums?",
                options: ["Vitamin C deficiency", "Vitamin D deficiency", "Protein deficiency", "Iron deficiency"],
                correct: 0,
                rationale: "Swollen and bleeding gums are a characteristic clinical sign of Vitamin C deficiency."
            },
            {
                id: 28,
                question: "Which specialized anthropometric instrument is specifically required to accurately measure subcutaneous fat thickness?",
                options: ["Using specialized calipers", "Using standard measuring tapes", "Using calibrated weight scales", "Using upright stadiometers"],
                correct: 0,
                rationale: "Skinfold thickness is measured at specific body sites using specialized calipers."
            },
            {
                id: 29,
                question: "Which mathematical formula correctly determines the numerical value of an adult's body mass index?",
                options: ["Total weight divided by height squared", "Total height divided by weight squared", "Total weight multiplied by height", "Total height squared multiplied by weight"],
                correct: 0,
                rationale: "Body Mass Index is calculated as weight in kilograms divided by height in meters squared."
            },
            {
                id: 30,
                question: "Which body mass index threshold explicitly defines morbid obesity according to standard global health classifications?",
                options: ["Greater than forty", "Greater than thirty", "Greater than thirty five", "Greater than twenty five"],
                correct: 0,
                rationale: "A BMI greater than 40 is classified as very obese, morbid obesity, or grade 3 obesity."
            }
        ];

        // --- 2. SHUFFLE & RENDER LOGIC (DO NOT EDIT) ---
        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
</body>
</html>
