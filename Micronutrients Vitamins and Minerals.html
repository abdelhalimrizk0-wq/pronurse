<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Noto Sans', 'Cairo', sans-serif; background-color: #f8fafc; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }
        .wrong-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }
        .hidden-content { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn:disabled { cursor: default; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="pb-12 bg-gray-50">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm p-8 mb-8 text-center border-t-4 border-blue-600 relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-10"><i class="fas fa-user-md text-8xl text-blue-600"></i></div>
            
            <h1 class="text-3xl font-bold text-gray-800 mb-2 font-cairo text-center" dir="auto">Micronutrients: Vitamins and Minerals Quiz</h1>
            
            <div class="flex items-center justify-center gap-2 text-green-600 font-semibold bg-green-50 w-fit mx-auto px-4 py-1 rounded-full text-sm">
                <i class="fas fa-check-circle"></i> "تم صنع هذا الامتحان بواسطة عبدالحليم رزق"
            </div>
        </div>
        <div id="quiz-container"></div>
        <div id="result-summary" class="hidden-content bg-white rounded-2xl shadow-lg p-8 text-center mt-8 border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800">Exam Completed</h2>
            <div class="mt-4 text-4xl font-bold text-blue-600 mb-2">
                <span id="score-display">0</span> <span class="text-xl text-gray-400" id="total-display"></span>
            </div>
            <p id="score-message" class="text-gray-500 mb-6"></p>
            <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-3 rounded-xl hover:bg-blue-700 transition shadow-lg hover:shadow-blue-200">
                <i class="fas fa-redo mr-2"></i> Restart Exam
            </button>
        </div>
    </div>

    <script>
        // --- 1. QUESTIONS ARRAY ---
        const rawQuizData = [
            {
                id: 1,
                question: "Minerals are organic compounds synthesized by the body to maintain various physiological functions.",
                options: ["True", "False"],
                correct: 1,
                rationale: "Minerals are inorganic elements that originate from the earth and cannot be synthesized by the body."
            },
            {
                id: 2,
                question: "Which nutrient deficiency is primarily characterized by poor wound healing and gum inflammation?",
                options: ["Ascorbic acid", "Retinol", "Tocopherol", "Phylloquinone"],
                correct: 0,
                rationale: "A deficiency in ascorbic acid causes scurvy, which is characterized by poor wound healing and gum inflammation."
            },
            {
                id: 3,
                question: "Which trace mineral is fundamentally required for the production of thyroid hormones?",
                options: ["Iodine", "Selenium", "Copper", "Zinc"],
                correct: 0,
                rationale: "Iodine is essential for thyroid hormone production and regulating metabolism."
            },
            {
                id: 4,
                question: "Pellagra is a disease characterized by dermatitis and dementia resulting from an inadequate intake of which nutrient?",
                options: ["Niacin", "Thiamin", "Riboflavin", "Pyridoxine"],
                correct: 0,
                rationale: "A deficiency in niacin causes pellagra, which presents with symptoms like dermatitis, diarrhea, and dementia."
            },
            {
                id: 5,
                question: "Fat soluble vitamins are readily excreted from the body and require continuous daily consumption to prevent rapid depletion.",
                options: ["True", "False"],
                correct: 1,
                rationale: "Fat soluble vitamins are stored in the fatty tissues and liver and are not readily excreted."
            },
            {
                id: 6,
                question: "A deficiency in which specific mineral is directly associated with the development of Keshan disease?",
                options: ["Selenium", "Manganese", "Chromium", "Magnesium"],
                correct: 0,
                rationale: "A severe lack of selenium can lead to Keshan disease, which is a specific type of cardiomyopathy."
            },
            {
                id: 7,
                question: "What is a recognized consequence of consuming excessive amounts of the vitamin responsible for calcium absorption?",
                options: ["High blood calcium", "Impaired blood clotting", "Severe liver damage", "Permanent nerve damage"],
                correct: 0,
                rationale: "Excessive vitamin D intake leads to hypercalcemia, which implies excessively high blood calcium levels."
            },
            {
                id: 8,
                question: "Which element is specifically noted for its critical role in maintaining the proper functions of taste and smell?",
                options: ["Zinc", "Iron", "Copper", "Manganese"],
                correct: 0,
                rationale: "Zinc plays a vital role in immune function, wound healing, and maintaining the senses of taste and smell."
            },
            {
                id: 9,
                question: "Cobalamin is predominantly found in plant based foods and leafy green vegetables.",
                options: ["True", "False"],
                correct: 1,
                rationale: "Cobalamin is primarily found in animal products, which is why vegetarians often require supplementation."
            },
            {
                id: 10,
                question: "What is the primary physiological function of tocopherol within the human body?",
                options: ["Protecting cells from damage", "Synthesizing stomach acid", "Regulating blood pressure", "Forming hard bone tissue"],
                correct: 0,
                rationale: "Tocopherol acts as a powerful antioxidant that protects cells from damage caused by free radicals."
            },
            {
                id: 11,
                question: "Which major mineral serves as a structural component of genetic material and high energy molecules?",
                options: ["Phosphorus", "Calcium", "Sodium", "Potassium"],
                correct: 0,
                rationale: "Phosphorus is essential for forming the structure of DNA, RNA, and the cellular energy molecule ATP."
            },
            {
                id: 12,
                question: "Beneficial bacteria residing in the human digestive tract possess the ability to synthesize which essential nutrient?",
                options: ["Vitamin K", "Vitamin C", "Vitamin D", "Vitamin A"],
                correct: 0,
                rationale: "Gut bacteria are naturally capable of producing vitamin K, which contributes to the body's overall supply."
            },
            {
                id: 13,
                question: "Excessive accumulation of which trace mineral is known to induce severe nausea and liver damage?",
                options: ["Copper", "Chromium", "Fluoride", "Iodine"],
                correct: 0,
                rationale: "Copper toxicity can cause immediate gastrointestinal symptoms and potentially severe liver damage."
            },
            {
                id: 14,
                question: "Adequate intake of folate during early pregnancy is critical to prevent neural tube defects in the developing fetus.",
                options: ["True", "False"],
                correct: 0,
                rationale: "Folate is crucial for DNA synthesis and cell division, and its deficiency during pregnancy directly causes neural tube defects."
            },
            {
                id: 15,
                question: "Which mineral functions as a crucial molecular component of human stomach acid?",
                options: ["Chloride", "Sulfur", "Sodium", "Magnesium"],
                correct: 0,
                rationale: "Chloride is a fundamental component of hydrochloric acid, which is necessary for proper stomach digestion."
            },
            {
                id: 16,
                question: "Hypokalemia is a condition characterized by muscle weakness and cardiac arrhythmias due to a lack of which mineral?",
                options: ["Potassium", "Sodium", "Calcium", "Phosphorus"],
                correct: 0,
                rationale: "Hypokalemia refers directly to low levels of potassium, leading to muscle fatigue and irregular heartbeats."
            },
            {
                id: 17,
                question: "The consumption of whole grains and legumes can prevent beriberi by providing an adequate supply of which specific nutrient?",
                options: ["Thiamin", "Riboflavin", "Biotin", "Pyridoxine"],
                correct: 0,
                rationale: "Thiamin deficiency leads to beriberi, and it can be prevented by consuming foods rich in this specific vitamin."
            },
            {
                id: 18,
                question: "Hemochromatosis is a pathological condition resulting from the toxic and excessive accumulation of which trace element?",
                options: ["Iron", "Zinc", "Selenium", "Manganese"],
                correct: 0,
                rationale: "Hemochromatosis is defined as iron toxicity that leads to progressive and severe organ damage."
            },
            {
                id: 19,
                question: "Beta carotene serves as a dietary precursor for the synthesis of retinol within the human body.",
                options: ["True", "False"],
                correct: 0,
                rationale: "Colorful fruits and vegetables provide beta carotene, which the body efficiently converts into active vitamin A."
            },
            {
                id: 20,
                question: "Which micronutrient is recognized for its specific ability to enhance insulin action and improve glucose metabolism?",
                options: ["Chromium", "Fluoride", "Sulfur", "Iodine"],
                correct: 0,
                rationale: "Chromium plays a key role in carbohydrate and lipid metabolism by strongly enhancing the action of insulin."
            },
            {
                id: 21,
                question: "Excessive environmental or dietary exposure to which mineral can lead to severe neurological disorders resembling Parkinson disease?",
                options: ["Manganese", "Selenium", "Copper", "Zinc"],
                correct: 0,
                rationale: "Manganese toxicity is known to cause severe neurological symptoms that mimic the progression of Parkinson disease."
            },
            {
                id: 22,
                question: "Ariboflavinosis presents clinically with cracked lips and a sore throat due to an inadequate intake of which specific nutrient?",
                options: ["Riboflavin", "Niacin", "Thiamin", "Folate"],
                correct: 0,
                rationale: "A deficiency in riboflavin causes ariboflavinosis, which includes visible symptoms like cracked lips and a sore throat."
            },
            {
                id: 23,
                question: "Which fat soluble vitamin is fundamentally essential for maintaining clear vision in low light environments?",
                options: ["Retinol", "Calciferol", "Tocopherol", "Phylloquinone"],
                correct: 0,
                rationale: "Retinol is essential for vision, and its prolonged deficiency leads directly to conditions like night blindness."
            },
            {
                id: 24,
                question: "Discoloration of tooth enamel is a recognized toxic effect associated with consuming excessively high amounts of which element?",
                options: ["Fluoride", "Calcium", "Phosphorus", "Magnesium"],
                correct: 0,
                rationale: "Excessive continuous intake of fluoride leads to fluorosis, which visibly manifests as discoloration of the tooth enamel."
            },
            {
                id: 25,
                question: "Which specific physiological consequence can result from taking exceptionally high supplemental doses of tocopherol?",
                options: ["Interference with blood clotting", "Severe joint inflammation", "Elevated blood pressure", "Rapid bone degeneration"],
                correct: 0,
                rationale: "While generally having low toxicity, very high doses of vitamin E can dangerously interfere with normal blood clotting."
            },
            {
                id: 26,
                question: "Which physiological characteristic fundamentally distinguishes water soluble vitamins from their fat soluble counterparts?",
                options: ["Rapid excretion through urine", "Long term tissue storage", "Dependence on dietary fats", "High potential for toxicity"],
                correct: 0,
                rationale: "Water soluble vitamins are not stored to a significant extent and are readily excreted in the urine."
            },
            {
                id: 27,
                question: "Which specific B complex vitamin is heavily involved in the synthesis of neurotransmitters and overall protein metabolism?",
                options: ["Pyridoxine", "Cobalamin", "Biotin", "Pantothenic acid"],
                correct: 0,
                rationale: "Pyridoxine is critical for protein metabolism and the active synthesis of neurotransmitters in the nervous system."
            },
            {
                id: 28,
                question: "A clinical deficiency in which major mineral frequently manifests as severe muscle cramps and an irregular heartbeat?",
                options: ["Magnesium", "Sulfur", "Chloride", "Chromium"],
                correct: 0,
                rationale: "Magnesium deficiency can lead to significant muscle cramps, profound continuous fatigue, and cardiac arrhythmias."
            },
            {
                id: 29,
                question: "Which element serves primarily as a structural component of specific amino acids and is actively involved in cellular detoxification processes?",
                options: ["Sulfur", "Sodium", "Phosphorus", "Calcium"],
                correct: 0,
                rationale: "Sulfur functions as an essential structural component of amino acids and vitamins while assisting in detoxification."
            },
            {
                id: 30,
                question: "Soft and weak bones in developing children strongly indicate a chronic dietary deficiency of which critical micronutrient?",
                options: ["Calciferol", "Retinol", "Ascorbic acid", "Phylloquinone"],
                correct: 0,
                rationale: "A deficiency in calciferol causes rickets in developing children, resulting in soft and structurally weak bones."
            }
        ];

        // --- 2. SHUFFLE & RENDER LOGIC (DO NOT EDIT) ---
        const quizData = rawQuizData.map(q => {
            const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return { ...q, options: opts.map(o => o.text), correct: opts.findIndex(o => o.isCorrect) };
        });

        const container = document.getElementById('quiz-container');
        let score = 0; let answeredCount = 0;

        function renderQuiz() {
            document.getElementById('total-display').innerText = `/ ${quizData.length}`;
            container.innerHTML = quizData.map((q, index) => {
                return `
                <div class="card bg-white rounded-xl p-6 mb-6 border border-gray-100">
                    <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Question ${index + 1}</span>
                         ${q.options.length === 2 ? '<span class="bg-purple-100 text-purple-800 text-xs font-bold px-2 py-1 rounded-md">True/False</span>' : ''}
                    </div>
                    <h3 class="text-gray-800 font-bold mb-6 text-lg leading-relaxed font-cairo" style="direction: ltr; text-align: left;">${q.question}</h3>
                    <div class="grid gap-3 ${q.options.length === 2 ? 'grid-cols-2' : ''}">
                        ${q.options.map((opt, i) => `<button onclick="checkAnswer(${index}, ${i})" class="option-btn option-btn-${index} w-full text-left px-5 py-4 rounded-xl border border-gray-200 hover:bg-blue-50 hover:border-blue-300 focus:outline-none flex items-center justify-between group bg-white"><span class="font-medium text-gray-700 group-hover:text-blue-700 font-sans">${opt}</span></button>`).join('')}
                    </div>
                    <div id="feedback-${index}" class="hidden-content mt-6 bg-blue-50 rounded-xl p-5 border border-blue-100 animate-fade-in text-left">
                        <p class="text-blue-800 text-sm leading-relaxed"><strong>Rationale:</strong> ${q.rationale}</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.checkAnswer = function(qIndex, optIndex) {
            const q = quizData[qIndex];
            const feedback = document.getElementById(`feedback-${qIndex}`);
            const btns = document.querySelectorAll(`.option-btn-${qIndex}`);
            if (!feedback.classList.contains('hidden-content')) return;
            feedback.classList.remove('hidden-content');
            btns.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) { btn.classList.add('correct-answer'); btn.innerHTML += '<i class="fas fa-check float-right"></i>'; }
                else if (i === optIndex) { btn.classList.add('wrong-answer'); btn.innerHTML += '<i class="fas fa-times float-right"></i>'; }
                else { btn.classList.add('opacity-50'); }
            });
            if (optIndex === q.correct) score++;
            answeredCount++;
            if (answeredCount === quizData.length) {
                document.getElementById('result-summary').classList.remove('hidden-content');
                document.getElementById('score-display').innerText = score;
                document.getElementById('score-message').innerText = (score/quizData.length*100) >= 50 ? "Good Job!" : "Keep Studying";
                setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
            }
        };
        renderQuiz();
    </script>
</body>
</html>
